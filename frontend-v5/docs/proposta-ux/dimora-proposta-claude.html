:root{

}

  --paper:#1b2f3a;--paper-b:#30485a;--paper-ink:#d8e3e8;--shadow:rgba(0,0,0,.45);--focus:#7fd3e6;--demo:#1c3c4c;color-scheme:dark}}
:root[data-theme="dark"]{
  --nav:#0a1a23;--nav-ink:#b5cbd6;--nav-active:#1f3d4c;--hero-accent:#99e5ef;
  --ink:#e3edf2;--muted:#9db3bf;--bg:#0f2230;--card:#152d3c;
  --accent:#5cc3d9;--accent-ink:#06222c;--soft:#1c3c4c;--soft-b:#2a5265;
  --border:#27455a;--field:#4d6c7d;
  --success:#7fd1ad;--success-bg:#173a2e;--warning:#f0c27a;--warning-bg:#3a2e14;--danger:#f19aa1;--danger-bg:#3e1d22;
  --paper:#1b2f3a;--paper-b:#30485a;--paper-ink:#d8e3e8;--shadow:rgba(0,0,0,.45);--focus:#7fd3e6;--demo:#1c3c4c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI',system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:4px 0 6px;text-wrap:balance}
h2{font-size:19px;letter-spacing:-.3px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* barra prova */
.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--demo);padding:6px 16px;font-size:12px}
.demobar span{min-width:0}
.demobar .acts{display:flex;gap:6px;flex-shrink:0}
.demobar button{border:1px solid var(--soft-b);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;min-height:32px}

/* testata */
header.top{background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{font-size:23px;font-weight:800;letter-spacing:-1px;color:#fff}
.addr{flex:1;min-width:0;background:none;border:0;color:var(--nav-ink);text-align:left;font-size:13px;padding:6px 4px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:1px solid transparent;color:#fff;border-radius:10px;min-width:44px;min-height:44px;display:grid;place-items:center}
.iconbtn:hover{background:var(--nav-active)}

.layout{display:block}
aside.side{display:none}
main{padding:20px 16px 120px;max-width:1080px;margin:0 auto}

/* barra in basso */
nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--border);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--muted);position:relative;min-height:56px}
nav.bottom button.active{color:var(--accent);font-weight:700}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--warning);color:var(--card);font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px var(--shadow)}

/* blocchi */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-head .t{min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;margin-bottom:4px;min-height:40px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.card.tint{background:var(--soft);border-color:var(--soft-b)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 14px;min-height:44px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;text-align:left}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:13px 0;text-align:left;color:var(--ink)}
.row:last-child{border-bottom:0}
button.row:hover .row-title{color:var(--accent)}
.row-body{flex:1;min-width:0}
.row-title{display:block;font-weight:650;overflow-wrap:anywhere}
.row-sub{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .amount{font-weight:700}
.ico{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.ico.warn{background:var(--warning-bg);color:var(--warning)}
.ico.ok{background:var(--success-bg);color:var(--success)}
.chev{color:var(--muted);flex-shrink:0}
svg.i{width:20px;height:20px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;background:var(--soft);color:var(--accent);padding:2px 7px;font-size:11px;font-weight:650;white-space:nowrap}
.tag.warn{background:var(--warning-bg);color:var(--warning)}
.tag.ok{background:var(--success-bg);color:var(--success)}
.tag.neutral{background:var(--bg);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--ink);border:1px solid var(--soft-b);border-radius:999px;padding:7px 14px;min-height:40px;font-weight:600}
.chip .n{color:var(--muted);font-weight:500;font-size:12px}
.chip.warn{background:var(--warning-bg);border-color:transparent;color:var(--warning)}
.chip.filter{background:var(--card);border-color:var(--accent);color:var(--accent);padding:5px 8px 5px 12px;min-height:36px;font-size:13px}
.flash{display:flex;align-items:flex-start;gap:10px;background:var(--success-bg);color:var(--success);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.flash .link{padding:0;min-height:0;color:var(--success);text-decoration:underline}
.note{background:var(--warning-bg);color:var(--warning);border-radius:10px;padding:11px 13px;font-size:13px}
.help{font-size:12.5px;color:var(--muted)}
.big{font-size:32px;font-weight:750;letter-spacing:-1px;line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv strong{text-align:right;overflow-wrap:anywhere;min-width:0}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex-shrink:0;background:none;border:1px solid transparent;border-radius:10px;padding:8px 12px;min-height:40px;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--soft-b)}
.anchors{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px 12px;padding:6px 16px;border-bottom:1px solid var(--border)}
.anchors .seg{margin:0 -16px;}
section.sec{scroll-margin-top:64px}
.bar{height:8px;border-radius:4px;background:var(--accent);opacity:.8}
.bar.prev{background:var(--muted);opacity:.45}
.doc-paper{background:var(--paper);border:1px solid var(--paper-b);border-radius:10px;padding:18px;color:var(--paper-ink)}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:13px;margin-top:8px;cursor:pointer;background:var(--card)}
.choice:has(input:checked){border-color:var(--accent);background:var(--soft)}
.choice input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}
.choice div{flex:1;min-width:0}
.field{display:block;font-size:13px;font-weight:600;margin-top:12px}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:5px;background:var(--card);border:1px solid var(--field);border-radius:9px;padding:10px 12px;min-height:44px;font-weight:400;font-size:15px}
.field textarea{min-height:80px;resize:vertical}
.field .err{color:var(--danger);font-weight:600;font-size:12.5px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:12px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
details.more{margin-top:14px;border-top:1px solid var(--border)}
details.more>summary{padding:12px 0;font-weight:600;cursor:pointer;color:var(--accent)}
.empty{padding:18px 4px;color:var(--muted)}
.ctx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.grid2{display:grid;gap:14px}

/* foglio */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,26,35,.45)}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet-head h2{outline:none}

@media (min-width:760px){
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 110px)}
  aside.side{display:block;background:var(--nav);padding:20px 14px;color:var(--nav-ink)}
  aside.side button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--nav-ink);padding:11px 13px;border-radius:10px;margin:2px 0;text-align:left;min-height:44px}
  aside.side button.active{background:var(--nav-active);color:#b9f5fb;font-weight:700}
  aside.side .add{background:var(--hero-accent);color:#132e3e;font-weight:700;justify-content:center;margin-bottom:16px}
  aside.side .add:hover{filter:brightness(.95)}
  aside.side .cap{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:16px 13px 6px;opacity:.75}

  .anchors .seg{margin:0}
  .sheet-wrap{align-items:center}

  .sheet .grip{display:none}

@media (max-width:350px){h1{font-size:26px}.big{font-size:28px}.card{padding:15px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== SPESE ===== */
function spFiltered(ignore){const {period,f}=ui.sp;return liveExpenses().filter(e=>(period==='tutto'||e.day.startsWith(period))&&(ignore==='cat'||!f.cat||e.cat===f.cat)&&(ignore==='obj'||!f.obj||(f.obj==='-'?!e.object:e.object===f.obj))&&(!f.room||roomOf(e)===f.room)&&(!f.work||e.work===f.work)).sort((a,b)=>b.day.localeCompare(a.day))}
const fCount=()=>Object.values(ui.sp.f).filter(Boolean).length;
const periodLabel=p=>p==='tutto'?'tutti gli anni':p;
V.spese=r=>{if(r.setF){ui.sp.f=Object.assign({cat:'',obj:'',room:'',work:''},r.setF);ui.sp.period=r.period||ui.sp.period;ui.sp.seg='elenco';delete r.setF}
 const {period,seg,f}=ui.sp;const list=spFiltered();const tot=list.reduce((s,e)=>s+e.amount,0);
 const fin=list.filter(e=>e.cat==='financing').reduce((s,e)=>s+e.amount,0);
 const dr=openDrafts();
 const years=[...new Set(st.expenses.map(e=>e.day.slice(0,4)))].sort().reverse();
 const chips=[f.cat&&['cat',CATS[f.cat]],f.obj&&['obj',f.obj==='-'?'Senza oggetto':f.obj],f.room&&['room','Ambiente: '+f.room],f.work&&['work',f.work]].filter(Boolean);
 const segs=[['elenco','Elenco'],['oggetti','Per oggetto'],['lavori','Lavori'],['riepilogo','Riepilogo']];
 let body='';
 if(seg==='elenco')body=`<section class="card">${list.map(expRow).join('')||'<p class="empty">Nessuna spesa con questi filtri.</p>'}</section>`;
 if(seg==='oggetti'){const l=spFiltered('obj');const m={};l.forEach(e=>{const k=e.object||'-';m[k]=(m[k]||0)+e.amount});
  body=`<section class="card">${Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>act$('spObjSeg',k,`<span class="ico">${ic(k==='-'?'home':'obj')}</span><span class="row-body"><span class="row-title">${k==='-'?'Casa, senza oggetto':h(k)}</span><span class="row-sub">${plural(l.filter(e=>(e.object||'-')===k).length,'spesa','spese')}</span></span><span class="amount num">${eur(m[k])}</span>${ic('chev','i chev')}`,'row')).join('')||'<p class="empty">Nessuna spesa.</p>'}</section><p class="help">Ogni spesa conta una volta sola: qui è raggruppata per oggetto.</p>`}
 if(seg==='lavori')body=`<section class="card">${st.works.map(w=>{const es=liveExpenses().filter(e=>e.work===w);return row({v:'lavoro',id:w},'build',h(w),`${plural(es.length,'spesa','spese')} · tutti gli anni`,`<span class="amount num">${eur(es.reduce((s,e)=>s+e.amount,0))}</span>`)}).join('')||'<p class="empty">Nessun lavoro.</p>'}</section><p class="help">Un lavoro raggruppa più spese. Non è un progetto né un’attività.</p>`;
 if(seg==='riepilogo'){const g={};list.forEach(e=>{const k=groupOf(e.cat);g[k]=(g[k]||0)+e.amount});
  let prev=null,pg={};if(period!=='tutto'){const py=String(+period-1);const save=ui.sp.period;ui.sp.period=py;prev=spFiltered();ui.sp.period=save;prev.forEach(e=>{const k=groupOf(e.cat);pg[k]=(pg[k]||0)+e.amount});prev={y:py,tot:prev.reduce((s,e)=>s+e.amount,0)}}
  const max=Math.max(1,...Object.values(g),...Object.values(pg));
  body=`<section class="card"><h2 style="margin-bottom:8px">Per gruppo · ${periodLabel(period)}</h2>${Object.keys(GROUPS).map(k=>`<div style="padding:9px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;gap:10px"><span>${GROUPS[k]}</span><strong class="num">${eur(g[k]||0)}</strong></div><div class="bar" style="width:${(g[k]||0)/max*100}%;margin-top:6px"></div>${prev&&prev.tot?`<div style="display:flex;justify-content:space-between;gap:10px;margin-top:4px" class="help"><span>${prev.y}</span><span class="num">${eur(pg[k]||0)}</span></div><div class="bar prev" style="width:${(pg[k]||0)/max*100}%;margin-top:3px"></div>`:''}</div>`).join('')}
  ${prev&&prev.tot?`<div class="kv" style="margin-top:6px"><span>Totale ${prev.y}</span><strong class="num">${eur(prev.tot)}</strong></div><p class="help" style="margin-top:8px">Il confronto usa solo le spese registrate nei due anni.</p>`:''}</section>`}
 return`<div class="page-head"><div class="t"><h1 tabindex="-1">Spese</h1></div>${act$('registraSheet',{},'Registra','btn primary small')}</div>${flashHtml()}
 <section class="card"><div class="card-head"><label class="help" for="sp-period">Periodo</label><select id="sp-period" class="chip" style="min-height:36px">${['tutto',...years].map(y=>`<option value="${y}"${y===period?' selected':''}>${y==='tutto'?'Tutti gli anni':y}</option>`).join('')}</select></div>
  <div class="help">${chips.length?'Totale filtrato':'Totale '+periodLabel(period)}</div><div class="big num">${eur(tot)}</div>
  <p class="help">${plural(list.length,'spesa','spese')}${fin?` · include finanziamento ${eur(fin)}`:''}</p></section>
 ${dr.length?`<section class="card tint">${row({v:'confermare'},'wallet',`Da confermare (${dr.length})`,'Bozze lette dai documenti, comprese quelle tenute da parte')}</section>`:''}
 <div class="seg" role="group" aria-label="Vista">${segs.map(([k,l])=>act$('spSeg',k,l,'',`id="sp-${k}" aria-pressed="${seg===k}"`)).join('')}</div>
 <div class="chips" style="margin-bottom:12px">${act$('filterSheet',0,`${ic('filter')}Filtri${fCount()?' · '+fCount():''}`,'chip','id="sp-filters"')}${chips.map(([k,l])=>act$('spUnset',k,`${h(l)} ${ic('x')}`,'chip filter',`aria-label="Togli filtro ${h(l)}" id="spx-${k}"`)).join('')}${chips.length>1?act$('spClear',0,'Azzera','link'):''}</div>
 ${body}`};
function expRow(e){return row({v:'spesa',id:e.id},'',h(e.title),[day(e.day),e.object,e.work,e.document?'documento':''].filter(Boolean).map(h).join(' · '),`<span class="amount num">${eur(e.amount)}</span>`)}

 return head(e.title,{eyebrow:CATS[e.cat]||'Non classificata'})+flashHtml()+`<section class="card"><div class="big num">${eur(e.amount)}</div><p class="help">Importo registrato. Non è una conferma di pagamento.</p>

V.lavoro=r=>{const es=liveExpenses().filter(e=>e.work===r.id).sort((a,b)=>a.day.localeCompare(b.day));const tot=es.reduce((s,e)=>s+e.amount,0);
 const objs=[...new Set(es.map(e=>e.object).filter(Boolean))];
 return head(r.id,{eyebrow:'Lavoro',sub:es.length?`${plural(es.length,'spesa','spese')} · dal ${day(es[0].day)} al ${day(es[es.length-1].day)}`:''})+flashHtml()+`<section class="card"><div class="help">Totale del lavoro</div><div class="big num">${eur(tot)}</div>${objs.length?`<p class="help">Oggetti coinvolti: ${objs.map(o=>go$({v:'scheda',id:o},h(o),'link')).join(', ')}</p>`:''}</section>
 <section class="card">${es.map(e=>row({v:'spesa',id:e.id},'',h(e.title),[day(e.day),e.object||'nessun oggetto'].map(h).join(' · '),`<span class="amount num">${eur(e.amount)}</span>`)).join('')}<div class="actions">${startFlow$('registra',{preset:{work:r.id}},'Registra spesa per questo lavoro','btn small')}</div></section>
 <p class="help">Il totale non viene ripartito fra gli oggetti.</p>`};

/* registra: tre dati, il resto è facoltativo */
V.registra=r=>{const e=r.edit?exp(r.edit):null;const p=r.preset||{};
 if(!r.vals)r.vals=e?{amount:(e.amount/100).toFixed(2).replace('.',','),day:e.day,title:e.title,cat:e.cat,object:e.object,work:e.work,supplier:e.supplier,document:e.document,note:e.note||''}:{amount:'',day:TODAY,title:p.title||'',cat:'',object:p.object||'',work:p.work||'',supplier:'',document:p.doc||'',note:''};
 const v=r.vals,err=r.err||{};
 const opt=(val,l,s)=>`<option value="${h(val)}"${val===s?' selected':''}>${h(l)}</option>`;
 const ctx=[v.object&&['Oggetto',v.object],v.work&&['Lavoro',v.work],v.document&&['Documento',(doc(v.document)||{}).name]].filter(Boolean);
 const pdoc=doc(v.document);
 return head(e?'Modifica spesa':'Registra una spesa',{sub:e?'':'Bastano importo, data e descrizione.'})+`<form class="card" data-form="registra" novalidate>
 ${pdoc&&!e?`<p class="help" style="margin-bottom:6px">Dal documento ${h(pdoc.name)}: inserisci i dati che leggi.</p>`:''}
 <label class="field" style="margin-top:0">Importo<input id="f-amount" inputmode="decimal" value="${h(v.amount)}" placeholder="0,00" aria-describedby="e-amount" ${err.amount?'aria-invalid="true"':''}>${err.amount?`<div class="err" id="e-amount">${err.amount}</div>`:''}</label>
 <label class="field">Data della spesa<input id="f-day" type="date" value="${h(v.day)}">${err.day?`<div class="err">${err.day}</div>`:''}</label>
 <label class="field">Descrizione<input id="f-title" value="${h(v.title)}" placeholder="Es. Riparazione lavatrice" maxlength="120">${err.title?`<div class="err">${err.title}</div>`:''}</label>
 ${ctx.length?`<div class="ctx">${ctx.map(([k,l])=>`<span class="tag">${k}: ${h(l)}</span>`).join('')}</div>`:''}
 <details class="more"${((v.cat||v.supplier||v.note)&&e)||err.work?' open':''}><summary>Altri dettagli (facoltativi)</summary>
  <label class="field">Categoria<select id="f-cat">${opt('','Non classificata',v.cat)}${Object.entries(CATS).map(([k,l])=>opt(k,l,v.cat)).join('')}</select></label>
  <label class="field">Oggetto<select id="f-object">${opt('','Nessun oggetto (casa)',v.object)}${st.objects.map(o=>opt(o.id,o.id,v.object)).join('')}</select></label>
  <label class="field">Lavoro<select id="f-work">${opt('','Nessun lavoro',v.work)}${st.works.map(w=>opt(w,w,v.work)).join('')}${opt('+','Nuovo lavoro…',v.work)}</select></label>
  <label class="field" id="f-newwork-l" ${v.work==='+'?'':'hidden'}>Nome del nuovo lavoro<input id="f-newwork" value="${h(v.newwork||'')}" placeholder="Es. Tinteggiatura soggiorno">${err.work?`<div class="err">${err.work}</div>`:''}</label>
  <label class="field">Fornitore<input id="f-supplier" value="${h(v.supplier)}"></label>
  <label class="field">Nota<textarea id="f-note">${h(v.note)}</textarea></label>
 </details>
 <div class="actions"><button class="btn primary" type="submit">${e?'Salva modifiche':'Salva spesa'}</button>${act$('back',0,'Annulla','btn')}</div></form>`};

/* importazione, analisi, bozza */
function pendingEconDocs(){return st.docs.filter(d=>d.econ&&!st.expenses.some(e=>e.document===d.id&&!e.archived)&&!st.drafts.some(x=>x.doc===d.id&&(x.status==='done'||x.status==='discarded')))}
V.importa=()=>head('Importa documenti',{sub:'Conserviamo l’originale. Proporre dati è un passo separato, che decidi tu.'})+`<section class="card">${st.imported?`<p>Il pacchetto di prova è già stato importato.</p><div class="actions">${go$({v:'esito'},'Vedi i documenti importati','btn primary')}</div>`:`<p>In questa proposta non si caricano file veri. Puoi importare un pacchetto di prova con tre documenti: una bolletta del gas, una fattura dell’idraulico e una ricevuta scansionata.</p><div class="actions">${act$('doImport',0,`${ic('up')}Importa il pacchetto di prova`,'btn primary')}</div>`}</section>`;
V.esito=()=>{const ids=['d7','d8','d9'];
 return head('Documenti importati',{sub:'3 originali conservati. Nessun oggetto o spesa è stato creato automaticamente.'})+flashHtml()+ids.map(id=>{const d=doc(id);if(!d)return'';const dr=st.drafts.filter(x=>x.doc===id).pop();const linked=st.expenses.find(e=>e.document===id&&!e.archived);
  let state,acts='';
  if(linked){state=`<span class="tag ok">Spesa collegata</span> ${go$({v:'spesa',id:linked.id},h(linked.title),'link')}`}
  else if(dr&&dr.status==='parked'){state='<span class="tag neutral">Tenuta da parte</span>';acts=startFlow$('bozza',{id:dr.id,resume:true},'Riprendi','btn small')}
  else if(dr&&dr.status==='open'){state='<span class="tag warn">Bozza da completare</span>';acts=startFlow$('bozza',{id:dr.id},'Apri bozza','btn small primary')}
  else if(dr&&dr.status==='discarded'){state='<span class="tag neutral">Bozza scartata</span>'}
  else if(d.econ==='scan'){state='<span class="tag neutral">Testo non leggibile</span>';acts=startFlow$('registra',{preset:{doc:id}},'Inserisci la spesa a mano','btn small')}
  else{state='<span class="tag">Dati di spesa proponibili</span>';acts=startFlow$('analisi',{doc:id},'Proponi la spesa','btn small primary')}
  return`<section class="card"><div class="card-head"><h2 style="font-size:16px">${h(d.name)}</h2>${go$({v:'documento',id},'Apri','link')}</div><p class="help">${h(d.type)} · conservato · ${visLabel(d.vis)}</p><div style="margin-top:8px">${state}</div>${acts?`<div class="actions">${acts}</div>`:''}</section>`}).join('')};

V.analisi=r=>{const d=doc(r.doc);if(!d)return head('Documento non trovato');
 if(d.econ==='scan')return head(d.name,{eyebrow:'Compilazione assistita'})+`<section class="card"><p>Il testo di questo documento non è leggibile: è una scansione di bassa qualità.</p><p class="help" style="margin-top:6px">Puoi comunque registrare la spesa a mano. Il documento resta collegato.</p><div class="actions">${act$('toManual',d.id,'Inserisci a mano','btn primary')}</div></section>`;
 return head(d.name,{eyebrow:'Compilazione assistita'})+`<section class="card"><p>Dimora può leggere questo documento e proporti importo, data e descrizione. Li controlli e li confermi tu.</p>
 <label class="check"><input type="checkbox" id="consent"><span>Acconsento all’invio del testo di questo documento ad Anthropic per l’analisi</span></label>

}

 if(dr.amount==null&&P.pre&&!dr.touched)dr.amount=P.pre;
 if(!dr.f)dr.f={title:P.title,day:P.day,supplier:P.supplier,cat:P.cat,object:'',note:''};
 const ex=dr.exist;const f=dr.f;const err=r.err||{};
 const opt=(val,l,s)=>`<option value="${h(val)}"${val===s?' selected':''}>${h(l)}</option>`;
 const candHtml=P.cands.length?P.cands.map(c=>`<label class="choice"><input type="radio" name="dr-exist" value="${c.e.id}" id="dre-${c.e.id}" ${ex===c.e.id?'checked':''}><div><strong>Sì: ${h(c.e.title)}</strong> <span class="num">${eur(c.e.amount)}</span><div class="help">${day(c.e.day)} · ${h(c.why)}</div></div></label>`).join(''):'';

 rvPower:()=>{const c=document.querySelector('input[name="rv-power"]:checked');if(!c){const b=document.getElementById('rvp-ok');openSheet('Scegli un’opzione','<p>Scegli cosa vale per la tua caldaia, oppure «Non ora».</p>');return}
  const o=obj('Caldaia');o.power=c.value==='both'?'24 kW utile · 28 kW nominale':c.value+' kW';st.reviews.find(r=>r.id==='power').open=false;event('Potenza confermata da te',`${o.power} · fonti: Libretto impianto.pdf, Manuale caldaia.pdf`,'Caldaia');save();flash={msg:'Potenza salvata nella scheda Caldaia.',go:{v:'scheda',id:'Caldaia',anchor:'dati'},goLabel:'Apri la scheda'};rerender()},
 rvModelFix:()=>{const l=document.getElementById('rvm-fix');l.hidden=false;document.getElementById('rvm-val').focus();document.getElementById('rvm-ok').textContent='Conferma'},
 rvModel:()=>{const o=obj('Caldaia');const fx=document.getElementById('rvm-fix');const v=fx&&!fx.hidden?val('rvm-val').trim()||'TD28':'TD28';o.model=v;o.modelOk=true;st.reviews.find(r=>r.id==='model').open=false;event('Modello confermato da te',`${v} · fonte: Libretto impianto.pdf`,'Caldaia');save();flash={msg:`Modello ${v} salvato nella scheda Caldaia.`,go:{v:'scheda',id:'Caldaia',anchor:'dati'},goLabel:'Apri la scheda'};rerender()},
 rvLater:()=>{flash={msg:'Resta in Da rivedere.'};rerender()},
 taskDone:id=>{const t=st.tasks.find(x=>x.id===id);t.done=TODAY;event('Attività completata',t.title,t.object);save();flash={msg:'Completata oggi. Nessuna spesa registrata.'};rerender()},
 taskReopen:id=>{const t=st.tasks.find(x=>x.id===id);t.done=null;event('Attività riaperta',t.title,t.object);save();flash={msg:'Attività riaperta.'};rerender()},
 askArchive:id=>{ui.confirm='arch-'+id;rerender()},
 cancelConfirm:()=>{ui.confirm=null;rerender()},
 archive:id=>{const e=exp(id);e.archived=true;ui.confirm=null;save();const t=e.title;back();flash={msg:`«${t}» archiviata.`};rerender()},
 doImport:()=>{st.docs.push({id:'d7',name:'Bolletta gas.pdf',type:'Bolletta',object:'',vis:'io',econ:'gas',day:TODAY,text:'Gas Demo · bolletta di settembre 2026. Consumo del periodo 80,00 €. Arretrati agosto 20,00 €. Totale da pagare 100,00 €. Esempio sintetico.'},{id:'d8',name:'Fattura idraulico.pdf',type:'Fattura',object:'',vis:'io',econ:'invoice',day:TODAY,text:'Idraulico Demo · 3 ottobre 2026. Riparazione scarico bagno. Imponibile 100,00 €, IVA 22% 22,00 €, totale 122,00 €. Esempio sintetico.'},{id:'d9',name:'Ricevuta scansionata.pdf',type:'Ricevuta',object:'',vis:'io',econ:'scan',day:TODAY,text:'Scansione poco leggibile. Esempio sintetico.'});st.imported=true;event('Documenti importati','Bolletta gas.pdf, Fattura idraulico.pdf, Ricevuta scansionata.pdf');save();replace({v:'esito',origin:cur.origin})},
 toManual:id=>replace({v:'registra',preset:{doc:id},origin:cur.origin}),
 analyze:(id,btn)=>{btn.disabled=true;btn.textContent='Lettura del documento…';setTimeout(()=>{const d=doc(id);const dr={id:nid('b'),doc:id,kind:d.econ,status:'open',exist:null,amount:null};st.drafts.push(dr);save();replace({v:'bozza',id:dr.id,origin:cur.origin})},700)},
 drLink:id=>{const dr=st.drafts.find(x=>x.id===id);const e=exp(dr.exist);const d=doc(dr.doc);e.document=d.id;e.source+=' · documento collegato';dr.status='done';event('Documento collegato a una spesa',`${d.name} → ${e.title}`);save();finish(`Documento collegato a «${e.title}». L’importo resta ${eur(e.amount)}.`,{go:{v:'spesa',id:e.id},goLabel:'Apri la spesa'})},
 drPark:id=>{const dr=st.drafts.find(x=>x.id===id);dr.status='parked';dr.parked=TODAY;save();finish('Bozza tenuta da parte: la trovi in Spese › Da confermare.',{go:{v:'confermare'},goLabel:'Apri'})},
 askDiscard:id=>{ui.confirm='disc-'+id;rerender()},
 drDiscard:id=>{const dr=st.drafts.find(x=>x.id===id);dr.status='discarded';ui.confirm=null;save();flash={msg:'Bozza scartata. Il documento resta in Documenti.'};rerender()},
 startPath:s=>{closeSheet(true);tab(s)},
 moreGo:k=>{closeSheet(true);go(moreRoute(k))},
 doReset:()=>{st=seed();save();ui=freshUi();closeSheet(true);tab('casa')}
};
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('[data-sheet-close]')||t.matches('[data-sheet-bg]')){closeSheet();return}
 const g=t.closest('[data-go]');if(g){const r=R[g.dataset.go];if(document.getElementById('sheet-root').innerHTML)closeSheet(true);go(Object.assign({},r));return}
 const a=t.closest('[data-act]');if(a&&!a.disabled){ACT[a.dataset.act](R[a.dataset.a],a,e);return}
 const tb=t.closest('[data-tab]');if(tb){tab(tb.dataset.tab);return}
 const m=t.closest('[data-more]');if(m){go(moreRoute(m.dataset.more));return}
 if(t.closest('[data-shell="add"]')||t.closest('#fab')){addSheet();return}
 if(t.closest('#btn-more')){moreSheet();return}
 if(t.closest('#btn-paths')){pathsSheet();return}
 if(t.closest('#btn-addr')){openSheet('Le tue case','<p>In questa prova c’è una sola casa: Via Roma 12, Milano, unità A12.</p>');return}
 if(t.closest('#btn-reset')){openSheet('Ripristinare la prova?',`<p>Torni ai dati iniziali di questa proposta. Le altre prove e l’app reale non cambiano.</p><div class="actions">${act$('doReset',0,'Ripristina dati di prova','btn primary')}${'<button type="button" class="btn" data-sheet-close>Annulla</button>'}</div>`);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet-root').innerHTML)closeSheet()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='sp-period'){ui.sp.period=t.value;rerender();return}
 if(t.id==='consent'){const b=document.getElementById('btn-analyze');if(b)b.disabled=!t.checked;return}
 if(t.name==='dr-exist'||t.name==='dr-amt'){const dr=st.drafts.find(x=>x.id===cur.id);if(!dr)return;captureDraft(dr);if(t.name==='dr-exist')dr.exist=t.value;else{dr.amount=+t.value;dr.touched=true}save();rerender();return}
 if(t.id==='f-work'){const l=document.getElementById('f-newwork-l');if(l)l.hidden=t.value!=='+';return}
 if(['doc-type','doc-obj','doc-vis'].includes(t.id)){ui.doc[t.id.slice(4)]=t.value;updateDocResults();return}
});
document.addEventListener('input',e=>{if(e.target.id==='doc-q'){ui.doc.q=e.target.value;updateDocResults()}});
function captureDraft(dr){if(!dr.f)return;const m={title:'d-title',day:'d-day',cat:'d-cat',object:'d-object',supplier:'d-supplier',note:'d-note'};Object.entries(m).forEach(([k,id])=>{const el=document.getElementById(id);if(el)dr.f[k]=el.value})}
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
 if(k==='registra'){const v={amount:val('f-amount'),day:val('f-day'),title:val('f-title').trim(),cat:val('f-cat'),object:val('f-object'),work:val('f-work'),newwork:val('f-newwork').trim(),supplier:val('f-supplier').trim(),note:val('f-note'),document:cur.vals.document};
  const err={};const amt=parseEur(v.amount);if(!amt)err.amount='Scrivi un importo maggiore di zero, per esempio 85 oppure 85,50.';if(!v.day)err.day='Scegli una data.';if(!v.title)err.title='Scrivi una breve descrizione.';if(v.work==='+'&&!v.newwork)err.work='Scrivi il nome del nuovo lavoro.';
  cur.vals=v;cur.err=err;if(Object.keys(err).length){rerender();const first=document.querySelector('[aria-invalid],.err');const inp=first&&first.closest('label')?first.closest('label').querySelector('input,select,textarea'):null;if(inp)inp.focus();return}
  let work=v.work;if(work==='+'){work=v.newwork||'Nuovo lavoro';if(!st.works.includes(work))st.works.push(work)}
  if(cur.edit){const ex=exp(cur.edit);Object.assign(ex,{amount:amt,day:v.day,title:v.title,cat:v.cat,object:v.object,work,supplier:v.supplier,note:v.note});save();finish('Modifiche salvate.');return}
  const ne={id:nid('e'),title:v.title,amount:amt,day:v.day,cat:v.cat,supplier:v.supplier,object:v.object,work,note:v.note,document:v.document||'',source:v.document?'Inserita da te · documento collegato':'Inserita da te'};st.expenses.push(ne);event('Spesa registrata',`${ne.title} · ${eur(amt)}`,ne.object);save();
  finish(`Registrata: ${ne.title} · ${eur(amt)}.`,{go:{v:'spesa',id:ne.id},goLabel:'Apri',sec:cur.sec||''});return}
 if(k==='bozza'){const dr=st.drafts.find(x=>x.id===f.dataset.id);captureDraft(dr);const err={};if(dr.amount==null)err.amount='Scegli quale importo registrare.';if(!dr.f.title.trim())err.title='Scrivi una breve descrizione.';
  if(Object.keys(err).length){cur.err=err;save();rerender();return}
  const d=doc(dr.doc);const ne={id:nid('e'),title:dr.f.title.trim(),amount:dr.amount,day:dr.f.day||TODAY,cat:dr.f.cat,supplier:dr.f.supplier,object:dr.f.object,work:'',note:dr.f.note,document:d.id,source:'Da documento, confermata da te'};st.expenses.push(ne);dr.status='done';event('Spesa registrata da documento',`${ne.title} · ${eur(ne.amount)} · ${d.name}`,ne.object);save();
  finish(`Registrata: ${ne.title} · ${eur(ne.amount)}.`,{go:{v:'spesa',id:ne.id},goLabel:'Apri'});return}
 if(k==='segnala'){const t=val('s-title').trim(),b=val('s-body');if(!t){cur.t=t;cur.b=b;cur.err={t:'Scrivi un titolo.'};rerender();document.getElementById('s-title').focus();return}st.reports.push({id:nid('r'),title:t,day:TODAY,state:'Inviata'});event('Segnalazione inviata',t);save();finish('Segnalazione inviata allo studio (simulato).',{go:{v:'condominio'},goLabel:'Vedi'});return}
 if(k==='oggetto'){const v={name:val('o-name').trim(),type:val('o-type'),room:val('o-room')};const err={};if(!v.name)err.name='Scrivi il nome.';else if(obj(v.name))err.name='Esiste già un oggetto con questo nome.';if(!v.type)err.type='Scegli il tipo.';
  if(Object.keys(err).length){cur.vals=v;cur.err=err;rerender();return}st.objects.push({id:v.name,type:v.type,room:v.room,brand:'',model:'',modelOk:true,power:null});event('Oggetto aggiunto',v.room||'Da collocare',v.name);save();finish(`Aggiunto: ${v.name}${v.room?' in '+v.room:' (da collocare)'}.`,{go:{v:'scheda',id:v.name},goLabel:'Apri la scheda'});return}
 if(k==='ambiente'){const n=val('r-name').trim();if(!n||st.rooms.includes(n)){cur.n=n;cur.err={n:n?'Esiste già.':'Scrivi il nome.'};rerender();return}st.rooms.push(n);event('Ambiente aggiunto',n);save();finish(`Ambiente aggiunto: ${n}.`,{go:{v:'ambiente',id:n},goLabel:'Apri'});return}
 if(k==='attivita'){const v={title:val('t-title').trim(),day:val('t-day')||TODAY,object:val('t-object'),note:val('t-note')};if(!v.title){cur.vals=v;cur.err={title:'Scrivi cosa devi fare.'};rerender();return}st.tasks.push({id:nid('a'),title:v.title,day:v.day,object:v.object,note:v.note,done:null});event('Attività creata',v.title,v.object);save();finish(`Attività aggiunta: ${v.title}.`,{sec:cur.sec||''});return}
});

render(0,false);
})();
</script>
