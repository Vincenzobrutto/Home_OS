<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Dimora · Ricevuta assistita · Mockup</title>
<style>
:root{--nav:#132e3e;--ink:#182f3d;--muted:#536b79;--bg:#f2f6f8;--accent:#0b6177;--soft:#e3f3f6;--border:#dce6eb;--green:#24624b;--greenbg:#e6f5ed;--amber:#80520c;--amberbg:#fff4dc;--red:#a43038}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3a9ec0;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(27px,3vw,38px);line-height:1.16;letter-spacing:-1px;max-width:760px;text-wrap:balance}h2{font-size:20px;line-height:1.3;letter-spacing:-.4px}h3{font-size:16px}a{color:var(--accent)}.demo{background:var(--amberbg);color:#63450f;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}.demo label{margin-left:auto;display:flex;gap:8px;align-items:center}.demo select{padding:5px 8px;border:1px solid #e4d7b9;border-radius:8px;max-width:100%;background:white;color:var(--ink)}header{background:var(--nav);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 32px}.brand{font-size:28px;font-weight:750;letter-spacing:-1.3px}.brand span{color:#99e5ef}header small{color:#c7dce7}.homepill{border:1px solid #45606e;border-radius:8px;padding:6px 13px;font-size:13px}.layout{max-width:1320px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 125px)}aside{padding:38px 22px;border-right:1px solid var(--border)}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase;color:var(--muted)}.steps{list-style:none;padding:0;margin:20px 0 24px;display:grid;gap:10px}.steps a{display:flex;align-items:center;gap:12px;text-decoration:none;padding:11px 10px;color:var(--muted);border-radius:10px;font-size:14px}.steps .active{background:var(--soft);color:var(--accent);font-weight:700}.num{display:grid;place-items:center;width:27px;height:27px;border:1px solid #b7ccd4;border-radius:50%;font-size:12px;flex:none}.active .num{background:var(--accent);border-color:var(--accent);color:white}.aside-note{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:18px}main{padding:36px 40px 70px;min-width:0}.crumb{font-size:13px;color:var(--muted);margin-bottom:24px}.lead{margin:12px 0 26px;color:var(--muted);max-width:700px;font-size:16px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.stack{display:grid;gap:20px}.card{background:white;border:1px solid var(--border);border-radius:18px;padding:25px;min-width:0}.card>h2{margin-bottom:16px}.subtle{background:#edf5f7}.file{display:flex;gap:15px;align-items:center}.file-icon{display:grid;place-items:center;width:50px;height:60px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;flex:none}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:6px;background:var(--soft);color:var(--accent);padding:3px 9px;font-size:12px;font-weight:650}.tag.green{background:var(--greenbg);color:var(--green)}.tag.amber{background:var(--amberbg);color:var(--amber)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.divider{border-top:1px solid var(--border);margin:20px 0}.notice{background:var(--soft);border-left:3px solid var(--accent);padding:13px 16px;border-radius:0 10px 10px 0;font-size:14px}.notice.green{background:var(--greenbg);border-color:var(--green)}.notice.amber{background:var(--amberbg);border-color:#b97f28}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 17px;border-radius:10px;border:1px solid var(--border);background:white;color:var(--ink);text-decoration:none;font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.ghost{background:transparent}.btn.small{font-size:13px;padding:6px 11px;min-height:38px}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}.linkbtn{background:none;border:0;color:var(--accent);font-size:13px;padding:7px 0;text-align:left;min-height:34px;text-decoration:underline;text-underline-offset:3px}.check{display:flex;gap:11px;align-items:flex-start;margin-top:18px}.check input,.choice input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:3px 0}.check label{font-size:14px}.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);padding:14px;border-radius:11px;margin:10px 0;cursor:pointer}.choice:has(input:checked){border-color:#75b3c1;background:#f0f9fa}.choice small{display:block;color:var(--muted);margin-top:3px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:18px 0 8px}.field{display:grid;gap:6px;min-width:0}.field.wide{grid-column:1/-1}.field label{font-size:13px;font-weight:650}.field input,.field select{width:100%;border:1px solid #a8bdc7;border-radius:9px;min-height:44px;padding:9px 11px;background:white;color:var(--ink);min-width:0}.field .source{display:flex;align-items:center;gap:8px;justify-content:space-between}.source button{flex:none}.source span{font-size:11px;color:var(--muted)}.receipt{background:#fffef9;color:#344650;border:1px solid #e3dfd1;border-radius:4px;padding:20px;font:12px/1.9 ui-monospace,Consolas,monospace;box-shadow:0 7px 20px #263d4a0a;overflow-wrap:anywhere}.receipt h3{font:700 13px 'Segoe UI',sans-serif;text-align:center}.receipt .line{border-top:1px dashed #ccc;margin:13px 0}.receipt mark{background:#c5f0ef;padding:3px}.receipt .money{font-size:17px;font-weight:700}.list{padding-left:19px;margin:12px 0;display:grid;gap:12px}.list li::marker{color:var(--accent)}.facts{margin:15px 0;display:grid;gap:12px}.fact{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--border);padding-bottom:10px}.fact strong{text-align:right}.statuscircle{display:grid;place-items:center;background:var(--greenbg);color:var(--green);width:64px;height:64px;border-radius:50%;font-size:30px;margin-bottom:18px}.error{color:var(--red);font-size:14px;margin-top:12px}.summary-item{padding:16px 0;border-bottom:1px solid var(--border)}.summary-item:last-child{border:0}.summary-item p{margin-top:6px;color:var(--muted);font-size:14px}.footer-note{font-size:12px;color:var(--muted);margin-top:22px}dialog{border:1px solid var(--border);border-radius:18px;padding:25px;max-width:500px;width:calc(100% - 30px);color:var(--ink);max-height:90vh;overflow:auto}dialog::backdrop{background:#102b3b88}.dialoghead{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.close{border:0;background:var(--bg);width:38px;height:38px;border-radius:9px;font-size:20px}.callout-number{font-size:26px;font-weight:750;line-height:1.2}.mini{display:flex;gap:14px;align-items:center;margin-top:20px}.mini-icon{font-size:25px;color:var(--accent)}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.empty{padding:30px 0;color:var(--muted)}.hidden{display:none!important}.danger{color:var(--red)}
@media(min-width:1100px){.sticky{position:sticky;top:22px}}
@media(max-width:900px){.layout{grid-template-columns:170px minmax(0,1fr)}main{padding:26px 24px 50px}.grid{grid-template-columns:1fr}.support{order:2}.card{padding:21px}}
@media(max-width:620px){.demo{padding:8px 14px;gap:5px}.demo label{width:100%;margin:3px 0 0}.demo select{flex:1;min-width:0}header{padding:15px 18px}.brand{font-size:25px}header small{display:none}.layout{display:block}aside{padding:15px 14px 0;border:0}.steps{display:flex;gap:3px;margin:0}.steps li{flex:1}.steps a{font-size:12px;padding:7px 4px;gap:6px}.num{width:22px;height:22px}.aside-note,aside>.eyebrow{display:none}main{padding:22px 16px 45px}.crumb{margin-bottom:17px;font-size:12px}.lead{font-size:15px}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.card{padding:19px;border-radius:14px}.actions{align-items:stretch}.actions>.btn{flex:1}.grid{gap:17px}.fact{font-size:14px}.fact strong{max-width:60%}}
</style></head>
<body>
<div class="demo"><strong>MOCKUP · dati sintetici</strong><span id="demo-description">Nessuna analisi o modifica reale.</span><label for="scenario">Scenario<select id="scenario"><option value="existing">Oggetto e spesa già presenti</option><option value="new">Primo acquisto, nulla creato</option><option value="ambiguous">Due oggetti compatibili</option><option value="unreadable">Documento non leggibile</option></select></label></div>
<header><div class="brand">dimora<span>.</span></div><small>La tua casa, senza ricopiare tutto.</small><span class="homepill">Home · Casa demo</span></header>
<div class="layout"><aside><p class="eyebrow">Dalla ricevuta alla casa</p><ol class="steps" id="steps"></ol><p class="aside-note">L’AI propone.<br>Tu scegli che cosa conservare.<br><br>Questa anteprima non modifica la tua casa.</p></aside><main id="main"></main></div>
<dialog id="source-dialog" aria-labelledby="source-title"><div class="dialoghead"><h2 id="source-title">Da dove arriva il dato</h2><button class="close" aria-label="Chiudi fonte" id="close-source">×</button></div><div id="source-content"></div></dialog>
<script>
'use strict';
// Standalone: no fetch, external assets, product API, provider or persistence.
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const receipt={name:'Ricevuta macchina del caffè.pdf',brand:'Lume',model:'Mini 90',date:'2026-09-15',amount:'179,90',supplier:'Emporio Casa Demo',number:'R-2048'};
const labels={name:'Nome dell’oggetto',brand:'Marca',model:'Modello',title:'Descrizione',amount:'Importo in euro',date:'Data di riferimento',supplier:'Venditore'};
const original={name:'Macchina del caffè',brand:'Lume',model:'Mini 90',title:'Acquisto macchina del caffè',amount:'179,90',date:'2026-09-15',supplier:'Emporio Casa Demo'};
let scenario='existing',stage='documento',state,applied=false,store,result=null;
function reset(){state={...original,objectAction:scenario==='new'?'new':scenario==='ambiguous'?'':'coffee',costAction:scenario==='existing'?'reuse':'create',enrich:true,consent:false,includeCost:true};store={objects:scenario==='existing'?[{id:'coffee',name:'Macchina del caffè',room:'Cucina',brand:'',model:'',linked:true}]:scenario==='ambiguous'?[{id:'coffee',name:'Macchina del caffè',room:'Cucina',brand:'',model:'',linked:false},{id:'studio',name:'Macchina del caffè',room:'Studio',brand:'',model:'',linked:false}]:[],expenses:scenario==='existing'?[{id:'purchase',title:original.title,amount:original.amount,date:original.date,objectId:'coffee',linked:true}]:[]};applied=false;result=null;}
function money(s){return Number(String(s).replace(/\./g,'').replace(',','.'));}
function euro(s){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(money(s));}
function go(s){location.hash='/'+s;}
function field(k,wide=false){return `<div class="field ${wide?'wide':''}"><label for="${k}">${labels[k]}</label><input id="${k}" data-field="${k}" value="${E(state[k])}" ${k==='date'?'type="date"':k==='amount'?'inputmode="decimal"':'type="text"'} maxlength="120"><div class="source"><span id="origin-${k}">${state.manual?'Inserito da te':state[k]===original[k]?'Dal documento · pagina 1':'Modificato da te'}</span>${state.manual?'':`<button class="linkbtn" data-source="${k}">Vedi fonte</button>`}</div></div>`;}
function paper(highlight=''){const rows=[['supplier','Emporio Casa Demo'],['number','Ricevuta R-2048'],['date','15 settembre 2026'],['name','Macchina del caffè Lume'],['model','Mini 90'],['amount','TOTALE EUR 179,90']];return `<div class="receipt"><h3>FACSIMILE · NON È UN DOCUMENTO REALE</h3><div class="line"></div>${rows.map(([k,t])=>`<div class="${k==='amount'?'money':''}">${highlight===k||highlight==='brand'&&k==='name'?`<mark>${t}</mark>`:t}</div>`).join('')}<div class="line"></div><div>IVA inclusa · un articolo<br>Contenuto interamente sintetico</div></div>`;}
function fileCard(){return `<div class="file"><div class="file-icon">PDF</div><div><strong>${receipt.name}</strong><p class="small muted">Casa demo · Solo io · 1 pagina</p></div></div>`;}
function choice(name,value,title,desc){return `<label class="choice"><input type="radio" name="${name}" value="${value}" ${state[name]===value?'checked':''}><span><strong>${title}</strong><small>${desc}</small></span></label>`;}
function support(){if(state.manual)return `<section class="card subtle support sticky"><h3>Documento originale</h3><p class="small muted" style="margin:10px 0 16px">Puoi consultarlo mentre compili. I valori inseriti restano manuali, non dati estratti dall’AI.</p>${paper()}<button class="linkbtn" data-source="original">Ingrandisci il documento originale</button></section>`;return `<div class="stack support sticky"><section class="card subtle"><p class="eyebrow">Documento di partenza</p><h3 style="margin:9px 0 15px">Una ricevuta, più informazioni utili.</h3>${paper()}<button class="linkbtn" data-source="all">Apri il documento di esempio</button></section><p class="small muted">La fonte documenta la proposta. Non certifica proprietà, validità fiscale o garanzia.</p></div>`;}
function documentView(){return `<p class="crumb">Home / Documenti / Ricevuta</p><h1>Una ricevuta.<br>Il resto, lo mettiamo in ordine.</h1><p class="lead">Ritrova l’acquisto, la spesa e l’oggetto a cui appartiene. Senza ricopiare le stesse informazioni.</p><div class="grid"><div class="stack"><section class="card">${fileCard()}<div class="divider"></div><div class="pills"><span class="tag">Originale conservato</span><span class="tag">Solo io</span></div><button class="linkbtn" data-source="all">Apri la ricevuta di esempio</button></section>${scenario==='existing'?`<div class="notice green"><strong>Hai già iniziato a sistemarla.</strong><br>Questa ricevuta è già collegata alla macchina del caffè e a una spesa. L’analisi proporrà solo eventuali integrazioni: niente doppioni.</div>`:''}<section class="card"><h2>Che cosa può proporti l’analisi</h2><ul class="list"><li>Un oggetto nuovo, oppure quello già presente nella tua casa.</li><li>Marca e modello, soltanto se leggibili nel documento.</li><li>Un costo da registrare, oppure una spesa già collegata da mantenere.</li></ul><p class="small muted">Prima di salvare vedrai tutte le proposte. Potrai correggerle o escluderle.</p><div class="divider"></div><p class="small"><strong>Nel prodotto, l’analisi userà Anthropic.</strong> Richiederà l’invio del contenuto necessario del documento. Il costo API andrà indicato prima dell’avvio.</p><p class="small muted" style="margin-top:8px">Qui il risultato è preparato: nessun file viene letto o inviato e nessun credito viene consumato.</p><div class="check"><input id="consent" type="checkbox" ${state.consent?'checked':''}><label for="consent">Simulo la scelta consapevole di inviare questo documento per l’analisi.</label></div><div class="actions"><span class="small muted">Nessun salvataggio automatico.</span><button class="btn primary" id="analyze" ${state.consent?'':'disabled'}>Simula analisi →</button></div></section></div>${support()}</div>`;}
function reviewView(){if(scenario==='unreadable')return `<p class="crumb">Documenti / Analisi assistita</p><h1>Non siamo riusciti a leggere i dati.</h1><p class="lead">Puoi comunque aprire il documento originale e consultarlo per compilare a mano.</p><section class="card"><div class="notice amber">L’originale resta nei Documenti. Nessun oggetto o costo è stato creato.</div><ul class="list"><li>Nel prodotto potrai scegliere un PDF con testo leggibile, se disponibile.</li><li>Potrai continuare con la compilazione manuale, senza inventare dati mancanti.</li></ul><p class="small muted">Questo mockup non simula un OCR che il prodotto non ha ancora.</p><div class="actions"><a class="btn" href="#/documento">← Torna al documento</a><button class="btn" data-source="original">Vedi documento originale</button><button class="btn primary" id="manual">Prova la compilazione manuale</button></div></section>`;
const selected=store.objects.find(o=>o.id===state.objectAction);return `<p class="crumb">Documenti / Ricevuta / Proposte da rivedere</p><h1>${state.manual?'Inserisci quello che conosci.':'Abbiamo trovato un acquisto per la casa.'}</h1><p class="lead">${state.manual?'Compilazione manuale: nessun dato è stato estratto.':'Controlla oggetto e spesa. Puoi decidere separatamente che cosa salvare.'}</p>${state.manual?'<p style="margin-bottom:20px"><button class="btn" data-source="original">Vedi documento originale</button></p>':''}<div class="grid"><div class="stack"><section class="card"><div class="row"><h2>1. A quale oggetto appartiene?</h2><span class="tag ${scenario==='existing'?'green':'amber'}">${scenario==='existing'?'Già collegato':scenario==='ambiguous'?'Serve una scelta':state.manual?'Scheda manuale':'Nuovo oggetto proposto'}</span></div>${scenario==='ambiguous'?'<p class="notice amber" style="margin:15px 0">Ci sono due macchine compatibili. Il nome da solo non basta: scegli tu quale usare.</p>':''}${store.objects.map(o=>choice('objectAction',o.id,`${E(o.name)} · ${o.room}`,o.linked?'Ricevuta già collegata. Riutilizziamo la scheda esistente.':'Già presente in questa casa. Collegala solo se è lo stesso oggetto.')).join('')}${scenario!=='existing'?choice('objectAction','new','Crea un nuovo oggetto','Usa questa scelta soltanto se l’oggetto non è già presente.'):''}${choice('objectAction','skip',scenario==='existing'?'Non modificare la scheda dell’oggetto':'Non associare un oggetto adesso',scenario==='existing'?'I collegamenti esistenti restano invariati.':'Puoi registrare soltanto la spesa e collegarla più avanti.')}${state.objectAction==='new'?`<div class="fields">${field('name',true)}${field('brand')}${field('model')}</div><p class="small muted">${state.manual?'Tipo della prova manuale: Elettrodomestico.':'Tipo proposto: Elettrodomestico.'} Ambiente da scegliere in seguito.</p>`:selected?`<div class="check"><input id="enrich" type="checkbox" ${state.enrich?'checked':''}><label for="enrich"><strong>Completa i campi vuoti con i dati della ricevuta</strong><br><span class="small muted">I valori già confermati non vengono sovrascritti.</span></label></div>${state.enrich?`<div class="fields">${field('brand')}${field('model')}</div>`:''}`:''}</section><section class="card"><div class="row"><h2>2. Che cosa facciamo con la spesa?</h2><span class="tag ${scenario==='existing'?'green':''}">${scenario==='existing'?'Spesa già collegata':state.manual?'Compilazione manuale':'Proposta da confermare'}</span></div>${scenario==='existing'?`${choice('costAction','reuse','Mantieni la spesa già registrata',`Acquisto macchina del caffè · ${euro(original.amount)} · 15 settembre 2026. Nessun nuovo costo e nessun importo sovrascritto.`)}${choice('costAction','skip','Non intervenire sulla spesa','Il costo esistente resta conservato e collegato.')}`:`${choice('costAction','create','Registra il costo d’acquisto','Una sola registrazione in Spese, collegata a questa ricevuta.')}${choice('costAction','skip','Non registrare il costo adesso','Puoi occuparti soltanto dell’oggetto.')}${state.costAction==='create'?`<div class="fields">${field('title',true)}${field('amount')}${field('date')}${field('supplier',true)}</div><p class="small muted">${state.manual?'Categoria della prova manuale: Acquisti e sostituzioni.':'Categoria proposta: Acquisti e sostituzioni.'} Non equivale a dichiarare un pagamento.</p>`:''}`}</section><div id="review-error" class="error" role="alert"></div><div class="actions"><a class="btn" href="#/documento">← Documento</a><button class="btn primary" id="review-next">Controlla il riepilogo →</button></div></div>${support()}</div>`;}
function checks(){if(!state.objectAction)return 'Scegli l’oggetto corretto, un nuovo oggetto oppure «Non associare». ';if(state.objectAction==='new'&&!state.name.trim())return 'Inserisci un nome per l’oggetto.';if(state.costAction==='create'&&(!state.title.trim()||!/^\d+(?:,\d{1,2})?$/.test(state.amount)||!(money(state.amount)>0)||!/^\d{4}-\d{2}-\d{2}$/.test(state.date)||Number.isNaN(Date.parse(state.date))||new Date(state.date).toISOString().slice(0,10)!==state.date||state.date>'2026-10-16'))return 'Controlla descrizione, importo positivo e data della spesa.';return '';}
function summaryView(){const obj=store.objects.find(o=>o.id===state.objectAction),n=state.objectAction==='new';return `<p class="crumb">Ricevuta / Riepilogo</p><h1>Solo quello che hai scelto.</h1><p class="lead">Un ultimo controllo prima di confermare. Nessun dato esistente verrà sovrascritto.</p><div class="grid"><section class="card"><div class="summary-item"><span class="tag ${n?'':'green'}">Oggetto · ${n?'Nuovo':obj?'Esistente':'Nessuna modifica'}</span><h2 style="margin-top:10px">${n?E(state.name):obj?`${E(obj.name)} · ${E(obj.room)}`:'La scheda resta com’è'}</h2><p>${n?'Verrà creata una scheda personale e collegata la ricevuta.':obj?(obj.linked?'La ricevuta è già collegata: nessun nuovo collegamento duplicato.':'Verrà collegata la ricevuta a questa scheda.'):'Nessun nuovo oggetto o collegamento.'}</p>${(n||obj&&state.enrich)&&state.objectAction!=='skip'?`<div class="facts"><div class="fact"><span>Marca</span><strong>${E(state.brand)||'Non indicata'}</strong></div><div class="fact"><span>Modello</span><strong>${E(state.model)||'Non indicato'}</strong></div></div><p>Solo campi vuoti da completare. Fonte o modifica manuale conservate separatamente.</p>`:''}</div><div class="summary-item"><span class="tag ${state.costAction==='reuse'?'green':''}">Spesa · ${state.costAction==='create'?'Nuova':state.costAction==='reuse'?'Già presente':'Nessuna modifica'}</span><h2 style="margin-top:10px">${state.costAction==='create'?euro(state.amount):state.costAction==='reuse'?euro(original.amount):'Nessun intervento sulla spesa'}</h2><p>${state.costAction==='create'?`${E(state.title)} · ${E(state.date)}. Collegata alla ricevuta${obj||n?' e all’oggetto scelto':''}.`:state.costAction==='reuse'?'Manteniamo la registrazione già collegata. Non viene creata una seconda spesa.':'I costi già registrati non vengono eliminati o scollegati.'}</p></div><div class="summary-item"><strong>Documento originale</strong><p>Conservato in Documenti · Solo io. Le tue scelte non cambiano la visibilità della ricevuta.</p></div><div class="notice" style="margin-top:16px">${n?'1 nuovo oggetto': '0 nuovi oggetti'} · ${state.costAction==='create'?'1 nuova spesa':'0 nuove spese'}<br>Le proposte escluse non diventano dati confermati.</div><div class="actions"><a class="btn" href="#/proposte">← Modifica le scelte</a><button class="btn primary" id="confirm">Conferma nella demo</button></div></section><div class="card subtle"><h3>Una sola conferma, scelte separate.</h3><p class="small muted" style="margin-top:12px">Puoi tornare indietro e conservare soltanto l’oggetto, soltanto la spesa o nessuna modifica.</p><div class="divider"></div><p class="small">È ancora una simulazione. Nessun dato verrà salvato nella tua casa reale.</p></div></div>`;}
function confirm(){if(applied){go('esito');return;}applied=true;let obj=store.objects.find(o=>o.id===state.objectAction);let newObject=false,newCost=false;if(state.objectAction==='new'){obj={id:'new-coffee',name:state.name.trim(),room:'Da collocare',brand:state.brand.trim(),model:state.model.trim(),linked:true,origins:{brand:state.manual||state.brand!==original.brand?'manual':'document',model:state.manual||state.model!==original.model?'manual':'document'}};store.objects.push(obj);newObject=true;}else if(obj){obj.linked=true;if(state.enrich){obj.origins??={};if(!obj.brand){obj.brand=state.brand.trim();obj.origins.brand=state.brand!==original.brand?'manual':'document';}if(!obj.model){obj.model=state.model.trim();obj.origins.model=state.model!==original.model?'manual':'document';}}}if(state.costAction==='create'){store.expenses.push({id:'new-cost',title:state.title.trim(),amount:state.amount,date:state.date,objectId:obj?.id??null,linked:true});newCost=true;}result={newObject,newCost,objId:obj?.id??null};go('esito');}
function doneView(){return `<div class="statuscircle" aria-hidden="true">✓</div><h1>${result?.newObject||result?.newCost?'Tutto al suo posto.':'Nessun doppione. Solo le integrazioni scelte.'}</h1><p class="lead">Conferma simulata. Nella tua casa reale non è cambiato nulla.</p><section class="card"><div class="row"><div><div class="callout-number">${result?.newObject?1:0}</div><p class="muted">${result?.newObject?'nuovo oggetto':'nuovi oggetti'}</p></div><div><div class="callout-number">${result?.newCost?1:0}</div><p class="muted">${result?.newCost?'nuova spesa':'nuove spese'}</p></div><div><span class="tag green">Originale conservato</span></div></div><div class="divider"></div><p>Puoi ritrovare la ricevuta dalla scheda dell’oggetto e la spesa nella sezione Spese. Sono riferimenti agli stessi elementi, non copie.</p><div class="actions"><a class="btn" href="#/documento">Rivedi il documento</a><div class="row"><a class="btn" href="#/spese">Vedi le spese demo</a><a class="btn primary" href="#/oggetto">Apri l’oggetto demo →</a></div></div></section><p class="footer-note">La simulazione si azzera cambiando scenario o ricaricando la pagina.</p>`;}
function objectView(){const obj=store.objects.find(o=>o.id===result?.objId)||store.objects[0];if(!obj)return `<h1>Nessun oggetto creato.</h1><p class="lead">Hai scelto di non associare un oggetto.</p><a href="#/esito" class="btn">Torna all’esito</a>`;const costs=store.expenses.filter(e=>e.objectId===obj.id);return `<p class="crumb">Casa demo / Oggetti / ${E(obj.name)}</p><h1>${E(obj.name)}</h1><p class="lead">Elettrodomestico · ${obj.room} · Oggetto personale</p><div class="grid"><div class="stack"><section class="card"><h2>La scheda</h2><div class="facts"><div class="fact"><span>Marca</span><strong>${E(obj.brand)||'Da completare'}${obj.brand?`<br><span class="tiny muted">${obj.origins?.brand==='manual'?'Inserito da te':'Ricevuta · pagina 1'}</span>`:''}</strong></div><div class="fact"><span>Modello</span><strong>${E(obj.model)||'Da completare'}${obj.model?`<br><span class="tiny muted">${obj.origins?.model==='manual'?'Inserito da te':'Ricevuta · pagina 1'}</span>`:''}</strong></div></div>${obj.brand?'<button class="linkbtn" data-source="brand">Apri la ricevuta di origine</button>':''}</section><section class="card"><h2>Documenti collegati</h2>${obj.linked?`${fileCard()}<button class="linkbtn" data-source="all">Apri ricevuta</button>`:'<p class="muted">Nessun documento collegato.</p>'}</section><section class="card"><h2>I tuoi costi</h2>${costs.length?costs.map(c=>`<div class="row"><div><strong>${E(c.title)}</strong><p class="small muted">${E(c.date)} · ${c.linked?'ricevuta collegata':''}</p></div><strong>${euro(c.amount)}</strong></div>`).join(''):'<p class="muted">Nessun costo collegato.</p>'}<p class="small muted" style="margin-top:15px">Lo stesso costo è presente in Spese, una sola volta.</p></section></div><div class="card subtle"><h3>La scheda resta completa.</h3><p class="small muted" style="margin-top:10px">Documenti, caratteristiche e costi hanno spazi distinti. L’analisi aggiunge informazioni, non trasforma l’oggetto in una sola voce economica.</p></div></div><div class="actions"><a class="btn" href="#/esito">← Esito</a><a class="btn" href="#/spese">Spese demo</a></div>`;}
function expensesView(){return `<p class="crumb">Casa demo / Spese</p><h1>Il costo, una sola volta.</h1><p class="lead">Acquisti e sostituzioni · registrazioni della simulazione.</p><section class="card"><div class="row"><h2>Elenco</h2><span class="tag">${store.expenses.length} ${store.expenses.length===1?'registrazione':'registrazioni'}</span></div>${store.expenses.length?store.expenses.map(c=>`<div class="summary-item row"><div><strong>${E(c.title)}</strong><p>${E(c.date)} · ${E(store.objects.find(o=>o.id===c.objectId)?.name||'Nessun oggetto')} · ricevuta collegata</p></div><strong>${euro(c.amount)}</strong></div>`).join(''):'<p class="empty">Nessun costo registrato nella demo.</p>'}</section><div class="actions"><a class="btn" href="#/esito">← Esito</a><a class="btn" href="#/oggetto">Oggetto demo</a></div>`;}
function render(){stage=(location.hash.replace(/^#\//,'')||'documento');if(!['documento','proposte','riepilogo','esito','oggetto','spese'].includes(stage)){go('documento');return;}if(['esito','oggetto','spese'].includes(stage)&&!applied){go('documento');return;}if(stage!=='documento'&&!state.consent&&!state.manual&&!applied){go('documento');return;}if(stage==='riepilogo'&&checks()){go('proposte');return;}if(stage==='proposte'&&applied){go('esito');return;}const idx=stage==='documento'?0:stage==='proposte'?1:2;$('#steps').innerHTML=['Documento','Proposte','Conferma'].map((s,i)=>`<li><a href="#/${i===0?'documento':i===1?'proposte':'riepilogo'}" ${i===idx?'class="active" aria-current="step"':''}><span class="num">${i+1}</span>${s}</a></li>`).join('');$('#main').innerHTML=({documento:documentView,proposte:reviewView,riepilogo:summaryView,esito:doneView,oggetto:objectView,spese:expensesView}[stage])();const heading=$('main h1');heading.tabIndex=-1;heading.focus({preventScroll:true});window.scrollTo(0,0);document.title='Dimora · '+({documento:'Ricevuta',proposte:'Proposte',riepilogo:'Riepilogo',esito:'Esito',oggetto:'Oggetto',spese:'Spese'}[stage])+' · Mockup';}
$('#scenario').innerHTML='<option value="existing">Oggetto e spesa già presenti</option><option value="new">Primo acquisto, nulla creato</option><option value="ambiguous">Due oggetti compatibili</option><option value="unreadable">Documento non leggibile</option>';$('.demo strong').textContent='MOCKUP · dati sintetici';$('#demo-description').textContent='Nessuna analisi o modifica reale.';$('.demo label').firstChild.textContent='Scenario ';
$('#scenario').addEventListener('change',e=>{scenario=e.target.value;reset();if(location.hash==='#/documento')render();else go('documento');});
document.addEventListener('input',e=>{if(e.target.dataset.field){const k=e.target.dataset.field;state[k]=e.target.value;const origin=$('#origin-'+k);if(origin)origin.textContent=state.manual?'Inserito da te':state[k]===original[k]?'Dal documento · pagina 1':'Modificato da te';}});
document.addEventListener('change',e=>{if(e.target.id==='consent'){state.consent=e.target.checked;$('#analyze').disabled=!state.consent;}if(e.target.name==='objectAction'||e.target.name==='costAction'){state[e.target.name]=e.target.value;render();}if(e.target.id==='enrich'){state.enrich=e.target.checked;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.source){const key=b.dataset.source;$('#source-title').textContent=key==='original'?'Documento originale':key==='all'?'Ricevuta di esempio':`Fonte · ${labels[key]||'Dato letto'}`;$('#source-content').innerHTML=`<p class="small muted" style="margin-bottom:14px">${receipt.name} · pagina 1 · facsimile sintetico</p>${paper(key==='title'?'name':key)}${!['all','original'].includes(key)?'<p class="small muted" style="margin-top:15px">L’evidenza mostra il dato proposto. Le modifiche che inserisci tu non vengono attribuite al documento.</p>':''}`;$('#source-dialog').showModal();}if(b.id==='close-source')$('#source-dialog').close();if(b.id==='analyze'&&state.consent){if(applied)go('esito');else go('proposte');}if(b.id==='review-next'){const error=checks();if(error){$('#review-error').textContent=error;$('#review-error').scrollIntoView({block:'center'});}else go('riepilogo');}if(b.id==='confirm')confirm();if(b.id==='manual'){scenario='new';$('#scenario').value='new';reset();state.manual=true;state.name='';state.brand='';state.model='';state.title='';state.amount='';state.date='';state.supplier='';render();}});
window.addEventListener('hashchange',render);reset();render();
</script></body></html>
