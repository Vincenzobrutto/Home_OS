s{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.notice{background:var(--soft);border:1px solid #c9e4ea;padding:14px 18px;border-radius:12px;margin-bottom:18px}.notice.success{background:var(--greenbg);border-color:#c2e0d0;color:var(--green)}.notice.warn{background:var(--amberbg);border-color:#ebdba8;color:var(--amber)}.stats{font-size:32px;font-weight:750;margin:8px 0;letter-spacing:-1px}.statline{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border)}.privacy{margin-top:20px;font-size:13px;color:var(--muted)}.stickybar{position:fixed;bottom:0;left:200px;right:0;background:rgba(255,255,255,.98);border-top:1px solid var(--border);z-index:10;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;gap:14px}.stickybar p{margin:0}.loader{height:7px;background:#d5e8ec;border-radius:8px;overflow:hidden;margin:18px 0}.loader span{display:block;width:45%;height:100%;background:var(--accent);animation:progress 1s infinite}@keyframes progress{from{transform:translateX(-100%)}to{transform:translateX(320%)}}dialog{border:1px solid var(--border);border-radius:18px;padding:0;color:var(--ink);width:min(960px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 24px 80px #102d3c38}dialog::backdrop{background:#102d3c80}.dialoghead{display:flex;justify-content:space-between;gap:18px;padding:22px 26px;border-bottom:1px solid var(--border)}.dialoghead h2{margin:4px 0}.dialogbody{padding:24px 26px;max-height:calc(100dvh - 240px);overflow:auto}.editgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:26px}.dialogfoot{padding:16px 26px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:white}.field{display:block;font-weight:650;margin:0 0 17px}.field input,.field select{display:block;margin-top:7px;border:1px solid #9fb6c2;background:white;color:va <body>
<header><span class="brand">Dimora.</span><span class="small">Casa esempio · Vista proprietario</span></header>
<div class="demo"><div class="demo-inner"><strong class="small">Prova un caso</strong><div class="cases" id="cases"></div><button class="reset" id="reset">Ricomincia questo caso</button><span class="small muted">Mockup · solo dati inventati</span></div></div>
<div class="shell"><aside class="nav"><strong>LA TUA CASA</strong><p>Casa</p><p>Attività</p><p class="active">Documenti</p><p>Spese</p><p class="house">Casa esempio<br><span class="small">Originali privati</span></p></aside><main class="content" id="main" tabindex="-1"></main></div>
<div id="bar"></div><dialog id="review" aria-labelledby="dialog-title"></dialog><div id="live" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kinds={ape:['APE','Energia'],cila:['CILA','Pratiche edilizie'],agibility:['Agibilità','Pratiche edilizie'],agibility_record:['Visura agibilità (non certificato)','Pratiche edilizie'],condominium_rules:['Regolamento condominiale','Condominio'],receipt:['Ricevuta','Acquisti e garanzie'],scia:['SCIA','Pratiche edilizie'],system_diagram:['Schema di impianto','Impianti e documenti tecnici'],other:['Altro documento','Altro']};
const cases={singolo:'Singolo',multiplo:'Più documenti',copia:'Copia già presente',conflitto:'Dati in conflitto'};
const base=(id,filename,title,parts,more={})=>({id,filename,title,parts,status:'review',final:null,...more});
const data={ape:()=>base('ape','APE_casa_esempio.pdf','Attestato di prestazione energetica',['ape'],{pdf:'/intake-examples/ape-sintetico.pdf',excerpt:'ATTESTATO DI PRESTAZIONE ENERGETICA\nDati dimostrativi per provare le raccolte.',page:'Pagina 1'}),building:()=>base('building','Pratica_CILA_agibilita.pdf','CILA e agibilità',['cila','agibility'],{pdf:'/intake-examples/pratica-mista-sintetica.pdf',excerpt:'COMUNICAZIONE INIZIO LAVORI ASSEVERATA — CILA\nCERTIFICATO DI AGIBILITÀ',page:'Pagina 1'}),rules:()=>base('rules','Regolamento_casa_esempio.pdf','Regolamento condominiale',['condominium_rules'],{pdf:'/intake-examples/regolamento-sintetico.pdf',excerpt:'REGOLAMENTO CONDOMINIALE\nQuesto documento resta privato dopo la classificazione.',page:'Pagina 1'}),receipt:()=>base('receipt','Ricevuta_macchina_caffe.pdf','Ricevuta macchina del caffè',['receipt'],{pdf:'/intake-examples/ricevuta-sintetica.pdf',excerpt:'DOCUMENTO COMMERCIALE\nMacchina caffè dimostrativa\nTotale: 179,90 EUR',page:'Pagina 1'}),scan:()=>base('scan','Scansione_casa_esempio.pdf','Scansione casa esempio',[],{manual:true,pdf:'/intake-examples/senza-testo-sintetico.pdf',excerpt:'Nessun testo leggibile in questo esempio. Puoi consultare il PDF e indicare tu il tipo.'}),copy:()=>base('copy','APE_casa_copia.pdf','Attestato di prestazione energetica',['ape'],{copy:true,canonical:'ape-existing',current:{title:'APE appartamento',parts:['ape']},pdf:'/intake-examples/ape-sintetico.pdf',excerpt:'ATTESTATO DI PRESTAZIONE ENERGETICA',page:'Pagina 1'}),conflict:()=>base('conflict','Visura_agibilita_esempio.pdf','Visura agibilità',['agibility_record'],{conflict:true,canonical:'visura-existing',current:{title:'Documento pratica casa',parts:['other']},pdf:'/mockup-documenti-assets/visura-sintetica.pdf',excerpt:'VISURA AGIBILITÀ\nNON COSTITUISCE CERTIFICAZIONE\nCertificato di abitabilità citato come riferimento',page:'Pagina 1'}),extra:()=>base('extra','Schema_impianto_esempio.pdf','Schema di impianto',['system_diagram'],{excerpt:'Esempio di documento tecnico: scegli tu a cosa si riferisce. Nessuna scheda verrà creata.'})};
const KEY='dimora.mockup.documenti-semplificato.v2';let all={};try{all=JSON.parse(sessionStorage.getItem(KEY)||'{}')}catch{}let scenario=new URLSearchParams(location.search).get('caso')||'singolo';if(!cases[scenario])scenario='singolo';let selectedIds=new Set();let busy=false,filter='all',archiveFilter='Tutti',message='',draft=null,activeId=null,lastFocus=null;
function initial(){return{uploaded:false,items:[],archive:scenario==='copia'?[{id:'ape-existing',title:'APE appartamento',parts:['ape']}]:scenario==='conflitto'?[{id:'visura-existing',title:'Documento pratica casa',parts:['other']}]:[]}}
function state(){return all[scenario]||(all[scenario]=initial())}function persist(){sessionStorage.setItem(KEY,JSON.stringify(all))}function collection(parts){return[...new Set(parts.map(k=>kinds[k][1]))]}function names(parts){return parts.map(k=>kinds[k][0]).join(' + ')}function isChanged(item,d){return!!item.current&&(item.current.title!==d.title||[...item.current.parts].sort().join()!==[...d.parts].sort().join())}function remain(){return state().items.filter(i=>!['done','kept'].includes(i.status))}function eligible(i){return i.status==='review'&&!i.copy&&!i.conflict&&!i.manual&&i.parts.length>0}function selected(){return state().items.filter(i=>eligible(i)&&selectedIds.has(i.id))}function go(route){location.hash='/'+route;render();window.scrollTo(0,0)}function announce(text){message=text;$('#live').textContent=text}function button(text,action,cls=''){return`<button class="btn ${cls}" data-action="${action}">${esc(text)}</button>`}
function badge(i){let label=i.status==='done'?'In '+collection(i.final.parts).join(' e '):i.status==='kept'?'Mantenuto invariato':i.status==='later'?'Da riprendere':i.copy?'File già presente':i.conflict?'Dati diversi':i.manual?'Tipo da indicare':'Proposta pronta';return`<span class="tag ${['done','kept'].includes(i.status)?'green':['later'].includes(i.status)||i.copy||i.conflict||i.manual?'amber':'gray'}">${esc(label)}</span>`}
function render(){
$('#cases').innerHTML=Object.entries(cases).map(([k,v])=>`<button data-case="${k}" aria-pressed="${scenario===k}">${esc(v)}</button>`).join('');const s=state(),route=(location.hash||'#/carica').slice(2),complete=s.uploaded&&remain().length===0;$('#bar').innerHTML='';
let top=`<div class="eyebrow">Casa esempio / Documenti</div>`;
if(message)top+=`<div class="notice success" role="status">${esc(message)} ${s.archive.length?'<a href="#/archivio">Vedi nei Documenti</a>':''}</div>`;
if(route==='archivio'){
const cols=['Tutti',...new Set(s.archive.flatMap(d=>collection(d.parts)))];if(!cols.includes(archiveFilter))archiveFilter='Tutti';const docs=s.archive.filter(d=>archiveFilter==='Tutti'||collection(d.parts).includes(archiveFilter));
$('#main').innerHTML=top+`<div class="pagehead"><div><h1>Documenti</h1><p class="lead">Gli originali della tua casa, tutti insieme o per tipo.</p></div>${button('Carica documenti','upload','primary')}</div><div class="toolbar" aria-label="Categorie documenti">${cols.map(c=>`<button class="chip" data-collection="${esc(c)}" aria-pressed="${archiveFilter===c}">${esc(c)}</button>`).join('')}</div><section class="card" aria-label="Archivio">${docs.length?docs.map(d=>`<article class="doc"><div><h3>${esc(d.title)}</h3><p class="meta">${esc(collection(d.parts).join(' · '))} · Solo io</p></div><button class="btn" data-edit="${d.id}">Modifica organizzazione</button></article>`).join(''):'<div class="blank"><h2>Qui compariranno i documenti confermati</h2><p class="muted">Le proposte restano da rivedere finché non confermi.</p></div>'}</section>${s.uploaded?'<p><button class="linkbtn" data-action="work">Torna ai documenti appena caricati</button></p>':''}<footer>Prototipo separato dall’app. Nessun documento reale caricato, analizzato o modificato.</footer>`;return;}
if(!s.uploaded){
const labels={singolo:['Un documento, al posto giusto.','Carica un PDF, controlla la proposta e conferma.'],multiplo:['Più documenti. Un solo spazio di lavoro.','Controlla titolo, tipo e destinazione nell’elenco. Seleziona le proposte corrette e confermale insieme.'],copia:['E se il file c’è già?','Proviamo una copia dell’APE già archiviato: nessun secondo originale.'],conflitto:['Una proposta diversa dai tuoi dati.','Il documento è già archiviato come Altro. Vediamo come aggiornare titolo e tipo senza perdere le tue scelte.']};
$('#main').innerHTML=top+`<div class="pagehead"><div><h1>${labels[scenario][0]}</h1><p class="lead">${labels[scenario][1]}</p></div></div><div class="grid"><section class="card"><div class="drop"><span class="tag">${scenario==='multiplo'?'5 PDF di esempio':'1 PDF di esempio'}</span><h2>Carica i documenti della casa</h2><p>Nel prodotto potrai selezionare uno o più file oppure trascinarli qui. In questa prova usiamo soltanto esempi inventati.</p>${button(scenario==='multiplo'?'Carica i 5 documenti di esempio':'Carica il documento di esempio','load','primary')}<p class="small muted">${scenario==='multiplo'?'APE · pratica edilizia · regolamento · ricevuta · scansione':scenario==='copia'?'APE_casa_copia.pdf':scenario==='conflitto'?'Visura_agibilita_esempio.pdf':'APE_casa_esempio.pdf'}</p></div></section><section class="card"><h2>Tu mantieni il controllo</h2><p>La lettura locale propone titolo e tipo. I documenti si organizzano soltanto quando confermi.</p><p class="privacy">Solo io · Nessuna condivisione o spesa viene creata classificando un documento.</p>${s.archive.length?'<p><a href="#/archivio">Vedi il documento già presente</a></p>':''}</section></div><footer>Questa demo simula la lettura locale automatica. Nessun file viene inviato a un servizio AI. La modifica al prodotto resta da approvare.</footer>`;return;}
const items=s.items.filter(i=>filter==='all'||filter==='pending'&&i.status==='review'||filter==='later'&&i.status==='later'||filter==='done'&&['done','kept'].includes(i.status));
const done=s.items.filter(i=>i.status==='done').length,kept=s.items.filter(i=>i.status==='kept').length,multi=s.items.length>1,available=(filter==='all'||filter==='pending')?s.items.filter(eligible):[],picked=selected();
const intro=busy?'Simulazione della lettura locale. Nessun invio esterno.':complete?`${done} ${done===1?'documento organizzato':'documenti organizzati'}${kept?`, ${kept} mantenuto invariato`:''}. Gli originali restano privati.`:multi?'Controlla le proposte qui sotto, seleziona quelle corrette e organizzale con una sola conferma.':'Apri la proposta e conferma: il documento sarà subito organizzato.';
const rows=items.map(i=>{
 const parts=i.final?.parts||i.parts;
 const checkbox=multi&&eligible(i)?`<label class="select-doc"><input type="checkbox" data-select="${i.id}" aria-label="Seleziona ${esc(i.title)}" ${selectedIds.has(i.id)?'checked':''} ${busy?'disabled':''}></label>`:'';
 const details=parts.length&&!i.copy&&!i.conflict?`<p class="meta">Tipo: <strong>${esc(names(parts))}</strong></p><p class="meta">Destinazione: <strong>${esc(collection(parts).join(' + '))}</strong> · Solo alla casa</p>`:'';
 const note=i.manual&&i.status==='review'?'Il testo non è leggibile: indica il tipo consultando l’originale.':(i.copy||i.conflict)&&i.status==='review'?'Apri il documento per scegliere quali dati mantenere.':i.parts.includes('receipt')&&i.status==='review'?'Archivi soltanto la ricevuta: non viene creata una spesa.':'';
 return `<article class="doc"><div class="doc-main">${checkbox}<div class="doc-info"><h3>${esc(i.final?.title||i.title)}</h3><p class="meta">${esc(i.filename)} · Solo io</p>${badge(i)}${details}${note?`<p class="meta">${note}</p>`:''}</div></div><div class="doc-actions"><button class="btn ${!['done','kept'].includes(i.status)?'primary':''}" data-review="${i.id}" ${busy?'disabled':''}>${['done','kept'].includes(i.status)?'Modifica':i.manual?'Indica il tipo':'Rivedi'}</button></div></article>`;
}).join('');
const filters=[['all','Tutti',s.items.length],['pending','Da rivedere',s.items.filter(i=>i.status==='review').length],['later','Più tardi',s.items.filter(i=>i.status==='later').length],['done','Completati',done+kept]].map(([key,label,count])=>`<button class="chip" data-filter="${key}" aria-pressed="${filter===key}">${label} · ${count}</button>`).join('');
const tools=multi&&!busy&&!complete?`<div class="bulk-tools"><p class="small muted">Copie, conflitti e tipi mancanti si rivedono singolarmente.</p>${available.length?button(`Seleziona ${available.length===1?'la proposta disponibile':'le '+available.length+' proposte disponibili'}`,'select-all','quiet'):''}${picked.length?button('Annulla selezione','clear-selection','quiet'):''}</div>`:'';
$('#main').innerHTML=top+`<div class="pagehead"><div><h1>${busy?'Stiamo preparando le proposte…':complete?'Hai finito questo caricamento.':'Controlla e organizza.'}</h1><p class="lead">${intro}</p></div>${button('Vai ai Documenti','archive',complete?'primary':'')}</div>${busy?'<div class="loader" role="status" aria-label="Lettura locale simulata"><span></span></div>':''}<div class="toolbar" aria-label="Stato dei documenti">${filters}</div>${tools}<div class="grid"><section class="card" aria-label="Documenti caricati">${rows||'<p>Nessun documento in questo filtro.</p>'}<div class="addbox">${button('+ Aggiungi documenti','add')}<p class="meta">Resti qui: documenti e risultati già presenti vengono mantenuti.</p></div></section><section class="card summary"><h2>Questo caricamento</h2><div class="stats">${done+kept}<span class="muted" style="font-size:18px"> / ${s.items.length}</span></div><p class="meta">Documenti completati</p><div class="statline"><span>Da rivedere</span><strong>${s.items.filter(i=>i.status==='review').length}</strong></div><div class="statline"><span>Più tardi</span><strong>${s.items.filter(i=>i.status==='later').length}</strong></div><p class="privacy">Le caselle servono a scegliere cosa organizzare. I documenti cambiano solo quando premi Organizza.</p></section></div><footer>Simulazione locale · Nessuna API o AI collegata · I documenti confermati restano nella demo dopo un ricaricamento.</footer>`;
if(multi&&!complete)$('#bar').innerHTML=`<div class="stickybar"><div><strong>${picked.length} ${picked.length===1?'documento selezionato':'documenti selezionati'}</strong><p class="small muted">${picked.length?'La conferma li organizza subito. Gli altri restano da rivedere.':'Seleziona nell’elenco le proposte che vuoi organizzare.'}</p></div><button class="btn primary" data-action="bulk" ${!picked.length||busy?'disabled':''}>${picked.length?`Organizza ${picked.length} ${picked.length===1?'documento selezionato':'documenti selezionati'}`:'Organizza selezionati'}</button></div>`;
}

function load(){if(busy)return;const factories=scenario==='singolo'?['ape']:scenario==='multiplo'?['ape','building','rules','receipt','scan']:scenario==='copia'?['copy']:['conflict'];state().items=factories.map(k=>data[k]());state().uploaded=true;busy=true;persist();go('lavoro');setTimeout(()=>{busy=false;render()},600)}
function openDialog(id){const item=state().items.find(i=>i.id===id);if(!item)return;lastFocus=document.activeElement;activeId=id;const source=item.status==='done'?item.final:null;draft={title:source?.title||item.title,parts:[...(source?.parts||item.parts)],mode:item.copy||item.conflict?'': 'edit',consent:false,dirty:false};if(item.status==='done'||item.status==='kept'){item.current={...(item.final||item.current),parts:[...(item.final||item.current).parts]};draft.title=item.current.title;draft.parts=[...item.current.parts];draft.mode='edit'}drawDialog();$('#review').showModal();$('#dialog-title').focus()}
function comparison(item){return`<div class="compare"><div class="current"><span class="compare-label current-label">Dati attuali</span><span class="meta compare-note">Già confermati da te</span><strong>${esc(item.current.title)}</strong><span class="small">${esc(names(item.current.parts))} · ${esc(collection(item.current.parts).join(' · '))}</span></div><div class="proposed"><span class="compare-label proposed-label">Proposta dal documento</span><span class="meta compare-note">Da controllare prima di sostituire i dati attuali</span><strong>${esc(item.title)}</strong><span class="small">${esc(names(item.parts))} · ${esc(collection(item.parts).join(' · '))}</span></div></div>`}
function drawDialog(error=''){
const i=state().items.find(x=>x.id===activeId);if(!i)return;const current=i.current;const choosing=(i.copy||i.conflict)&&!draft.mode;const updating=draft.mode==='edit';let editor='';
if(i.copy){editor+=`<div class="notice"><strong>Questo file è già nei tuoi Documenti.</strong><p class="small">Useremo lo stesso originale: scegli se mantenerlo com’è o aggiornare come è archiviato.</p></div>${comparison(i)}`}
if(i.conflict&&!i.copy)editor+=`<h3>Quali dati vuoi usare?</h3><p class="meta">La proposta è diversa da ciò che hai già confermato.</p>${comparison(i)}`;
if(i.copy||i.conflict)editor+=`<label class="choice"><input type="radio" name="decision" value="keep" ${draft.mode==='keep'?'checked':''}><span><strong>Mantieni i dati attuali</strong><span class="small muted">Titolo e tipo rimangono invariati.</span></span></label><label class="choice"><input type="radio" name="decision" value="edit" ${updating?'checked':''}><span><strong>${i.copy?'Aggiorna titolo o tipo':'Usa la proposta e controlla i valori'}</strong><span class="small muted">Vedrai il risultato prima di confermare.</span></span></label>`;
if(updating){editor+=`${i.manual?'<div class="notice warn"><strong>Che documento è?</strong><p class="small">In questo esempio non riusciamo a leggere il testo. Il tipo lo indichi tu; non aggiungiamo fonti inventate.</p></div>':''}<label class="field">Titolo del documento<input id="title-input" maxlength="120" value="${esc(draft.title)}" autocomplete="off"></label>`;
if(draft.parts.length>1&&!i.manual)editor+=`<fieldset style="border:0;padding:0;margin:0 0 16px"><legend><strong>Contenuti nello stesso PDF</strong></legend><div class="selected-parts">${i.parts.map(k=>`<label><input type="checkbox" data-part="${k}" ${draft.parts.includes(k)?'checked':''}><span>${esc(kinds[k][0])}<span class="meta"> · pagina 1</span></span></label>`).join('')}</div><p class="meta">Un solo originale, anche quando contiene più tipi.</p></fieldset>`;
else editor+=`<label class="field">Tipo di documento<select id="type-input"><option value="" ${!draft.parts.length?'selected':''}>Scegli il tipo…</option>${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${draft.parts[0]===k?'selected':''}>${esc(v[0])}</option>`).join('')}</select></label>`;
editor+=`<div class="destination"><span class="meta">Lo troverai in</span><strong style="display:block" id="destination">${draft.parts.length?esc(collection(draft.parts).join(' + ')):'Scegli prima il tipo'}</strong><span class="small muted">Solo alla casa · Solo io</span></div>${draft.parts.includes('receipt')?'<p class="small muted">Qui archivi la ricevuta. Registrare l’acquisto o la spesa è una scelta separata.</p>':''}`;
if(current&&isChanged(i,draft))editor+=`<label class="choice"><input id="replace-consent" type="checkbox" ${draft.consent?'checked':''}><span><strong>Sostituisci i dati già confermati con questa scelta</strong><span class="small muted">L’originale resta lo stesso. Non cambiano i permessi.</span></span></label>`;
}
const title=draft.mode==='keep'?'Mantieni documento invariato':'Conferma e organizza';
$('#review').innerHTML=`<div class="dialoghead"><div><span class="meta">${esc(i.filename)} · Solo io</span><h2 id="dialog-title" tabindex="-1">${i.copy?'File già presente':i.conflict?'Controlla i dati diversi':i.manual?'Indica il tipo di documento':'Controlla la proposta'}</h2></div><button class="btn" data-close>Chiudi</button></div><div class="dialogbody"><div class="editgrid"><section aria-label="La tua scelta">${editor}${choosing?'<p class="meta">Scegli come procedere. Nessuna opzione è preselezionata.</p>':''}${error?`<p class="error" role="alert">${esc(error)}</p>`:''}</section><aside><details class="original" ${matchMedia('(min-width:850px)').matches?'open':''}><summary>Vedi documento e fonte</summary><p class="meta">Esempio sintetico ${i.page?'· '+i.page:''}</p><div class="source">${esc(i.excerpt).replace(/\n/g,'<br>')}</div>${i.pdf?`<a class="btn" href="${i.pdf}" target="_blank" rel="noopener">Apri il PDF di esempio</a>`:''}<p class="meta">La proposta va controllata. Il tipo non certifica validità o regolarità.</p></details></aside></div></div><div class="dialogfoot"><button class="btn quiet" data-later>Decidi più avanti</button><button class="btn primary" data-confirm ${choosing?'disabled':''}>${choosing?'Scegli come procedere':title}</button></div>`;
}
function capture(){if(!draft)return;const input=$('#title-input');if(input)draft.title=input.value.trim();const select=$('#type-input');if(select)draft.parts=select.value?[select.value]:[];if($('#replace-consent'))draft.consent=$('#replace-consent').checked}
function validate(){const i=state().items.find(x=>x.id===activeId);if(draft.mode==='keep')return'';if(!draft.mode)return'Scegli se mantenere o aggiornare i dati.';if(!draft.title)return'Indica un titolo per ritrovare il documento.';if(!draft.parts.length)return'Scegli almeno un tipo di documento.';if(isChanged(i,draft)&&!draft.consent)return'Per cambiare dati già confermati serve il consenso alla sostituzione.';return''}
function close(){const d=$('#review');if(d.open)d.close();draft=null;activeId=null;lastFocus?.focus?.()}
function apply(item,value){item.final={title:value.title,parts:[...value.parts]};item.status='done';selectedIds.delete(item.id);const id=item.canonical||item.id;const n=state().archive.findIndex(x=>x.id===id);const doc={id,...item.final};if(n<0)state().archive.push(doc);else state().archive[n]=doc}
function finish(){capture();const error=validate();if(error){drawDialog(error);return}const i=state().items.find(x=>x.id===activeId);if(draft.mode==='keep'){i.status='kept';selectedIds.delete(i.id);i.final={...i.current,parts:[...i.current.parts]};announce('Documento mantenuto invariato. Non è stato creato un secondo originale.')}else{apply(i,draft);announce('Documento organizzato in '+collection(draft.parts).join(' e ')+'.')}persist();close();render()}
function bulk(){const docs=selected();if(!docs.length)return;docs.forEach(i=>apply(i,{title:i.title,parts:i.parts}));persist();selectedIds.clear();announce(docs.length+(docs.length===1?' documento organizzato. ':' documenti organizzati. ')+remain().length+' restano da rivedere o riprendere.');render()}

function add(){lastFocus=document.activeElement;$('#review').innerHTML=`<div class="dialoghead"><div><span class="meta">Stesso caricamento</span><h2 id="dialog-title" tabindex="-1">Aggiungi un documento di esempio</h2></div><button class="btn" data-close>Chiudi</button></div><div class="dialogbody"><p>Gli originali e le scelte già presenti restano qui.</p>${[['rules','Un regolamento condominiale'],['extra','Uno schema di impianto'],['scan','Una scansione senza testo']].map(([k,label])=>`<div class="summaryitem row"><span>${label}</span><button class="btn" data-add="${k}" ${state().items.some(i=>i.filename===data[k]().filename)?'disabled':''}>${state().items.some(i=>i.filename===data[k]().filename)?'Già presente':'Aggiungi esempio'}</button></div>`).join('')}</div>`;$('#review').showModal();$('#dialog-title').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.case){close();selectedIds.clear();scenario=b.dataset.case;filter='all';message='';history.replaceState(null,'',`${location.pathname}?caso=${scenario}#/carica`);render();return}
if(b.id==='reset'){close();selectedIds.clear();all[scenario]=initial();message='';filter='all';persist();go('carica');return}
if(b.hasAttribute('data-close')){if(draft?.dirty&&!confirm('Vuoi scartare le modifiche non salvate?'))return;close();return}
if(b.hasAttribute('data-later')){const i=state().items.find(x=>x.id===activeId);i.status='later';selectedIds.delete(i.id);announce('Documento conservato. Potrai riprendere la scelta da questa lista.');persist();close();render();return}
if(b.hasAttribute('data-confirm')){finish();return}
if(b.dataset.review){openDialog(b.dataset.review);return}
if(b.dataset.edit){const item=state().items.find(i=>(i.canonical||i.id)===b.dataset.edit);if(item){openDialog(item.id)}else{const d=state().archive.find(x=>x.id===b.dataset.edit);const added=scenario==='copia'?data.copy():data.conflict();added.status='done';added.final={title:d.title,parts:[...d.parts]};state().items.push(added);state().uploaded=true;openDialog(added.id)}return}
if(b.dataset.filter){filter=b.dataset.filter;selectedIds.clear();render();return}if(b.dataset.collection){archiveFilter=b.dataset.collection;render();return}
if(b.dataset.add){const i=data[b.dataset.add]();i.id+='-'+Date.now();state().items.push(i);persist();close();filter='all';announce('Documento aggiunto allo stesso caricamento. Le scelte precedenti sono conservate.');go('lavoro');return}
if(b.dataset.action){({load,archive:()=>go('archivio'),upload:()=>{if(state().uploaded)go('lavoro');else go('carica')},work:()=>go('lavoro'),add,bulk,'select-all':()=>{state().items.filter(eligible).forEach(i=>selectedIds.add(i.id));render()},'clear-selection':()=>{selectedIds.clear();render()}})[b.dataset.action]?.()}
});
document.addEventListener('change',e=>{const id=e.target.dataset.select;if(!id)return;e.target.checked?selectedIds.add(id):selectedIds.delete(id);render();document.querySelector('[data-select="'+id+'"]')?.focus()});
$('#review').addEventListener('change',e=>{if(!draft)return;const t=e.target;if(t.name==='decision'){draft.mode=t.value;draft.consent=false;draft.title=t.value==='edit'?state().items.find(i=>i.id===activeId).title:state().items.find(i=>i.id===activeId).current.title;draft.parts=[...(t.value==='edit'?state().items.find(i=>i.id===activeId).parts:state().items.find(i=>i.id===activeId).current.parts)];draft.dirty=true;drawDialog();return}if(t.dataset.part){draft.parts=t.checked?[...draft.parts,t.dataset.part]:draft.parts.filter(k=>k!==t.dataset.part);draft.consent=false;draft.dirty=true;drawDialog();return}if(t.id==='type-input'){capture();draft.consent=false;draft.dirty=true;drawDialog();return}if(t.id==='replace-consent'){draft.consent=t.checked;return}});
$('#review').addEventListener('input',e=>{if(e.target.id!=='title-input'||!draft)return;const i=state().items.find(x=>x.id===activeId);draft.title=e.target.value;draft.dirty=true;draft.consent=false;if(i.current){const start=e.target.selectionStart;drawDialog();const input=$('#title-input');input.focus();input.setSelectionRange(start,start)}});
$('#review').addEventListener('cancel',e=>{if(draft?.dirty&&!confirm('Vuoi scartare le modifiche non salvate?'))e.preventDefault();else{draft=null;activeId=null}});
window.addEventListener('hashchange',render);if(!location.hash)history.replaceState(null,'',`${location.pathname}?caso=${scenario}#/carica`);render();
})();
</script>
</body>
</html>
