<style>
:root{--ink:#183442;--muted:#607782;--nav:#123140;--accent:#0c6879;--soft:#e5f4f5;--bg:#f3f7f8;--line:#dde7eb;--green:#286647;--amber:#835b19}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.55 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #25a4ba;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,3.2vw,40px);line-height:1.15;letter-spacing:-1.1px;max-width:760px}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:16px}a{color:var(--accent)}.demo{padding:8px 26px;background:#fff1d5;color:#70521b;font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.demo button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}header{background:var(--nav);color:white;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;font-weight:750;letter-spacing:-1.3px}.brand span{color:#88dce1}.pill{border:1px solid #526d78;padding:5px 12px;border-radius:20px;font-size:13px}.shell{display:grid;grid-template-columns:184px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 110px)}aside{padding:34px 18px;border-right:1px solid var(--line)}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted)}.side{display:grid;gap:7px;margin-top:20px}.side span{padding:10px 14px;color:var(--muted)}.side .active{border-radius:10px;background:var(--soft);color:var(--accent);font-weight:700}.aside-note{margin-top:30px;font-size:12px;color:var(--muted)}main{padding:30px 38px 60px;min-width:0}.crumb{font-size:13px;color:var(--muted);margin-bottom:22px}.steps{display:flex;gap:22px;list-style:none;padding:0;margin:0 0 30px;font-size:13px;color:var(--muted)}.steps li{display:flex;align-items:center;gap:8px}.steps b{border:1px solid #bfd1d8;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:12px}.steps .active{color:var(--accent);font-weight:700}.steps .active b{background:var(--accent);color:white;border-color:var(--accent)}.lead{margin:12px 0 25px;max-width:740px;color:var(--muted);font-size:16px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}.stack{display:grid;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:24px;min-width:0}.card h2{margin-bottom:14px}.card p+p{margin-top:10px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.row{display:flex;align-items:center;gap:13px;justify-content:space-between;flex-wrap:wrap}.btn{border:1px solid #cddfe4;border-radius:9px;padding:10px 15px;background:white;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:44px}.primary{background:var(--accent);border-color:var(--accent);color:white}.link{border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:8px 0}.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;background:var(--soft);color:var(--accent);border-radius:6px;padding:4px 9px}.green{background:#e9f5ed;color:var(--green)}.amber{background:#fff3db;color:var(--amber)}.gray{background:#edf1f3;color:#566c77}.notice{background:var(--soft);border-left:3px solid #44a6b1;padding:14px 17px;border-radius:0 9px 9px 0;font-size:13px}.drop{padding:36px 25px;border:2px dashed #b2cfd5;border-radius:14px;text-align:center;background:#f8fcfc}.drop h2{margin:12px 0 8px}.drop p{max-width:490px;margin:0 auto 20px}.fileicon{width:40px;height:47px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:10px;font-weight:800}.docrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:20px 0;border-top:1px solid var(--line)}.docrow:first-child{border-top:0;padding-top:0}.docrow:last-child{padding-bottom:0}.docrow h3,.filename{overflow-wrap:anywhere}.docrow p{margin:4px 0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid var(--line);border-radius:20px;background:white;padding:7px 13px;color:var(--muted);font-size:13px}.filter.active{background:var(--nav);color:white;border-color:var(--nav)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:25px}.sticky{position:sticky;top:20px}.stat{font-size:38px;font-weight:730;letter-spacing:-1px;line-height:1.1;margin-bottom:8px}.summaryline{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}.check{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.check input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}dialog{border:0;padding:0;border-radius:18px;width:min(940px,calc(100% - 26px));max-height:90vh;color:var(--ink);box-shadow:0 24px 90px #102b4460}dialog::backdrop{background:#12314099}.dialoghead{padding:22px 25px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:15px}.dialogbody{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.dialogfoot{padding:18px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.close{border:0;background:#eff5f7;color:var(--ink);border-radius:8px;width:36px;height:36px;font-size:23px;flex:none}.paper{background:#f9f8f3;border:1px solid #e4e3dc;padding:25px;min-height:260px;font:14px/1.8 Georgia,serif;border-radius:5px}.paper .stamp{color:#8a6860;font:10px 'Segoe UI',sans-serif;letter-spacing:1.2px;border-bottom:1px solid #d5cfc2;margin-bottom:25px;padding-bottom:8px}.field{display:grid;gap:7px;margin:15px 0}.field input,.field select{width:100%;max-width:100%;border:1px solid #cddce2;border-radius:8px;padding:10px;background:white;color:var(--ink)}.field label{font-size:13px;font-weight:650}.choice{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;margin:10px 0;font-size:14px}.choice input{accent-color:var(--accent);flex:none;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.empty{padding:25px;text-align:center;color:var(--muted)}.doneicon{width:58px;height:58px;display:grid;place-items:center;background:#e3f3e9;border-radius:50%;font-size:28px;color:var(--green);margin-bottom:20px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}footer{padding-top:24px;font-size:12px;color:var(--muted)}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.sticky{position:static}.shell{grid-template-columns:150px minmax(0,1fr)}main{padding:28px 24px}.docrow{grid-template-columns:35px minmax(0,1fr)}.docrow>.btn{grid-column:2;justify-self:start}.dialogbody{gap:16px}}
@media(max-width:600px){header{padding:14px 18px}.demo{padding:8px 16px}.pill{max-width:170px;font-size:11px}.shell{display:block}aside{display:none}main{padding:22px 16px 45px}.steps{gap:10px;font-size:11px;margin-bottom:22px}.steps b{width:21px;height:21px}.card{padding:18px}.dialogbody{grid-template-columns:1fr;padding:18px}.dialoghead{padding:18px}.paper{min-height:190px}.dialogfoot{padding:16px}.drop{padding:27px 16px}.lead{font-size:15px}.actions>.btn{flex:1;justify-content:center}.crumb{margin-bottom:16px}.row{gap:8px}}

<body>
<div class="demo"><span><strong>MOCKUP NAVIGABILE</strong> · Dati sintetici · Nessun caricamento o invio AI reale</span><button id="reset">Ricomincia la demo</button></div>
<header><div class="brand">dimora<span>.</span></div><div class="pill">Casa esempio · Solo io</div></header>
<div class="shell"><aside><span class="eyebrow">La tua casa</span><nav class="side" aria-label="Contesto del prototipo"><span>Casa</span><span>Oggetti e impianti</span><span class="active" aria-current="page">Documenti</span><span>Spese</span></nav><p class="aside-note">Questo prototipo mostra solo il nuovo ingresso Documenti. Le sezioni esistenti non vengono riprogettate.</p></aside><main id="main"></main></div>
<dialog id="review" aria-labelledby="dialog-title"></dialog>
<script>
'use strict';
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[
{id:'ape',name:'APE_Casa.pdf',title:'Attestato di prestazione energetica',family:'Energia',where:'Casa → Documenti → Energia',status:'ready',pages:8,note:'Un documento della casa. Nessun oggetto o costo da creare.',excerpt:'ATTESTATO DI PRESTAZIONE ENERGETICA\nUnità immobiliare: Via Esempio 12\nClasse energetica: C',source:1},
{id:'edilizia',name:'Pratica_CILA_e_agibilita.pdf',title:'Pratica edilizia con più contenuti',family:'Pratiche edilizie',where:'Casa → Documenti → Pratiche edilizie',status:'choose',pages:14,note:'CILA e segnalazione di agibilità nello stesso PDF. Conserviamo un unico originale.',excerpt:'COMUNICAZIONE DI INIZIO LAVORI ASSEVERATA\nVia Esempio 12\nPratica dimostrativa CILA-026',source:1},
{id:'schema',name:'Schema_impianto.pdf',title:'Schema di impianto',family:'Impianti e documenti tecnici',where:'Casa → Documenti tecnici',status:'choose',pages:3,note:'È uno schema tecnico, ma l’impianto a cui collegarlo va scelto da te.',excerpt:'SCHEMA IMPIANTO\nPiano primo — distribuzione\nElaborato tecnico dimostrativo',source:1},
{id:'condominio',name:'Regolamento_condominio.pdf',title:'Regolamento del condominio',family:'Condominio',where:'Casa → Documenti → Condominio',status:'ready',pages:18,note:'Documento condominiale nella tua raccolta privata. Non viene pubblicato ai vicini.',excerpt:'CONDOMINIO ESEMPIO\nREGOLAMENTO\nArt. 1 — Uso delle parti comuni',source:1},
{id:'ricevuta',name:'Ricevuta_macchina_caffe.pdf',title:'Ricevuta macchina del caffè',family:'Acquisti e garanzie',where:'Macchina del caffè · Cucina',status:'ready',pages:1,note:'Ricevuta già collegata alla macchina del caffè. Anche il costo di 179,90 € è già registrato.',excerpt:'RICEVUTA DIMOSTRATIVA\nMacchina del caffè · Lume Mini 90\n15/09/2026\nTotale documento: 179,90 EUR',source:1},
{id:'copia',name:'APE_Casa_copia.pdf',title:'Possibile seconda copia',family:'Da verificare',where:'Copia identica di APE_Casa.pdf nel lotto',status:'duplicate',pages:8,note:'Nel mockup il contenuto coincide byte per byte. Non viene proposta una nuova analisi.',excerpt:'ATTESTATO DI PRESTAZIONE ENERGETICA\nUnità immobiliare: Via Esempio 12\nClasse energetica: C',source:1},
{id:'scan',name:'Scansione_documento.pdf',title:'Documento non leggibile',family:'Non classificato',where:'Casa → Documenti → Da organizzare',status:'unreadable',pages:2,note:'Non riusciamo a leggere il testo. Puoi archiviare manualmente il documento e riprendere in seguito.',excerpt:'[Anteprima sintetica di una scansione sfocata]\n\nIl testo non è leggibile.\nNessun dato è stato ricostruito.',source:1}
];
let items=seed.map(x=>({...x})), choices={}, applied=false, filter='all', consent=false, current=null, returnFocus=null;
const main=document.querySelector('#main'), modal=document.querySelector('#review');
const labels={ready:'Pronto da rivedere',choose:'Serve una scelta',duplicate:'Copia identica',unreadable:'Testo non leggibile'};
const selected=()=>items.filter(d=>choices[d.id]&&choices[d.id].action!=='later');
function go(path){location.hash='/'+path;}
function badge(d){return choices[d.id]?`<span class="badge ${choices[d.id].action==='later'?'gray':'green'}">${choices[d.id].action==='later'?'Rimandato':'✓ Scelta pronta'}</span>`:`<span class="badge ${d.status==='ready'?'':d.status==='choose'?'amber':'gray'}">${labels[d.status]}</span>`;}
function step(){return (location.hash||'#/carica').slice(2);}
function intro(n){return `<div class="crumb">Documenti / Organizza più documenti</div><ol class="steps" aria-label="Passaggi">${['Carica','Rivedi le proposte','Conferma'].map((s,i)=>`<li class="${n===i+1?'active':''}" ${n===i+1?'aria-current="step"':''}><b>${i+1}</b>${s}</li>`).join('')}</ol>`;}
function render(){let path=step(); if(!['carica','analisi','proposte','riepilogo','esito','archivio'].includes(path)){go('carica');return;} if(applied&&!['esito','archivio','carica'].includes(path)){go('esito');return;}
if(path==='carica')main.innerHTML=intro(1)+`<h1>Tutti i tuoi documenti.<br>Ognuno al suo posto.</h1><p class="lead">Carica un gruppo di file della casa. Ti aiutiamo a riconoscerli e a trovare i collegamenti giusti, senza ricopiare tutto a mano.</p><div class="grid"><section class="card"><div class="drop"><span class="badge">PDF · Foto · Più file</span><h2>Trascina qui i tuoi documenti</h2><p class="muted">Nel prodotto potrai selezionare più file insieme. Qui usiamo un lotto di esempio già preparato.</p><button class="btn primary" data-go="analisi">Usa il lotto di esempio · 7 file</button></div><div class="chips"><span class="badge gray">APE</span><span class="badge gray">CILA e agibilità</span><span class="badge gray">Schemi impianti</span><span class="badge gray">Condominio</span><span class="badge gray">Ricevute</span></div><p class="small muted">Un file può contenere più documenti. Più file possono appartenere alla stessa scheda.</p></section><section class="card"><h2>Prima di iniziare</h2><p><strong>Casa esempio</strong><br><span class="small muted">Destinazione del lotto</span></p><p><strong>Solo io</strong><br><span class="small muted">Classificare un regolamento come condominiale non lo condivide con nessuno.</span></p><p class="small muted">Cartelle cloud e inoltro via email saranno ingressi successivi.</p></section></div>`;
if(path==='analisi')main.innerHTML=intro(1)+`<h1>Il lotto è pronto da organizzare.</h1><p class="lead">Il caricamento conserva gli originali. L’analisi propone come organizzarli; le scelte verranno dopo.</p><div class="grid"><section class="card"><h2>7 file nel lotto di esempio</h2>${items.map(d=>`<div class="docrow"><span class="fileicon">PDF</span><div><h3>${E(d.name)}</h3><p class="small muted">${d.pages} pagine · Solo io</p></div><span class="badge ${d.id==='copia'?'amber':'green'}">${d.id==='copia'?'Copia rilevata':'✓ Originale acquisito'}</span></div>`).join('')}</section><div class="stack"><section class="card"><h2>Cosa verrà proposto</h2><p>Tipo e nome del documento, raccolta della casa e possibili collegamenti a schede già presenti.</p><p class="small muted">Un costo si propone solo quando il documento lo giustifica. Nessun oggetto per ogni PDF.</p><div class="notice" style="margin-top:18px">Questa è una simulazione. Nessun file reale viene letto o inviato a un servizio AI.</div><label class="check"><input id="consent" type="checkbox" ${consent?'checked':''}><span class="small">Ho capito: voglio provare l’organizzazione del solo lotto dimostrativo.</span></label><button id="analyze" class="btn primary" ${consent?'':'disabled'}>Simula l’analisi del lotto</button></section><button class="btn" data-go="carica">← Torna all’ingresso</button></div></div>`;
if(path==='proposte')main.innerHTML=intro(2)+`<div class="row"><h1>Una casa, documenti diversi.</h1><span class="badge gray">Lotto demo · Solo io</span></div><p class="lead">Abbiamo separato le proposte per tipo. Controlla i casi chiari e scegli come gestire gli altri: niente viene applicato finché non confermi.</p><div class="toolbar" aria-label="Filtra gli esiti">${[['all','Tutti',7],['ready','Pronti',3],['choose','Da scegliere',2],['duplicate','Copie',1],['unreadable','Non leggibili',1]].map(([k,t,c])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}">${t} · ${c}</button>`).join('')}</div><div class="grid"><section class="card">${items.filter(d=>filter==='all'||d.status===filter).map(d=>`<article class="docrow"><span class="fileicon">PDF</span><div><div class="row"><h3>${E(d.title)}</h3>${badge(d)}</div><p class="small muted filename">${E(d.name)}</p><p class="small">${E(choices[d.id]?.where||d.where)}</p><p class="tiny muted">${E(d.note)}</p></div><button class="btn" data-review="${d.id}">${choices[d.id]?'Modifica scelta':'Rivedi'}</button></article>`).join('')}</section><section class="card sticky"><h2>Le tue scelte</h2><div class="stat">${selected().length}<span class="small muted"> / 7</span></div><p class="muted small">File con una decisione pronta. Il resto può rimanere da rivedere.</p><div class="summaryline" style="margin-top:20px"><span>Nuovi oggetti</span><strong>0</strong></div><div class="summaryline"><span>Nuove spese</span><strong>0</strong></div><p class="small muted">La ricevuta si collega a ciò che esiste già. I documenti edilizi e condominiali non diventano oggetti.</p><div class="actions"><button class="btn primary" data-go="riepilogo" ${selected().length?'':'disabled'}>Controlla il riepilogo →</button></div></section></div><div class="actions"><button class="link" data-go="analisi">← Vedi il lotto</button><span class="small muted">Puoi rimandare una decisione senza perdere l’originale.</span></div>`;
if(path==='riepilogo'){const picked=selected();main.innerHTML=intro(3)+`<h1>Applichiamo solo le tue scelte.</h1><p class="lead">Questo riepilogo riguarda il lotto di esempio. Non certifica i documenti e non modifica l’app reale.</p><div class="grid"><section class="card"><h2>${picked.length} decisioni pronte</h2>${picked.length?picked.map(d=>`<div class="docrow"><span class="fileicon">${d.id==='copia'?'=':'PDF'}</span><div><h3>${E(choices[d.id].title)}</h3><p class="small">${E(choices[d.id].where)}</p><p class="tiny muted">${d.id==='edilizia'?'Riferimenti ai contenuti selezionati nelle pagine dello stesso originale.':d.id==='copia'?'Non si crea un secondo documento; nessun originale già presente viene eliminato.':d.id==='ricevuta'?'Riusa macchina del caffè e spesa esistenti: nessun doppione.':'Visibilità invariata: Solo io.'}</p></div></div>`).join(''):'<p>Nessuna decisione pronta. Torna alle proposte.</p>'}</section><section class="card"><h2>Il risultato</h2><div class="summaryline"><span>Nuovi oggetti / spese</span><strong>0 / 0</strong></div><div class="summaryline"><span>Da rivedere più avanti</span><strong>${items.length-picked.length}</strong></div><p class="small muted">Gli originali già acquisiti restano disponibili anche se rimandi l’organizzazione.</p><label class="check"><input id="finalcheck" type="checkbox"><span class="small">Ho controllato queste decisioni e voglio applicarle nella demo.</span></label><button id="confirm" class="btn primary" disabled>Conferma nella demo</button></section></div><div class="actions"><button class="btn" data-go="proposte">← Modifica le scelte</button></div>`;}
if(path==='esito')main.innerHTML=`<div class="crumb">Documenti / Esito del lotto</div><div class="doneicon">✓</div><h1>Più ordine.<br>Senza moltiplicare le schede.</h1><p class="lead">${selected().length} decisioni applicate nella demo. Nessun nuovo oggetto e nessuna nuova spesa.</p><div class="grid"><section class="card"><h2>La tua raccolta</h2>${['Energia','Pratiche edilizie','Impianti e documenti tecnici','Condominio','Acquisti e garanzie','Non classificato'].map(f=>{const docs=selected().filter(d=>(choices[d.id].family||d.family)===f&&d.id!=='copia');return docs.length?`<div class="summaryline"><span>${E(f)}</span><strong>${docs.length}</strong></div>`:'';}).join('')}<p class="small muted">Un PDF con CILA e agibilità resta un unico originale con due classificazioni, non due copie.</p><div class="actions"><button class="btn primary" data-go="archivio">Vedi i documenti organizzati →</button></div></section><section class="card"><h2>Il resto non si perde</h2><p>${items.length-selected().length} file ancora da rivedere nel lotto.</p><p class="small muted">Originali e decisioni restano separati. Classificare non condivide il documento e non certifica regolarità o validità.</p><button class="link" id="resume">Riprendi le decisioni rimaste</button></section></div>`;
if(path==='archivio')main.innerHTML=`<div class="crumb">Casa esempio / Documenti</div><h1>I documenti, nel loro contesto.</h1><p class="lead">Vista dimostrativa dopo la conferma. Le raccolte sono filtri: ogni originale rimane un solo documento.</p><section class="card">${selected().filter(d=>d.id!=='copia').map(d=>`<article class="docrow"><span class="fileicon">PDF</span><div><h3>${E(choices[d.id].title)}</h3><p class="small">${E(choices[d.id].where)}</p><span class="badge gray">Solo io</span>${d.id==='edilizia'?`${choices[d.id].cila?'<span class="badge gray">CILA · pp. 1–10</span>':''} ${choices[d.id].agibilita?'<span class="badge gray">Agibilità · pp. 11–14</span>':''}`:''}</div><button class="btn" data-original="${d.id}">Vedi originale</button></article>`).join('')||'<p>Nessun documento organizzato in questo giro.</p>'}</section><div class="actions"><button class="btn" data-go="esito">← Esito del lotto</button></div>`;
main.insertAdjacentHTML('beforeend','<footer>Prototipo locale · Dati inventati · Nessuna API, AI, cloud o email collegata · Stato solo in memoria: ricaricare ricomincia la demo.</footer>');
const heading=main.querySelector('h1');heading.tabIndex=-1;heading.focus({preventScroll:true});window.scrollTo(0,0);
}
function openDoc(id,onlyOriginal=false){current=items.find(d=>d.id===id);if(!current)return;returnFocus=document.activeElement;const d=current,saved=choices[id];
modal.innerHTML=`<div class="dialoghead"><div><p class="eyebrow">${onlyOriginal?'Originale sintetico':'Rivedi il documento'}</p><h2 id="dialog-title">${E(d.title)}</h2><p class="small muted filename">${E(d.name)} · ${d.pages} pagine · Solo io</p></div><button class="close" aria-label="Chiudi">×</button></div><div class="dialogbody"><section><h3>Documento originale</h3><p class="tiny muted">Anteprima di esempio, non un PDF reale.</p><div class="paper"><div class="stamp">DIMORA · DOCUMENTO SINTETICO · NON VALIDO</div><div id="papertext">${E(d.excerpt).replace(/\n/g,'<br>')}</div></div>${id==='edilizia'?'<div class="chips"><button class="btn" data-page="cila">Pagina 1 · CILA</button><button class="btn" data-page="agibilita">Pagina 11 · Agibilità</button></div>':`<p class="tiny muted">${d.status==='unreadable'?'Originale consultabile · nessuna estrazione disponibile':`Fonte della proposta · pagina ${d.source}`}</p>`}</section><section>${onlyOriginal?`<h3>Organizzazione confermata</h3><p class="small" style="margin-top:12px">${E(saved?.where||d.where)}</p>`:controls(d,saved)}</section></div><div class="dialogfoot"><button class="btn close-dialog">Chiudi senza modificare</button>${onlyOriginal?'':`<div class="row"><button class="link" id="later">Decidi più avanti</button><button class="btn primary" id="save">${d.status==='duplicate'?'Conferma gestione copia':'Usa questa organizzazione'}</button></div>`}</div>`;modal.showModal();}
function controls(d,saved){if(d.status==='duplicate')return `<h3>Lo stesso contenuto è già nel lotto</h3><p class="small muted" style="margin-top:10px">APE_Casa.pdf è l’originale di riferimento. Non occorre analizzarlo di nuovo.</p><label class="choice"><input type="radio" name="duplicate" value="reference" ${saved?'checked':''}><span>Usa l’originale di riferimento, senza aggiungere una seconda copia.</span></label><p class="small muted">Se fosse una nuova versione, non andrebbe trattata come copia identica. In questo caso demo gli originali coincidono.</p>`;
let fields=`<div class="field"><label for="title">Nome da mostrare</label><input id="title" maxlength="120" value="${E(saved?.title||d.title)}"></div>`;
if(d.id==='schema')fields+=`<div class="field"><label for="target">A quale impianto appartiene?</label><select id="target"><option value="">Scegli tu: nessuna associazione automatica</option>${[['idraulico','Impianto idraulico'],['termico','Impianto di riscaldamento'],['solo','Conserva solo fra i documenti tecnici della casa']].map(([v,t])=>`<option value="${v}" ${saved?.target===v?'selected':''}>${t}</option>`).join('')}</select></div><p class="small muted">Non abbiamo elementi sufficienti per scegliere un impianto. Nessuna nuova scheda verrà creata.</p>`;
else if(d.id==='edilizia')fields+=`<h3>Due contenuti, un originale</h3><label class="check"><input type="checkbox" id="cila" ${saved?.cila?'checked':''}><span>CILA · pagine 1–10</span></label><label class="check"><input type="checkbox" id="agibilita" ${saved?.agibilita?'checked':''}><span>Segnalazione di agibilità · pagine 11–14</span></label><p class="small muted">Controlla entrambe le parti nell’anteprima. Le pagine restano riferimenti nello stesso PDF. Non deduciamo esito della pratica o regolarità urbanistica.</p>`;
else if(d.id==='scan')fields+=`<div class="field"><label for="manualfamily">Dove vuoi conservarlo?</label><select id="manualfamily"><option value="">Scegli una raccolta</option>${['Energia','Pratiche edilizie','Impianti e documenti tecnici','Condominio','Da organizzare'].map(t=>`<option ${saved?.manualfamily===t?'selected':''}>${t}</option>`).join('')}</select></div><p class="small muted">Nome e raccolta sono inseriti da te. Nessun campo estratto e nessuna falsa fonte. OCR o sostituzione del file saranno un percorso distinto.</p>`;
else fields+=`<div class="notice"><strong>${E(d.where)}</strong><br>${E(d.note)}</div>${d.id==='ricevuta'?'<p class="small" style="margin-top:15px">Oggetto esistente: <strong>Macchina del caffè · Cucina</strong><br>Spesa esistente: <strong>179,90 € · 15/09/2026</strong><br>Nessuna nuova registrazione o sovrascrittura.</p>':''}`;
return `<h3>${d.status==='unreadable'?'Organizza manualmente':'La proposta da controllare'}</h3>${fields}<p id="error" role="alert" class="small" style="color:#a33232;margin-top:14px"></p>`;}
function close(){modal.close();returnFocus?.focus();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.id==='reset'){items=seed.map(x=>({...x}));choices={};consent=false;applied=false;filter='all';if(modal.open)modal.close();go('carica');render();}else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.filter){filter=b.dataset.filter;render();}else if(b.dataset.review)openDoc(b.dataset.review);else if(b.dataset.original)openDoc(b.dataset.original,true);else if(b.classList.contains('close')||b.classList.contains('close-dialog'))close();else if(b.dataset.page)document.querySelector('#papertext').innerHTML=b.dataset.page==='cila'?E(current.excerpt).replace(/\n/g,'<br>'):'SEGNALAZIONE CERTIFICATA DI AGIBILITÀ<br>Via Esempio 12<br>Pagina 11 del medesimo PDF dimostrativo';else if(b.id==='analyze')go('proposte');else if(b.id==='later'){choices[current.id]={action:'later'};close();render();}else if(b.id==='resume'){applied=false;filter='all';go('proposte');}else if(b.id==='confirm'&&selected().length){applied=true;go('esito');}else if(b.id==='save')save();});
document.addEventListener('change',event=>{if(event.target.id==='consent'){consent=event.target.checked;document.querySelector('#analyze').disabled=!consent;}if(event.target.id==='finalcheck')document.querySelector('#confirm').disabled=!event.target.checked||!selected().length;});
function save(){const d=current;let selection={action:'organize',title:document.querySelector('#title')?.value.trim()||d.title,where:d.where};const fail=message=>{let e=document.querySelector('#error');if(!e){e=document.createElement('p');e.id='error';e.setAttribute('role','alert');modal.querySelector('.dialogbody section:last-child').append(e);}e.textContent=message;return false;};
if(d.status==='duplicate'){if(!modal.querySelector('input[name="duplicate"]:checked'))return fail('Scegli come gestire la copia.');selection={action:'reference',title:'Riusa APE_Casa.pdf',where:'Nessuna seconda copia e nessuna nuova analisi'};}
else{if(!document.querySelector('#title').value.trim())return fail('Inserisci un nome da mostrare.');if(d.id==='schema'){selection.target=document.querySelector('#target').value;if(!selection.target)return fail('Scegli un impianto oppure conserva il documento solo a livello casa.');selection.where=selection.target==='solo'?'Casa → Documenti tecnici':`Casa → Impianti → ${selection.target==='idraulico'?'Impianto idraulico':'Impianto di riscaldamento'}`;}
if(d.id==='edilizia'){selection.cila=document.querySelector('#cila').checked;selection.agibilita=document.querySelector('#agibilita').checked;if(!selection.cila&&!selection.agibilita)return fail('Seleziona almeno un contenuto dopo aver consultato l’originale.');selection.where='Casa → Pratiche edilizie · '+[selection.cila?'CILA (pp. 1–10)':'',selection.agibilita?'Agibilità (pp. 11–14)':''].filter(Boolean).join(' + ');}
if(d.id==='scan'){selection.manualfamily=document.querySelector('#manualfamily').value;if(!selection.manualfamily)return fail('Scegli una raccolta oppure rimanda la decisione.');selection.where='Casa → Documenti → '+selection.manualfamily;selection.family=selection.manualfamily==='Da organizzare'?'Non classificato':selection.manualfamily;}}
choices[d.id]=selection;close();render();}
modal.addEventListener('cancel',()=>returnFocus?.focus());window.addEventListener('hashchange',render);if(!location.hash)go('carica');render();
</script>
</body></html>
