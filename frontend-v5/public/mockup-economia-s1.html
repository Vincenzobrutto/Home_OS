<style>
:root{--nav:#132e3e;--ink:#182f3d;--muted:#536b79;--bg:#f2f6f8;--accent:#0b6177;--soft:#e3f3f6;--border:#dce6eb;--success:#24624b;--warning:#80520c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI',system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select{touch-action:manipulation}button,a{cursor:pointer}a{color:var(--accent);text-decoration:none}button{border:1px solid var(--border);background:white;color:var(--ink);border-radius:11px;padding:10px 15px;min-height:44px;font-weight:600}button:hover,a:hover{filter:brightness(.96)}button.primary,a.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}a.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);padding:10px 15px;min-height:44px;border-radius:11px;font-weight:600}a.primary{border-color:var(--accent)}:focus-visible{outline:3px solid #3a9ec0;outline-offset:3px}header{background:var(--nav);color:white;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:26px;font-weight:800;letter-spacing:-1px;color:white}.logo small{font-size:11px;color:#99e5ef;letter-spacing:1px;margin-left:7px}header .account{font-size:13px;color:#c7dce7}.demobar{padding:9px 24px;background:#e3f3f6;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.demobar button{padding:3px 10px;min-height:32px;font-size:12px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 124px)}aside{background:var(--nav);padding:30px 16px;color:#c7dce7}aside a{display:flex;align-items:center;gap:12px;color:#c7dce7;padding:13px 15px;border-radius:10px;margin:3px 0}aside a.active{background:#274958;color:#b9f5fb;font-weight:700}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:700;text-transform:uppercase}.sidebar-caption{padding:0 15px 18px;font-size:10px;letter-spacing:2px}main{padding:36px 40px 90px;max-width:1250px;width:100%;margin:auto;align-self:start}h1{font-size:36px;line-height:1.15;letter-spacing:-1.3px;margin:8px 0 12px}h2{font-size:21px;letter-spacing:-.5px;margin:0 0 17px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 16px}.muted{color:var(--muted)}.small{font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.topline p{margin-bottom:0}.grid{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.4fr);gap:24px}.grid.equal{grid-template-columns:1fr 1fr}.card{padding:24px;border:1px solid var(--border);background:white;border-radius:18px;margin-bottom:20px}.card.tint{background:var(--soft);border-color:#c9e4ea}.metric{font-size:38px;font-weight:750;letter-spacing:-1.3px;line-height:1.3;margin:8px 0 20px}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0}.line{border-top:1px solid var(--border);margin:15px 0}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;background:var(--soft);color:var(--accent);padding:4px 8px;font-size:11px;font-weight:600}.tag.ok{background:#e6f5ed;color:var(--success)}.tag.warning{background:#fff4dc;color:var(--warning)}.tag.neutral{background:#edf2f5;color:var(--muted)}.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row-body{flex:1;min-width:0}.row-title{display:block;font-weight:650;color:var(--ink)}.row .amount{white-space:nowrap;font-weight:700}.iconbox{background:var(--soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0;width:42px;height:42px;border-radius:12px}.icon{width:20px;height:20px;vertical-align:middle;flex-shrink:0}.actions{display:flex;flex-wrap:wrap;gap:10px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:22px;padding-bottom:10px}.tabs a{padding:9px 12px;border-radius:9px}.tabs a.active{background:var(--soft);font-weight:700}.back{display:inline-flex;gap:7px;align-items:center;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label.field{display:block;font-size:13px;font-weight:600}input:not([type=radio]),select,textarea{display:block;width:100%;background:white;border:1px solid #9fb6c2;border-radius:9px;padding:11px 12px;margin-top:6px;color:var(--ink);min-height:44px;max-width:100%}textarea{resize:vertical;min-height:90px}.help{font-size:12px;color:var(--muted);font-weight:400;margin:6px 0 0}.error{background:#fdeced;color:#a43038;padding:12px;border-radius:8px;margin-bottom:16px}.notice{background:#fff4dc;color:#80520c;padding:13px;border-radius:10px;font-size:13px}.choice{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:var(--soft)}.choice input{margin-top:5px;accent-color:var(--accent)}.choice div{flex:1}.choice .price{font-weight:750}.document{background:#fffefa;border:1px solid #e5dfd0;padding:26px;border-radius:10px;color:#3b4246}.document blockquote{margin:16px 0;padding:12px;border-left:3px solid #99e5ef;background:#eaf8fa}.document .docrow{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #e5dfd0;padding:12px 0}.source-note{font-size:11px;color:#657481;margin-top:5px}details>summary{cursor:pointer;font-weight:600;padding:13px 0}details .formgrid{padding-top:14px}.empty{padding:30px 10px;text-align:center}.route-cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.route-cards a{border:1px solid var(--border);background:white;border-radius:14px;padding:20px;display:block;color:var(--ink)}.route-cards .icon{margin-bottom:10px;width:26px;height:26px;color:var(--accent)}.bottom{display:none}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--nav);color:white;padding:14px 20px;border-radius:12px;max-width:90vw;z-index:20;box-shadow:0 6px 24px #132e3e30}#toast:empty{display:none}.break{overflow-wrap:anywhere}.testguide{font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:24px;padding-top:16px}.testguide a{margin-right:15px;display:inline-block;padding:5px 0}
@media(max-width:960px){main{padding:28px 24px 90px}.layout{grid-template-columns:170px minmax(0,1fr)}.grid{grid-template-columns:1fr}.grid.equal{grid-template-columns:1fr 1fr}h1{font-size:30px}}

@media(max-width:350px){.row{flex-wrap:wrap}.row .amount{margin-left:46px}.row button{margin-left:auto}.demobar span{max-width:190px}.tabs a{padding:8px}.card{padding:17px}.summary-row{font-size:13px}}

<header><a class="logo" href="#/casa">dimora.<small>V5</small></a><span class="account">Casa di Giulia · Milano<br>Economia della casa<br><small>Modulo aggiuntivo · prova UX</small></span></header>
<div class="layout"><aside><div class="sidebar-caption">LA TUA CASA</div><a href="#/casa" data-nav="casa"></a><a href="#/oggetti" data-nav="oggetti"></a><a href="#/documenti" data-nav="documenti"></a><a href="#/storico" data-nav="storico"></a><div class="testguide" style="border-color:#274958;color:#c7dce7">Prova di esperienza.<br>I dati di questa pagina sono separati dall’app.</div></aside><main id="main"></main></div>

<script>
'use strict';
const paths={casa:'M3 10l9-7 9 7v10H3z M9 20v-8h6v8',oggetti:'M5 3h14v18H5z M5 8h14 M9 5h1 M9 11h1',documenti:'M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6 M9 16h6',storico:'M3 6h18v14H3z M3 9h18 M15 13h6',plus:'M12 4v16 M4 12h16',arrow:'M18 12H5 M11 6l-6 6 6 6',check:'M4 12l5 5L20 6',work:'M4 7h16v13H4z M8 7V4h8v3',doc:'M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6 M9 16h6',spark:'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.doc}"/></svg>`;
const cats={electricity:'Energia elettrica',gas:'Gas',water:'Acqua',internet_services:'Internet e servizi',condominium_ordinary:'Condominio ordinario',condominium_extraordinary:'Condominio straordinario',insurance:'Assicurazione',taxes:'Tributi',maintenance:'Manutenzione',repairs_works:'Riparazioni e lavori',purchase_replacement:'Acquisti e sostituzioni',financing:'Finanziamento',other:'Altro'};
const objects=['Caldaia','Lavatrice','Lavabo bagno'];const groups=c=>c==='financing'?'financing':['repairs_works','purchase_replacement','condominium_extraordinary'].includes(c)?'works':c?'management':'unclassified';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n/100);const date=v=>new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z'));const key='dimora-s1-ux-mock-v1'+(new URLSearchParams(location.search).has('qa')?'-qa':'');
function seed(){return {expenses:[{id:'e1',title:'Bolletta luce · settembre',amount:7800,day:'2026-09-30',cat:'electricity',supplier:'Energia Demo',object:'',work:'',source:'Estratto e confermato',document:'Bolletta luce.pdf'},{id:'e2',title:'Gas · settembre',amount:8000,day:'2026-09-30',cat:'gas',supplier:'Gas Demo',object:'Caldaia',work:'',source:'Inserito da te',document:''},{id:'e3',title:'Internet · ottobre',amount:2990,day:'2026-10-01',cat:'internet_services',supplier:'Rete Demo',object:'',work:'',source:'Inserito da te',document:''},{id:'e4',title:'Riparazione rubinetto',amount:8500,day:'2026-09-12',cat:'repairs_works',supplier:'Idraulico Demo',object:'Lavabo bagno',work:'Rifacimento bagno',source:'Inserito da te',document:''},{id:'e5',title:'Piastrelle e posa',amount:103500,day:'2026-09-10',cat:'repairs_works',supplier:'Ceramiche Demo',object:'',work:'Rifacimento bagno',source:'Collegato a un documento',document:'Fattura piastrelle.pdf'},{id:'e6',title:'Acquisto lavatrice',amount:42000,day:'2026-05-08',cat:'purchase_replacement',supplier:'Elettrodomestici Demo',object:'Lavatrice',work:'',source:'Inserito da te',document:''},{id:'e7',title:'Rata mutuo · ottobre',amount:45000,day:'2026-10-05',cat:'financing',supplier:'Banca Demo',object:'',work:'',source:'Inserito da te',document:''}],works:['Rifacimento bagno'],drafts:{},filter:{year:'2026',cat:'',object:'',work:'',q:''}}}
let state;try{state=JSON.parse(localStorage.getItem(key))||seed()}catch{state=seed()}const previous=[{id:'p1',title:'Bolletta luce · settembre',amount:10000,day:'2025-09-30',cat:'electricity',supplier:'Energia Demo',object:'',work:'',source:'Inserito da te',document:''},{id:'p2',title:'Gas · settembre',amount:7400,day:'2025-09-30',cat:'gas',supplier:'Gas Demo',object:'Caldaia',work:'',source:'Inserito da te',document:''},{id:'p3',title:'Internet · ottobre',amount:2800,day:'2025-10-01',cat:'internet_services',supplier:'Rete Demo',object:'',work:'',source:'Inserito da te',document:''},{id:'p4',title:'Intervento idraulico',amount:9500,day:'2025-09-12',cat:'repairs_works',supplier:'Idraulico Demo',object:'Lavabo bagno',work:'',source:'Inserito da te',document:''},{id:'p5',title:'Rata mutuo · ottobre',amount:45000,day:'2025-10-05',cat:'financing',supplier:'Banca Demo',object:'',work:'',source:'Inserito da te',document:''}];
const save=()=>localStorage.setItem(key,JSON.stringify(state));
if(!state.expenses.some(e=>e.id==='p1')){state.expenses.push(...previous);save()}let toastTimer;function toast(t){document.getElementById('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
const option=(v,label,selected)=>`<option value="${esc(v)}"${v===selected?' selected':''}>${esc(label)}</option>`;const catOptions=sel=>option('','Non classificata',sel)+Object.entries(cats).map(([c,l])=>option(c,l,sel)).join('');const objOptions=sel=>option('','Nessun oggetto',sel)+objects.map(o=>option(o,o,sel)).join('');const workOptions=sel=>option('','Nessun lavoro',sel)+state.works.map(w=>option(w,w,sel)).join('');
function title(t,sub,back){return `${back?`<a class="back" href="${back}">${icon('arrow')} Indietro</a>`:''}<div class="topline"><div><div class="eyebrow muted">CASA DI GIULIA · SPESE PERSONALI</div><h1 tabindex="-1">${t}</h1><p class="muted">${sub}</p></div>${!back?`<a href="#/aggiungi" class="btn primary">${icon('plus')} Aggiungi spesa</a>`:''}</div>`}
const tabs=active=>`<div class="tabs"><a class="${active==='storico'?'active':''}" href="#/storico">Sostenute</a><a class="${active==='oggetti'?'active':''}" href="#/oggetti">Per oggetto</a><a class="${active==='lavori'?'active':''}" href="#/lavori">Lavori</a></div>`;
function rows(es){return es.length?es.sort((a,b)=>b.day.localeCompare(a.day)).map(e=>`<div class="row"><div class="iconbox">${icon(e.work?'work':'doc')}</div><div class="row-body"><a class="row-title break" href="#/spesa/${e.id}">${esc(e.title)}</a><div class="muted small">${date(e.day)} · ${cats[e.cat]||'Non classificata'}</div><div class="small muted">${esc([e.object,e.work].filter(Boolean).join(' · '))}</div></div><span class="amount">${money(e.amount)}</span></div>`).join(''):'<div class="empty"><h3>Nessun costo registrato</h3><p class="muted">Prova un altro periodo o modifica i filtri.</p></div>'}
function filtered(){const f=state.filter;return state.expenses.filter(e=>!e.archived&&e.day.startsWith(f.year)&&(!f.cat||e.cat===f.cat||(f.cat==='null'&&!e.cat))&&(!f.object||e.object===f.object)&&(!f.work||e.work===f.work)&&(!f.q||(e.title+' '+e.supplier).toLocaleLowerCase('it').includes(f.q.toLocaleLowerCase('it'))))}
function guide(){return '<div class="testguide">Percorsi da provare: <a href="#/manuale">Costo manuale</a><a href="#/documenti">Bolletta con arretrati</a><a href="#/lavoro/Rifacimento%20bagno">Costo di un lavoro</a><a href="#/oggetto/Lavatrice">Costo di un oggetto</a></div>'}
function comparison(){const f=state.filter,prior=String(Number(f.year)-1),es=state.expenses.filter(e=>!e.archived&&e.day.startsWith(prior)&&(!f.cat||e.cat===f.cat||(f.cat==='null'&&!e.cat))&&(!f.object||e.object===f.object)&&(!f.work||e.work===f.work)&&(!f.q||(e.title+' '+e.supplier).toLocaleLowerCase('it').includes(f.q.toLocaleLowerCase('it'))));const total=filtered().reduce((s,e)=>s+e.amount,0),base=es.reduce((s,e)=>s+e.amount,0),delta=total-base;return es.length?'<div class="summary-row"><span>Stesso periodo '+prior+'</span><strong>'+money(base)+'</strong></div><div class="summary-row"><span>Differenza registrata</span><strong>'+(delta>0?'+':'')+money(delta)+'</strong></div><p class="help">Più o meno registrazioni non dimostrano un risparmio. Confronto per data di riferimento, non per consumi.</p>':'<p class="small muted">Nessuna registrazione nel periodo precedente. Non mostriamo percentuali né un risparmio presunto.</p>'}
function history(){const es=filtered(),total=es.reduce((s,e)=>s+e.amount,0),sums={management:0,works:0,financing:0,unclassified:0};es.forEach(e=>sums[groups(e.cat)]+=e.amount);const f=state.filter,active=f.cat||f.object||f.work||f.q;const open=Object.entries(state.drafts).filter(([,d])=>!d.expenseId&&!d.abandoned);return title('Le tue spese, più chiare.','Quanto hai registrato per la casa e per ciò che contiene.')+tabs('storico')+`<details class="card" ${active?'open':''}><summary>Periodo e filtri ${active?'· attivi':''}</summary><form id="filters" class="formgrid"><label class="field">Periodo<select name="year">${option('2026','2026 · fino al 14 ottobre',f.year)}${option('2025','2025',f.year)}</select></label><label class="field">Categoria<select name="cat">${option('','Tutte le categorie',f.cat)}${option('null','Non classificata',f.cat)}${Object.entries(cats).map(([c,l])=>option(c,l,f.cat)).join('')}</select></label><label class="field">Oggetto<select name="object">${option('','Tutti gli oggetti',f.object)}${objects.map(o=>option(o,o,f.object)).join('')}</select></label><label class="field">Lavoro<select name="work">${option('','Tutti i lavori',f.work)}${state.works.map(w=>option(w,w,f.work)).join('')}</select></label><label class="field full">Cerca descrizione o fornitore<input name="q" value="${esc(f.q)}" placeholder="Es. gas, idraulico…"></label><div class="actions full"><button class="primary">Applica filtri</button><button type="button" id="clear-filters">Azzera filtri</button></div></form></details><div class="grid"><div><section class="card"><div class="muted small">${active?'Costi registrati con questi filtri':'Totale registrato'} · ${f.year}</div><div class="metric">${money(total)}</div>${[['management','Gestione della casa'],['works','Lavori e acquisti'],['financing','Finanziamento'],['unclassified','Non classificata']].map(([g,l])=>`<div class="summary-row"><span>${l}</span><strong>${money(sums[g])}</strong></div>`).join('')}<p class="help">Il totale include tutte le voci. Non attesta pagamenti.</p><div class="line"></div><details><summary>Confronta con lo stesso periodo</summary>${comparison()}</details></section>${open.length?`<section class="card tint"><h2>Da confermare · ${open.length}</h2><p class="small">Le bozze non entrano nei totali.</p>${open.map(([id])=>`<a class="btn" href="#/bozza/${id}">${id==='gas'?'Bolletta gas':'Fattura idraulico'} · Apri bozza</a>`).join('')}</section>`:''}</div><section class="card"><h2>${es.length} ${es.length===1?'spesa':'spese'} registrate</h2>${rows(es)}<p class="help">Spese personali. Una registrazione compare qui e negli oggetti senza essere duplicata.</p></section></div>`+guide()}
function fields(initial={},draft=false){return `<div class="formgrid"><label class="field full">Descrizione<input name="title" required maxlength="120" value="${esc(initial.title||'')}" placeholder="Es. Riparazione lavatrice"></label><label class="field">Importo in euro<input name="amount" required inputmode="decimal" value="${esc(initial.amount||'')}" placeholder="Es. 85,00"><p class="help">Importo del costo, non conferma del pagamento.</p></label><label class="field">Data di riferimento<input type="date" name="day" required max="2026-10-14" value="${esc(initial.day??'2026-10-14')}"><p class="help">Decide il periodo nello storico. Non è la data di pagamento.</p></label><label class="field full">Categoria <span class="muted">· facoltativa</span><select name="cat">${catOptions(initial.cat||'')}</select></label><label class="field">Oggetto <span class="muted">· facoltativo</span><select name="object">${objOptions(initial.object||'')}</select></label><label class="field">Lavoro <span class="muted">· facoltativo</span><select name="work">${workOptions(initial.work||'')}</select></label><div class="full"><details ${draft?'open':''}><summary>Dettagli del documento · facoltativi</summary><div class="formgrid"><label class="field">Fornitore<input name="supplier" maxlength="120" value="${esc(initial.supplier||'')}"></label><label class="field">Numero documento<input name="number" value="${esc(initial.number||'')}"></label><label class="field">Data documento<input name="docday" type="date" value="${esc(initial.docday||'')}"></label><label class="field">Scadenza<input name="due" type="date" value="${esc(initial.due||'')}"></label><label class="field">Competenza dal<input name="from" type="date" value="${esc(initial.from||'')}"></label><label class="field">Competenza al<input name="to" type="date" value="${esc(initial.to||'')}"></label></div><p class="help">Scadenza e competenza restano dettagli: in S1 non generano impegni o promemoria.</p></details></div><label class="field full">Nota <span class="muted">· facoltativa</span><textarea name="note" maxlength="500">${esc(initial.note||'')}</textarea></label></div>`}
function add(){return title('Come vuoi aggiungerla?','Puoi partire da pochi dati o farti aiutare da un documento.','#/storico')+`<div class="route-cards"><a href="#/manuale">${icon('plus')}<h2>Inserisci manualmente</h2><p class="muted">Descrizione, importo e data. Documento e collegamenti puoi aggiungerli dopo.</p><strong>Inizia →</strong></a><a href="#/documenti">${icon('spark')}<h2>Da bolletta o fattura</h2><p class="muted">Una bozza da controllare prima di registrare il costo.</p><strong>Scegli documento →</strong></a></div>`}
function manual(params){const q=new URLSearchParams(params||'');return title('Registra una spesa.','Bastano tre dati. Tutto il resto è facoltativo.','#/storico')+`<section class="card"><form id="expense-form"><div id="form-error" role="alert"></div>${fields({object:q.get('object')||'',work:q.get('work')||'',document:q.get('document')||''})}${q.get('document')?`<p class="tag">Documento collegato: ${esc(q.get('document'))}</p>`:''}<div class="line"></div><div class="actions"><button class="primary">Registra spesa</button><a class="btn" href="#/storico">Annulla</a></div><p class="help">Prova dimostrativa: nessuna registrazione nel tuo account reale.</p></form></section>`}
function docs(){return title('Parti da un documento.','Scegli un esempio per provare la compilazione assistita.','#/aggiungi')+`<section class="card"><h2>Documenti dimostrativi</h2>${[['gas','Bolletta gas · settembre','80 € di totale corrente e 20 € di arretrati'],['invoice','Fattura idraulico','100 € imponibile + 22 € IVA'],['scan','Scansione di una ricevuta','Esempio non analizzabile in questa prima versione']].map(([id,t,s])=>`<div class="row"><div class="iconbox">${icon('doc')}</div><div class="row-body"><strong>${t}</strong><div class="muted small">${s}</div></div><a class="btn" href="#/analisi/${id}">Scegli</a></div>`).join('')}</section><section class="card tint"><h3>Nel prodotto userai i tuoi originali</h3><p class="small">Qui proviamo il percorso con documenti sintetici. Non carichiamo né inviamo file ad alcun servizio.</p></section>`}
function analysis(id){if(id==='scan')return title('Questo documento richiede inserimento manuale.','La prima versione non legge foto o scansioni.','#/documenti')+`<section class="card"><span class="tag warning">Documento non supportato dall’analisi</span><p>Puoi comunque registrare il costo e conservare il documento collegato.</p><a class="btn primary" href="#/manuale?document=Ricevuta%20scansionata.pdf">Inserisci manualmente</a></section>`;const existing=state.drafts[id];if(existing)return draft(id);return title(id==='gas'?'Bolletta gas · settembre':'Fattura idraulico','Prima dell’analisi scegli tu come procedere.','#/documenti')+`<section class="card tint"><h2>${icon('spark')} Compilazione assistita</h2><p>Nel prodotto, con il tuo consenso, il testo del documento sarà inviato ad Anthropic per proporti i dati. Dovrai controllarli e confermarli.</p><p class="small"><strong>In questo mockup simuleremo soltanto il risultato: nessun file o dato viene inviato.</strong></p><div class="actions"><button class="primary" data-analyze="${id}">Simula estrazione</button><a class="btn" href="#/manuale?document=${id==='gas'?'Bolletta%20gas.pdf':'Fattura%20idraulico.pdf'}">Inserisci manualmente</a></div></section>`}
function docSource(id){const gas=id==='gas';return `<section class="card"><h2>La fonte, accanto ai dati</h2><div class="document"><div class="eyebrow muted">DOCUMENTO SINTETICO · PAGINA 1</div><h3>${gas?'Gas Demo · Bolletta settembre':'Idraulico Demo · Fattura n. 42'}</h3><p class="small">Data documento: 30 settembre 2026</p>${gas?'<div class="docrow"><span>Totale corrente bolletta</span><strong>80,00 €</strong></div><div class="docrow"><span>Saldo precedenti bollette</span><strong>20,00 €</strong></div><blockquote>Importo da pagare: <strong>100,00 €</strong></blockquote><p class="small">Competenza: 1–30 settembre<br>Scadenza: 20 ottobre 2026</p>':'<div class="docrow"><span>Imponibile</span><strong>100,00 €</strong></div><div class="docrow"><span>IVA 22%</span><strong>22,00 €</strong></div><blockquote>Totale documento: <strong>122,00 €</strong></blockquote><p class="small">Intervento: riparazione rubinetto bagno</p>'}</div><p class="help">Esempio testuale per provare la verifica. Nel prodotto qui aprirai l’originale e i riferimenti di pagina.</p></section>`}
function draft(id){const d=state.drafts[id];if(!d)return analysis(id);if(d.expenseId)return title('Questa bozza è già confermata.','Il costo è disponibile nello storico, senza una seconda registrazione.','#/storico')+`<section class="card"><span class="tag ok">${icon('check')} Confermata</span><p>Puoi aprire la spesa collegata.</p><a class="btn primary" href="#/spesa/${d.expenseId}">Apri spesa</a></section>`;if(d.abandoned)return title('Bozza accantonata.','L’originale rimane disponibile.','#/documenti')+`<button data-reopen="${id}">Riapri bozza</button>`;const gas=id==='gas',init=gas?{title:'Gas · settembre',amount:'',day:'2026-09-30',cat:'gas',supplier:'Gas Demo',number:'G-2026-09',docday:'2026-09-30',from:'2026-09-01',to:'2026-09-30',due:'2026-10-20'}:{title:'Riparazione rubinetto · fattura',amount:'122,00',day:'2026-09-30',cat:'repairs_works',supplier:'Idraulico Demo',number:'42',docday:'2026-09-30'};return title('Controlla prima di registrare.','La bozza non è ancora una spesa. Verifica i dati con la fonte.','#/storico')+`<div class="grid equal"><div>${docSource(id)}<section class="card tint"><h3>Potrebbe essere già nello storico</h3>${gas?`<p><strong>Gas · settembre · 80,00 €</strong><br><span class="small muted">Stesso fornitore, importo e data. Inserita manualmente, senza documento.</span></p><button data-link="${id}" data-expense="e2">Collega alla spesa esistente</button><p class="help">Aggiunge il documento. Importo, categoria e data restano invariati.</p>`:'<p class="small">Nessuna spesa coincidente in questo esempio. Puoi comunque registrare un costo distinto.</p>'}</section></div><section class="card"><span class="tag">Bozza simulata · da confermare</span><form id="draft-form" data-draft="${id}"><div id="form-error" role="alert"></div>${gas?`<h3 style="margin-top:20px">Quale importo vuoi registrare?</h3><div class="notice">Il totale da pagare comprende 20 € di arretrati, che potresti avere già registrato.</div><label class="choice"><input type="radio" name="amount-choice" value="80,00" required><div><strong>Totale corrente del documento</strong><div class="source-note">Pagina 1 · “Totale corrente bolletta”</div></div><span class="price">80,00 €</span></label><label class="choice"><input type="radio" name="amount-choice" value="100,00"><div><strong>Importo da pagare</strong><div class="source-note">Include 20 € di precedenti bollette</div></div><span class="price">100,00 €</span></label><label class="choice"><input type="radio" name="amount-choice" value="manual"><div><strong>Un altro importo</strong><div class="source-note">Lo dichiari tu, senza attribuirlo all’estrazione.</div></div></label>`:'<p class="notice">Proposto il totale lordo 122,00 €. Imponibile e IVA non sono costi aggiuntivi.</p>'}${fields(init,true)}<div class="line"></div><button class="primary">Conferma e registra nuova spesa</button><p class="help">Confermare registra il costo. Non dichiara un pagamento.</p><div class="actions"><a class="btn" href="#/storico">Torna più tardi</a><button type="button" data-abandon="${id}">Accantona bozza</button></div><p class="help">Le proposte originali restano in Spese. Eventuali modifiche non confermate al modulo non vengono salvate.</p></form></section></div>`}
function detail(id){const e=state.expenses.find(x=>x.id===id);if(!e)return title('Spesa non disponibile.','','#/storico');return title(esc(e.title),'Una sola registrazione, con tutti i suoi collegamenti.','#/storico')+`<div class="grid equal"><section class="card"><span class="tag ${e.archived?'neutral':'ok'}">${e.archived?'Archiviata':'Attiva'}</span><div class="metric">${money(e.amount)}</div>${[['Data di riferimento',date(e.day)],['Categoria',cats[e.cat]||'Non classificata'],['Fonte dell’importo',e.source],['Fornitore',e.supplier||'Non indicato'],['Oggetto',e.object||'Nessuno'],['Lavoro',e.work||'Nessuno']].map(([l,v])=>`<div class="summary-row"><span class="muted">${l}</span><strong style="text-align:right">${esc(v)}</strong></div>`).join('')}<div class="line"></div><p class="help">Non è una conferma di pagamento.</p><div class="actions"><button data-archive="${id}">${e.archived?'Ripristina':'Archivia spesa'}</button>${e.object?`<a class="btn" href="#/oggetto/${encodeURIComponent(e.object)}">Vai all’oggetto</a>`:''}</div></section><section class="card"><h2>Documento e memoria</h2>${e.document?`<div class="row"><div class="iconbox">${icon('doc')}</div><div class="row-body"><strong>${esc(e.document)}</strong><div class="small muted">${e.source==='Estratto e confermato'?'Dati proposti e confermati da te':'Collegato: non certifica l’importo inserito'}</div></div></div>`:'<p class="muted">Nessun documento collegato. Il costo è utilizzabile anche così.</p><a class="btn" href="#/documenti">Collega da documento</a>'}<h3 style="margin-top:22px">Nota</h3><p>${esc(e.note||'Nessuna nota')}</p><h3>Storia della prova</h3><p class="small muted">${e.document?'Documento collegato. ':''}${e.demoNew?'Costo registrato durante questa navigazione.':'Registrazione iniziale dimostrativa.'}${e.archived?' Archiviata durante la prova.':''}</p></section></div>`}
function objectList(){return title('Quanto ti costano gli oggetti.','Acquisto, manutenzione e riparazioni, senza duplicare le spese.')+tabs('oggetti')+`<div class="route-cards">${objects.map(o=>{const es=state.expenses.filter(e=>e.object===o&&!e.archived);return `<a href="#/oggetto/${encodeURIComponent(o)}">${icon('oggetti')}<h2>${o}</h2><div class="metric">${money(es.reduce((s,e)=>s+e.amount,0))}</div><p class="small muted">${es.length} costi registrati · tutte le registrazioni disponibili</p><strong>Apri oggetto →</strong></a>`}).join('')}</div>`}
function objectDetail(o){const es=state.expenses.filter(e=>e.object===o&&!e.archived);return title(esc(o),'I costi di questo oggetto, nello stesso storico della casa.','#/oggetti')+`<section class="card"><div class="muted">Totale registrato per l’oggetto</div><div class="metric">${money(es.reduce((s,e)=>s+e.amount,0))}</div><a class="btn primary" href="#/manuale?object=${encodeURIComponent(o)}">${icon('plus')} Aggiungi spesa per ${esc(o)}</a>${rows(es)}<p class="help">Nessuna quota dei lavori viene attribuita automaticamente a questo oggetto.</p></section>`}
function works(){return title('I costi dei tuoi lavori.','Raggruppa le spese, senza dover gestire un cantiere.')+tabs('lavori')+`<section class="card"><form id="new-work" class="actions"><label class="field" style="flex:1">Nome nuovo lavoro<input name="name" required maxlength="120" placeholder="Es. Sistemazione terrazzo"></label><button class="primary" style="align-self:end">Crea lavoro demo</button></form></section><section class="card">${state.works.map(w=>{const es=state.expenses.filter(e=>e.work===w&&!e.archived);return `<div class="row"><div class="iconbox">${icon('work')}</div><div class="row-body"><a class="row-title" href="#/lavoro/${encodeURIComponent(w)}">${esc(w)}</a><span class="small muted">${es.length} spese collegate</span></div><strong>${money(es.reduce((s,e)=>s+e.amount,0))}</strong></div>`}).join('')}</section>`}
function workDetail(w){const es=state.expenses.filter(e=>e.work===w&&!e.archived);return title(esc(w),'Un totale unico del lavoro, anche quando riguarda più oggetti.','#/lavori')+`<section class="card"><div class="muted">Costi registrati per il lavoro</div><div class="metric">${money(es.reduce((s,e)=>s+e.amount,0))}</div><a class="btn primary" href="#/manuale?work=${encodeURIComponent(w)}">${icon('plus')} Aggiungi spesa al lavoro</a>${rows(es)}<p class="help">Ogni oggetto mostra solo i propri costi. Il totale del lavoro non viene ripartito automaticamente.</p></section>`}
function home(){return title('Ogni costo, al suo posto.','Questa è la Casa dimostrativa per la prova di S1.')+`<section class="card tint"><div class="eyebrow">ECONOMIA DELLA CASA</div><h2 style="margin-top:12px">Quanto hai registrato, e per cosa.</h2><div class="metric">${money(state.expenses.filter(e=>!e.archived&&e.day.startsWith('2026')).reduce((s,e)=>s+e.amount,0))}</div><a class="btn primary" href="#/storico">Apri le spese</a><p class="help">Totale dei costi registrati. Finanziamento incluso e distinto nel dettaglio.</p></section><div class="route-cards"><a href="#/oggetti">${icon('oggetti')}<h2>Oggetti della casa</h2><p>Guarda acquisto e manutenzioni della lavatrice.</p></a><a href="#/lavori">${icon('work')}<h2>Lavori</h2><p>Quanto è costato il rifacimento del bagno?</p></a></div>`+guide()}
function parseAmount(raw){const s=raw.trim();if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(s))throw Error('Inserisci un importo valido, per esempio 85,00 o 1.234,56.');const [w,f='']=s.replaceAll('.','').split(',');const n=BigInt(w)*100n+BigInt(f.padEnd(2,'0')||0);if(n<1n||n>999999999n)throw Error('L’importo deve essere positivo e non superare 9.999.999,99 €.');return Number(n)}
function bind(){document.getElementById('filters')?.addEventListener('submit',e=>{e.preventDefault();state.filter=Object.fromEntries(new FormData(e.target));save();render();toast('Filtri applicati a elenco e totale.')});document.getElementById('clear-filters')?.addEventListener('click',()=>{state.filter=seed().filter;save();render()});document.querySelectorAll('[data-analyze]').forEach(b=>b.onclick=()=>{state.drafts[b.dataset.analyze]={};save();location.hash='/bozza/'+b.dataset.analyze});document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{state.drafts[b.dataset.reopen]={};save();render()});document.querySelectorAll('[data-abandon]').forEach(b=>b.onclick=()=>{state.drafts[b.dataset.abandon].abandoned=true;save();location.hash='/storico';toast('Bozza accantonata. Documento conservato.')});document.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{const exp=state.expenses.find(e=>e.id===b.dataset.expense);exp.document='Bolletta gas.pdf';state.drafts[b.dataset.link].expenseId=exp.id;save();location.hash='/spesa/'+exp.id;toast('Documento collegato. Il totale non è cambiato.')});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{const e=state.expenses.find(e=>e.id===b.dataset.archive);e.archived=!e.archived;save();render();toast(e.archived?'Spesa archiviata nella prova.':'Spesa ripristinata.')});document.getElementById('new-work')?.addEventListener('submit',e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(name&&!state.works.includes(name)){state.works.push(name);save()}location.hash='/lavoro/'+encodeURIComponent(name)});document.querySelectorAll('[name=amount-choice]').forEach(r=>r.onchange=()=>{const i=document.querySelector('[name=amount]');i.value=r.value==='manual'?'':r.value;i.readOnly=r.value!=='manual';if(r.value==='manual')i.focus()});const form=document.getElementById('expense-form')||document.getElementById('draft-form');form?.addEventListener('submit',e=>{e.preventDefault();try{const v=Object.fromEntries(new FormData(form)),amount=parseAmount(v.amount);if(v.day>'2026-10-14')throw Error('Scegli una data di riferimento non futura.');if((v.from&&!v.to)||(!v.from&&v.to)||(v.from>v.to))throw Error('Indica entrambi gli estremi della competenza, in ordine.');const draftId=form.dataset.draft;const exp={...v,amount,id:'demo-'+crypto.randomUUID(),source:draftId&&v['amount-choice']!=='manual'?'Estratto e confermato':'Inserito da te',document:draftId?(draftId==='gas'?'Bolletta gas.pdf':'Fattura idraulico.pdf'):(new URLSearchParams(location.hash.split('?')[1]||'').get('document')||''),demoNew:true};state.expenses.push(exp);if(draftId)state.drafts[draftId].expenseId=exp.id;save();location.hash='/spesa/'+exp.id;toast('Spesa registrata solo nel mockup.')}catch(err){document.getElementById('form-error').innerHTML=`<div class="error">${esc(err.message)}</div>`;document.getElementById('form-error').scrollIntoView({block:'center'})}})}
function render(){const route=(location.hash||'#/storico').slice(2),[p,paramRaw]=route.split('/'),param=decodeURIComponent(paramRaw||''),base=p.split('?')[0];const nav=base==='casa'?'casa':['oggetto','oggetti'].includes(base)?'oggetti':base==='documenti'||base==='analisi'?'documenti':'storico';document.querySelectorAll('[data-nav]').forEach(a=>{const id=a.dataset.nav;a.innerHTML=icon(id)+({casa:'Casa',oggetti:'Oggetti',documenti:'Documenti',storico:'Spese'}[id]);a.classList.toggle('active',id===nav);if(id===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const content=base==='storico'?history():base==='aggiungi'?add():base==='manuale'?manual(route.split('?')[1]):base==='documenti'?docs():base==='analisi'?analysis(param):base==='bozza'?draft(param):base==='spesa'?detail(param):base==='oggetti'?objectList():base==='oggetto'?objectDetail(param):base==='lavori'?works():base==='lavoro'?workDetail(param):home();document.getElementById('main').innerHTML=content;bind();document.querySelector('h1')?.focus({preventScroll:true});window.scrollTo(0,0)}
document.getElementById('reset').onclick=()=>{if(confirm('Ripristinare soltanto i dati di questo mockup? I dati dell’app reale non vengono toccati.')){state=seed();state.expenses.push(...previous);save();if(location.hash==='#/storico')render();else location.hash='/storico';toast('Prova ripristinata.')}};window.addEventListener('hashchange',render);render();
</script></body></html>
