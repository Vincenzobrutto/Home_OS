<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documenti e oggetti · Proposta Dimora</title>
<style>
:root{--bg:#f5f6fc;--surface:#fff;--ink:#202341;--muted:#636780;--accent:#4f46d9;--soft:#eeedff;--line:#e4e5ef;--ok:#236647;--warning:#855712}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.55 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;background:white;padding:10px 16px;min-height:44px;font-weight:600}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.text{color:var(--accent);background:transparent;border-color:transparent}a{color:var(--accent)}:focus-visible{outline:3px solid #9b95f5;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.2;letter-spacing:-1px}h2{font-size:21px;line-height:1.3}h3{font-size:16px}.muted,small{color:var(--muted)}small,.small{font-size:13px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.8px;font-weight:700;color:var(--muted)}header{background:white;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:26px;font-weight:750;letter-spacing:-1.2px}.brand span{color:var(--accent)}.prototype{padding:10px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#eeedff}.prototype label{font-size:13px;font-weight:650}.prototype select{max-width:100%;padding:7px 12px;border:1px solid #d3d0f7;border-radius:8px;background:white}.prototype button{margin-left:auto;background:transparent;font-size:12px;min-height:36px;padding:4px 9px}.shell{display:grid;grid-template-columns:185px minmax(0,1fr);min-height:calc(100vh - 142px)}aside{padding:30px 20px;border-right:1px solid var(--line)}aside p{margin:9px 0;padding:11px 15px;color:var(--muted)}aside .active{background:#e8e6fb;color:var(--accent);border-radius:12px;font-weight:650}main{max-width:1120px;width:100%;padding:36px 38px 150px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0 26px}.heading p{margin-top:10px;color:var(--muted)}.surface{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.dochead{display:flex;align-items:center;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}.grow{flex:1;min-width:140px}.tag{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:650}.tag.good{background:#eaf5ee;color:var(--ok)}.tag.warn{background:#fff1d8;color:var(--warning)}.tag.neutral{background:#eef0f5;color:#606579}.dochead .tag{margin-right:6px}.dochead p{margin-top:5px}.progress{margin:16px 0 24px;color:var(--muted);font-size:14px}.row{padding:22px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}.row .select{display:flex;align-items:center;min-width:28px;min-height:44px}.row h3{margin-bottom:4px}.row p{font-size:13px;color:var(--muted);margin:3px 0}.row .amount{font-weight:700;white-space:nowrap}.row .statusline{margin-top:7px}.sectionlabel{margin:28px 0 12px}.notice{padding:15px 18px;border-radius:12px;background:var(--soft);font-size:14px;color:#46406c;margin:18px 0}.notice.warn{background:#fff4de;color:#765019}.notice.success{background:#eaf5ee;color:var(--ok)}.drop{padding:50px 24px;text-align:center;background:white;border:2px dashed #d1ceed;border-radius:22px;margin:22px 0}.drop p{margin:12px auto 24px;max-width:520px;color:var(--muted)}.files{max-width:490px;margin:24px auto;text-align:left}.files p{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.toolbar button[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:#d1ceed}.bulkbar{position:fixed;bottom:0;left:185px;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:16px 38px;display:flex;align-items:center;gap:18px;z-index:3}.bulkbar .grow p{font-size:13px;color:var(--muted)}dialog{border:0;border-radius:22px;width:min(650px,calc(100% - 32px));max-height:90dvh;padding:0;color:var(--ink);box-shadow:0 20px 90px #20234133}body:has(dialog[open]){overflow:hidden}dialog::backdrop{background:#20234170}dialog[open]{display:flex;flex-direction:column}dialog .head{display:flex;padding:22px 26px;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}dialog .body{padding:22px 26px;overflow:auto;min-height:0}dialog .foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff;flex-wrap:wrap}dialog .foot .primary{margin-left:auto}.field{display:block;margin:16px 0;font-weight:600}.field input,.field select{display:block;width:100%;margin-top:6px;border:1px solid #c9cbdc;border-radius:9px;padding:11px 12px;font-weight:400;min-height:46px;background:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.choices{border:0;padding:0;margin:0 0 22px}.choices legend{font-size:13px;font-weight:700;margin-bottom:9px}.choice{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin:8px 0;font-weight:500}.choice:has(input:checked){border-color:var(--accent);background:#f5f4ff}.choice input{margin-top:5px;accent-color:var(--accent)}details{border-top:1px solid var(--line);padding:15px 0;margin-top:12px}summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:36px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.compare>div{padding:14px;background:#f4f5f9;border-radius:10px}.compare>div:first-child{border-left:4px solid var(--ink)}.compare strong{display:block;margin-top:8px}.checks{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.checks input{margin-top:6px}.error{color:#a3232c;background:#fff0f0;border-radius:8px;padding:12px;margin-top:14px}.preview{background:#f7f7fb;padding:22px;border:1px solid var(--line);border-radius:12px}.preview h3{margin-bottom:14px}.preview p{margin:10px 0}.empty{padding:32px 24px;text-align:center;color:var(--muted)}.archive{margin-top:28px}.archive h2{margin-bottom:16px}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}.wide{width:100%}button.info{min-height:30px;width:30px;border-radius:50%;padding:0;font:italic 600 16px Georgia,serif;margin-left:5px}.infoText{color:var(--muted);font-weight:400;font-size:13px;padding:9px 0}.subtitle{margin:8px 0 16px;color:var(--muted)}.help{margin:22px 0;font-size:13px;color:var(--muted)}.badgegroup{display:flex;gap:8px;flex-wrap:wrap}.trail{font-size:13px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:720px){header{padding:12px 18px}.prototype{padding:10px 16px;gap:7px}.prototype select{width:100%}.prototype button{margin-left:0}.shell{display:block}aside{display:none}main{padding:24px 16px 170px}h1{font-size:28px}.heading{align-items:flex-start}.heading>button{font-size:12px;padding:8px;max-width:120px}.dochead{padding:18px;gap:10px}.row{padding:18px;gap:11px;flex-wrap:wrap}.row .grow{flex-basis:calc(100% - 45px)}.row>button{margin-left:39px}.row .amount{margin-left:39px}.bulkbar{left:0;padding:12px 16px;gap:10px;flex-wrap:wrap}.bulkbar .primary{width:100%;order:2}.bulkbar>.text{font-size:12px;padding:6px}.bulkbar .grow{min-width:190px}dialog{width:100%;max-width:none;height:100dvh;max-height:none;margin:0;border-radius:0}dialog .head{padding:17px 18px}dialog .body{padding:18px;flex:1}dialog .foot{padding:12px 18px}dialog .foot .primary{width:100%;order:-1;margin:0}.fields{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.drop{padding:28px 18px}}
@media(max-width:720px){.bulkbar .grow p,.bulkbar>.text,.bulkbar .primary:disabled{display:none}.bulkbar .grow{min-width:0}.bulkbar{gap:8px}}
</style></head><body>
<header><div class="brand">dimora<span>.</span></div><span class="small muted">Casa esempio · Solo io</span></header>
<section class="prototype" aria-label="Comandi del prototipo"><label for="scenario">Prova un caso</label><select id="scenario"></select><span class="small">Mockup · dati inventati · nessuna analisi AI</span><button id="reset">Ricomincia il caso</button></section>
<div class="shell"><aside aria-label="Contesto della navigazione"><div class="eyebrow">La tua casa</div><p>Casa</p><p>Attività</p><p class="active">Documenti</p><p>Spese</p></aside><main id="main" tabindex="-1"></main></div><div id="bar"></div><dialog id="editor" aria-labelledby="editor-title"></dialog><div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const labels={amazon:'Ordine Amazon · 3 articoli',acquisto:'Fattura · oggetto e spesa',esistente:'Oggetto già in casa',doppione:'Spesa già registrata',conflitto:'Dati in conflitto',ape:'APE · documento della casa',copia:'Copia di un documento già presente',scansione:'Scansione senza testo',multiplo:'Più documenti diversi',totale:'Ordine misto · solo totale',etichetta:'Foto etichetta'};
const kinds={ordine:['Consegna / ordine','Acquisti e garanzie'],fattura:['Fattura','Acquisti e garanzie'],ape:['APE','Energia'],scia:['SCIA','Pratiche edilizie'],regolamento:['Regolamento condominiale','Condominio'],etichetta:['Etichetta prodotto','Acquisti e garanzie'],altro:['Altro documento','Da organizzare']};
const item=(id,name,brand='',model='',extra={})=>({id,name,brand,model,type:'Altro oggetto',action:'create',expense:'none',status:'pending',selected:false,...extra});
const doc=(id,title,kind,items=[],extra={})=>({id,title,kind,items,status:'pending',...extra});
function seed(key){const router=item('router','Router Strong 4G LTE','Strong','',{type:'Elettronica'}),cable=item('cavo','Cavo prolunga SMA RG174','Superbat','',{accessory:true}),cleaner=item('pulitori','Set di pulitori HOMYBABY','HOMYBABY','',{accessory:true});const ice=item('ghiaccio','Macchina del ghiaccio','','',{amount:99.99,date:'2025-06-13',expense:'new',type:'Elettrodomestico'});switch(key){case'amazon':return[doc('ordine','Consegna Amazon — tre articoli','ordine',[router,cable,cleaner])];case'acquisto':return[doc('fattura','Fattura macchina del ghiaccio','fattura',[ice])];case'esistente':return[doc('ordine','Ordine router Strong','ordine',[{...router,action:'',candidate:'Router Strong — Studio'}])];case'doppione':return[doc('fattura','Ricevuta macchina del ghiaccio','fattura',[{...ice,action:'link',candidate:'Macchina del ghiaccio — Cucina',duplicate:true,expense:''}])];case'conflitto':return[doc('ordine','Ricevuta macchina del caffè','fattura',[item('caffe','Macchina del caffè','Aurora','Classica 30',{action:'link',candidate:'Macchina del caffè — Cucina',conflict:true,proposedModel:'Classica 40',resolution:'keep',amount:179.90,date:'2026-09-15',duplicate:true,expense:'existing'})])];case'copia':return[doc('ape','APE appartamento — settembre 2026','ape',[],{copy:true})];case'ape':return[doc('ape','APE appartamento — settembre 2026','ape')];case'scansione':return[doc('scansione','Scansione documento.pdf','altro',[],{unreadable:true})];case'multiplo':return[doc('ape','APE appartamento','ape'),doc('scia','Pratica SCIA — lavori cucina','scia'),doc('regolamento','Regolamento condominiale','regolamento'),doc('fattura','Fattura macchina del ghiaccio','fattura',[ice]),doc('scansione','Scansione senza testo.pdf','altro',[],{unreadable:true})];case'totale':return[doc('ordine','Ordine misto — totale 129,90 €','fattura',[{...router,totalOnly:true},{...cleaner,totalOnly:true}],{total:129.90})];case'etichetta':return[doc('etichetta','Etichetta Moulinex AL4018F0','etichetta',[item('moulinex','Elettrodomestico Moulinex','Moulinex','',{reference:'AL4018F0',type:'Elettrodomestico',label:true})])];}}
let key=new URLSearchParams(location.search).get('caso')||'amazon';if(!labels[key])key='amazon';let docs=[],stage='carica',filter='pending',toast='',toastError=false,active=null;const storageKey='dimora-mockup-onboarding-v3';
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved?.key===key&&saved.version===1){docs=saved.docs;stage=saved.stage;}}catch{}if(!docs.length)docs=seed(key);
$('#scenario').innerHTML=Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('#scenario').value=key;
function save(){try{localStorage.setItem(storageKey,JSON.stringify({version:1,key,docs,stage}));}catch{} }
function objectChoices(current){const created=docs.flatMap(d=>d.items.filter(i=>i!==current&&i.status==='confirmed'&&i.action==='create').map(i=>({id:'new:'+d.id+':'+i.id,name:i.name})));const names=new Set(created.map(o=>o.name));for(const i of docs.flatMap(d=>d.items)){if(i.candidate&&!names.has(i.candidate)){created.push({id:'existing:'+i.candidate,name:i.candidate});names.add(i.candidate);}}return created;}
function targetFor(i){return objectChoices(i).find(o=>o.id===i.targetId||(!i.targetId&&o.name===i.candidate));}
function allocationError(i){if(i.action==='exclude'||!i.totalOnly||i.expense!=='new')return '';const d=docs.find(d=>d.items.includes(i));if(!/^\d+(?:\.\d{1,2})?$/.test(String(i.manualAmount||''))||!(Number(i.manualAmount)>0))return 'Indica il costo del singolo articolo, con massimo due decimali.';if(!i.date)return 'Indica la data di acquisto.';const already=d.items.filter(x=>x!==i&&x.status==='confirmed'&&x.expense==='new').reduce((n,x)=>n+Math.round(Number(x.manualAmount||0)*100),0);if(already+Math.round(Number(i.manualAmount)*100)>Math.round(d.total*100))return 'La somma dei costi attribuiti supera il totale ordine.';return '';}
const needsReview=i=>i.action==='exclude'?false:!i.action||(i.action==='link'&&!targetFor(i))||(i.duplicate&&!i.expense)||(i.conflict&&i.resolution==='replace'&&!i.consent)||!i.name.trim()||Boolean(allocationError(i));
const done=d=>d.status==='confirmed'&&d.items.every(i=>i.status==='confirmed'||i.status==='excluded');
const collection=d=>kinds[d.kind][1];
function announce(msg,error=false){toast=msg;toastError=error;$('#live').textContent=msg;}
function totals(){const all=docs.flatMap(d=>d.items),confirmed=all.filter(i=>i.status==='confirmed');return{pending:all.filter(i=>i.status==='pending').length,later:all.filter(i=>i.status==='later').length,excluded:all.filter(i=>i.status==='excluded').length,objects:confirmed.filter(i=>i.action==='create').length,linked:confirmed.filter(i=>i.action==='link').length,expenses:confirmed.filter(i=>i.expense==='new').length,amount:confirmed.filter(i=>i.expense==='new').reduce((n,i)=>n+(i.totalOnly?Number(i.manualAmount||0):i.amount||0),0)};}
function row(d,i){const ready=!needsReview(i),finished=i.status==='confirmed'||i.status==='excluded';return`<div class="row"><label class="select">${!finished?`<input type="checkbox" data-select-item="${i.id}" ${i.selected?'checked':''} ${!ready?'disabled':''} aria-label="Seleziona ${esc(i.name)}">`:''}</label><div class="grow"><h3>${esc(i.name)}</h3><p>${esc([i.brand,i.model].filter(Boolean).join(' · ')||'Dettagli da completare, se disponibili')}</p><div class="statusline"><span class="tag ${finished?'good':ready?'':'warn'}">${i.status==='excluded'?'Escluso dalla casa':i.status==='confirmed'?(i.action==='link'?'Collegato alla scheda esistente':'Scheda creata'):i.status==='later'?'Più tardi':!ready?'Scelta necessaria':'Proposta pronta'}</span></div><p>${i.status==='excluded'?'Nessun oggetto e nessuna spesa':i.action==='link'&&targetFor(i)?'Collegamento a '+esc(targetFor(i).name):i.candidate?'Scheda già presente: '+esc(i.candidate):''}</p><p>${i.expense==='existing'?'Mantiene la spesa esistente: nessun nuovo costo':i.totalOnly&&i.expense!=='new'?'Totale complessivo non attribuito':i.expense==='new'?(i.status==='confirmed'?'Spesa registrata · ':'Nuova spesa proposta · ')+esc(i.date||''):i.duplicate&&!i.expense?'Spesa già presente: scelta necessaria':i.amount?'Nessuna nuova spesa: scelta da te':'Nessuna spesa: prezzo non presente'}</p></div>${i.status!=='excluded'&&(i.expense==='new'||i.expense==='existing')?`<span class="amount">${euro(i.totalOnly?Number(i.manualAmount||0):i.amount)}</span>`:''}${!finished?`<button data-edit="${d.id}:${i.id}">${i.status==='later'?'Riprendi':'Rivedi'}</button>`:''}</div>`;}
function docView(d){const complete=done(d);return`<section class="surface" aria-label="${esc(d.title)}"><div class="dochead">${!d.items.length&&d.status!=='confirmed'?`<label class="select"><input type="checkbox" data-select-doc="${d.id}" aria-label="Seleziona ${esc(d.title)}" ${d.selected?'checked':''} ${d.unreadable||d.copy?'disabled':''}></label>`:''}<div class="grow"><h2>${esc(d.title)}</h2><p class="small muted">${esc(kinds[d.kind][0])} · ${esc(collection(d))} · Solo io</p><p class="small"><span class="tag ${d.status==='confirmed'?'good':d.unreadable?'warn':''}">${d.status==='confirmed'?'Documento archiviato':d.status==='later'?'Più tardi':d.copy?'File già presente':d.unreadable?'Tipo da indicare':'Archiviazione proposta'}</span>${d.items.length?`<span class="small muted">${d.items.filter(i=>i.status==='pending').length} articoli da confermare${d.items.some(i=>i.status==='later')?' · '+d.items.filter(i=>i.status==='later').length+' da riprendere':''}</span>`:''}</p></div><button class="text" data-doc="${d.id}">${d.status==='confirmed'?'Modifica documento':d.unreadable?'Indica il tipo':'Rivedi documento'}</button></div>${d.total?`<p class="notice warn" style="margin:16px 24px">Totale ordine ${euro(d.total)}. Non viene attribuito ai singoli articoli, né incluso automaticamente nelle spese.</p>`:''}${d.items.map(i=>row(d,i)).join('')}${!d.items.length?`<div class="row"><p class="muted grow">${complete?'Conservato nell’archivio della casa. Nessun oggetto o costo creato.':d.unreadable?'Apri l’originale e indica il tipo. Puoi completarlo senza AI.':'Riguarda la casa: nessun oggetto o costo da creare.'}</p></div>`:''}</section>`;}
function render(){save();$('#scenario').value=key;const t=totals();if(stage==='carica'){$('#main').innerHTML=`<p class="eyebrow">Documenti · Casa esempio</p><div class="heading"><div><h1>La tua casa prende forma.</h1><p>Parti da un documento. Ti aiutiamo a metterlo al posto giusto.</p></div></div><section class="drop"><h2>Carica uno o più documenti</h2><p>Foto, ordini, fatture e documenti della casa: un unico percorso, con proposte da controllare.</p><div class="files">${docs.map(d=>`<p>${esc(d.title)} <small>· esempio</small></p>`).join('')}</div><button class="primary" data-upload>Carica l’esempio${docs.length>1?' con '+docs.length+' documenti':''}</button><p class="small">Questa prova usa solo esempi già preparati. Nessun file personale viene caricato.</p></section>`;$('#bar').innerHTML='';return;}
const pendingDocs=docs.filter(d=>!done(d)),selected=docs.filter(d=>d.selected).length+docs.flatMap(d=>d.items).filter(i=>i.selected).length;
$('#main').innerHTML=`<p class="trail">Documenti / Controlla le proposte</p><div class="heading"><div><h1>${pendingDocs.length?'Controlla le proposte.':'La casa è più completa.'}</h1><p>${pendingDocs.length?'Controlla le proposte e conferma ciò che vuoi aggiungere.':'Oggetti, documenti e costi restano collegati.'}</p></div><button class="text" data-original>Vedi l’originale</button></div><p class="progress">${docs.filter(d=>d.status==='confirmed').length} di ${docs.length} documenti archiviati${docs.some(d=>d.items.length)?` · ${t.pending} articoli da confermare${t.later?' · '+t.later+' da riprendere':''} · ${t.excluded} ${t.excluded===1?'escluso':'esclusi'}`:''}</p>${toast?`<p class="notice ${toastError?'warn':'success'}" role="${toastError?'alert':'status'}">${esc(toast)}</p>`:''}<div class="toolbar" aria-label="Mostra documenti"><button data-filter="pending" aria-pressed="${filter==='pending'}">Da completare</button><button data-filter="all" aria-pressed="${filter==='all'}">Tutti</button><button data-filter="archive" aria-pressed="${filter==='archive'}">Archivio</button></div>${docs.filter(d=>filter==='all'||filter==='archive'?filter==='all'||d.status==='confirmed':!done(d)).map(docView).join('')||'<div class="surface empty">Non ci sono altre proposte da completare. Ritrovi tutto in Archivio.</div>'}${!pendingDocs.length||filter==='archive'?`<section class="archive"><h2>Il risultato nella casa</h2><div class="badgegroup"><span class="tag good">${t.objects} ${t.objects===1?'nuovo oggetto':'nuovi oggetti'}</span><span class="tag good">${t.linked} ${t.linked===1?'collegamento a oggetto esistente':'collegamenti a oggetti esistenti'}</span><span class="tag good">${t.expenses} ${t.expenses===1?'nuova spesa':'nuove spese'} · ${euro(t.amount)}</span><span class="tag neutral">${t.excluded} ${t.excluded===1?'articolo escluso':'articoli esclusi'}</span></div><p class="help">Ogni originale è conservato una sola volta. Gli articoli esclusi non aggiungono costi.</p></section>`:''}<p class="help">Le scelte confermate e i rinvii si ritrovano anche ricaricando questa anteprima.</p>`;
$('#bar').innerHTML=pendingDocs.length?`<div class="bulkbar"><div class="grow"><strong>${selected?selected+' proposte selezionate':'Seleziona le proposte pronte'}</strong><p>${selected?'Documenti, oggetti e costi indicati si confermano insieme.':'Puoi anche rivedere e confermare un articolo alla volta.'}</p></div><button class="text" data-filter="archive">Vedi archivio</button><button class="primary" data-bulk ${selected?'':'disabled'}>Conferma ${selected||''} ${selected===1?'proposta':'proposte'}</button></div>`:'';}
function modal(title,body,foot){const el=$('#editor');el.innerHTML=`<div class="head"><h2 id="editor-title">${title}</h2><button data-close>Chiudi</button></div><div class="body">${body}<div id="error" role="alert" hidden></div></div><div class="foot">${foot}</div>`;if(!el.open)el.showModal();}
const field=(name,label,value='',type='text',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
function choices(name,values,current){return`<fieldset class="choices"><legend>${name==='action'?'Cosa vuoi fare?':name==='expense'?'Come gestire il costo?':'Quale valore usare?'}</legend>${values.map(([v,label])=>`<label class="choice"><input type="radio" name="${name}" value="${v}" ${current===v?'checked':''}><span>${label}</span></label>`).join('')}</fieldset>`;}
function editItem(d,i){active={kind:'item',d,i};const exclude=i.action==='exclude',canCost=Boolean(i.amount||i.totalOnly);modal('Rivedi l’articolo',`<p class="subtitle">${esc(d.title)} · Solo io</p>${i.candidate?`<p class="notice">Scheda già in casa: <strong>${esc(i.candidate)}</strong></p>`:''}${choices('action',[['create','Crea una nuova scheda'],['link','Collega a un oggetto già in casa'],['exclude','Non riguarda questa casa']],i.action)}<div id="item-fields" ${exclude?'hidden':''}>${i.action==='link'?`<label class="field">Oggetto a cui collegare<select name="target"><option value="">Scegli la scheda</option>${objectChoices(i).map(o=>`<option value="${esc(o.id)}" ${targetFor(i)?.id===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></label>${!objectChoices(i).length?'<p class="notice warn">Non ci sono schede esistenti in questo esempio. Puoi prima confermare un altro articolo come nuovo oggetto.</p>':''}`:''}${field('name','Nome dell’oggetto',i.name)}<div class="fields">${field('brand','Marca',i.brand)}${field('model','Modello',i.model,'text',i.conflict?'readonly':'')}</div>${!i.model?'<p class="small muted">Modello preciso non leggibile: puoi lasciarlo vuoto.</p>':''}${i.conflict?`<h3 class="sectionlabel">Il modello non coincide</h3><div class="compare"><div><span class="tag neutral">ATTUALE · CONFERMATO DA TE</span><strong>Classica 30</strong></div><div><span class="tag">DAL DOCUMENTO</span><strong>Classica 40</strong></div></div>${choices('resolution',[['keep','Mantieni il valore attuale'],['replace','Usa il valore del documento'],['later','Decidi più avanti: conserva quello attuale']],i.resolution)}<label class="checks" id="consent" ${i.resolution==='replace'?'':'hidden'}><input type="checkbox" name="consent" ${i.consent?'checked':''}>Autorizzo la sostituzione del modello già confermato.</label>`:''}${canCost?`<h3 class="sectionlabel">Spesa collegata</h3>${i.totalOnly?`<p class="notice warn">Solo il totale ordine (${euro(d.total)}) è disponibile. Indica soltanto il prezzo di questo articolo se lo conosci.</p>${choices('expense',[['none','Non registrare il costo adesso'],['new','Indica il costo di questo articolo']],i.expense)}${i.expense==='new'?field('manualAmount','Importo del solo articolo (€)',i.manualAmount||'','number','min="0.01" step="0.01"')+field('date','Data di acquisto',i.date||'','date'):''}`:i.duplicate?`<p class="notice warn">${euro(i.amount)} · ${esc(i.date)}<br>Una spesa è già collegata alla stessa ricevuta.</p>${choices('expense',[['existing','Mantieni e collega la spesa già registrata'],['none','Non collegare una spesa']],i.expense)}`:`<p class="notice"><strong>${euro(i.amount)}</strong> · ${esc(i.date)}<br>Nuova spesa proposta. Nessuna corrispondenza trovata nell’esempio.</p><label class="checks"><input type="checkbox" name="newExpense" ${i.expense==='new'?'checked':''}>Registra anche questa spesa</label>`}`:'<p class="notice">Nessuna spesa proposta: il documento non indica un prezzo.</p>'}<details><summary>Altri dati e garanzia</summary>${field('reference','Codice prodotto (facoltativo)',i.reference||'')}${field('date','Data di acquisto',i.date||'','date')}${field('warranty','Scadenza garanzia proposta',i.warranty||(i.date?(Number(i.date.slice(0,4))+2)+i.date.slice(4):''),'date')}<p class="small muted">Quando è disponibile una data di acquisto, la proposta è di 24 mesi. Puoi correggerla.</p></details><details><summary>Manuale e dati del produttore</summary><p class="small muted">${i.label?'Codice letto sull’etichetta: '+esc(i.reference)+'. La tipologia precisa resta da verificare.':'Il collegamento al manuale potrà essere proposto quando il modello sarà identificato con precisione.'} In questa anteprima non effettuiamo ricerche online.</p></details></div><p id="excluded-note" class="notice" ${exclude?'':'hidden'}>L’originale resta nei Documenti. Questo articolo non crea né una scheda né una spesa.</p>`,`<button class="text" data-later>Decidi più avanti</button><button class="primary" data-confirm-item>${exclude?'Conferma esclusione':canCost&&i.expense==='new'?'Conferma oggetto e spesa':'Conferma articolo e documento'}</button>`);}
function editDoc(d){active={kind:'doc',d};if(d.copy&&d.status!=='confirmed'){editCopy(d);return;}modal(d.status==='confirmed'?'Modifica documento':'Rivedi il documento',`${field('title','Titolo',d.title)}<label class="field">Tipo di documento<select name="kind">${Object.entries(kinds).map(([k,[label]])=>`<option value="${k}" ${k===d.kind?'selected':''}>${label}</option>`).join('')}</select></label><p>Destinazione: <strong id="destination">${esc(collection(d))}</strong> · Solo io</p>${d.unreadable?'<p class="notice warn">Il testo non è leggibile. Titolo e tipo sono indicati da te.</p>':''}${d.status==='confirmed'?'<label class="checks"><input name="replaceDoc" type="checkbox">Confermo la modifica dei dati attuali del documento.</label>':''}<details><summary>Vedi l’originale</summary>${originalMarkup(d)}</details>`,`<button class="text" data-later>Decidi più avanti</button><button class="primary" data-confirm-doc>Conferma e organizza</button>`);}
function editCopy(d){modal('Questo file è già in archivio',`<p class="notice">Usiamo lo stesso originale: non creeremo una seconda copia.</p>${choices('copyAction',[['keep','Mantieni titolo e tipo attuali'],['update','Aggiorna titolo o tipo']],d.copyAction||'')}<p class="small muted">Attuale: ${esc(d.title)} · ${esc(collection(d))} · Solo io</p>${d.copyAction==='update'?field('title','Titolo',d.title)+`<label class="field">Tipo<select name="kind">${Object.entries(kinds).map(([k,[label]])=>`<option value="${k}" ${k===d.kind?'selected':''}>${label}</option>`).join('')}</select></label><label class="checks"><input type="checkbox" name="replaceDoc">Confermo la sostituzione dei dati attuali.</label>`:''}`,`<button class="text" data-later>Decidi più avanti</button><button class="primary" data-confirm-copy>Conferma documento</button>`);}
function originalMarkup(d){return`<div class="preview"><h3>${esc(d.title)}</h3><p>${d.kind==='ordine'?'Il pacco è in consegna.':d.kind==='fattura'?'Riepilogo acquisto · esempio inventato':d.kind==='ape'?'ATTESTATO DI PRESTAZIONE ENERGETICA':'Anteprima del documento di esempio'}</p>${d.items.map(i=>`<p>${esc(i.name)}${i.amount?' · '+euro(i.amount):''}</p>`).join('')}<p class="small muted">Ricostruzione testuale sintetica; non è il documento reale.</p></div>`;}
function fail(msg){const el=$('#error');el.hidden=false;el.className='error';el.textContent=msg;el.tabIndex=-1;el.focus();}
function completeItem(d,i){if(needsReview(i))return false;if(i.totalOnly&&i.expense==='new'){const already=d.items.filter(x=>x!==i&&x.status==='confirmed'&&x.expense==='new').reduce((n,x)=>n+Number(x.manualAmount||0),0);if(Math.round(already*100)+Math.round(Number(i.manualAmount)*100)>Math.round(d.total*100))return false;}if(i.conflict&&i.resolution==='replace')i.model=i.proposedModel;if(i.action==='link')i.candidate=targetFor(i).name;if(i.action==='exclude'){i.expense='none';i.amount=null;}i.status=i.action==='exclude'?'excluded':'confirmed';i.selected=false;d.status='confirmed';return true;}
function close(){if($('#editor').open)$('#editor').close();active=null;}
function captureFields(){if(!active||active.kind!=='item')return;const i=active.i;for(const name of ['name','brand','model','reference','date','warranty','manualAmount']){const el=$('#editor').querySelector(`[name="${name}"]`);if(el)i[name]=el.value;}const target=$('#editor').querySelector('[name="target"]');if(target)i.targetId=target.value;const c=$('#editor').querySelector('[name="consent"]');if(c)i.consent=c.checked;}
document.addEventListener('input',e=>{if(e.target.closest('#editor'))captureFields();});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='scenario'){key=el.value;docs=seed(key);stage='carica';toast='';filter='pending';history.replaceState(null,'','?caso='+key+'#/carica');render();return;}if(el.dataset.selectItem){docs.flatMap(d=>d.items).find(i=>i.id===el.dataset.selectItem).selected=el.checked;render();}if(el.dataset.selectDoc){docs.find(d=>d.id===el.dataset.selectDoc).selected=el.checked;render();}if(el.closest('#editor')&&active){if(el.name==='copyAction'){active.d.copyAction=el.value;editCopy(active.d);return;}if(el.name==='kind'&&$('#destination'))$('#destination').textContent=kinds[el.value][1];if(active.kind==='item'){captureFields();if(['action','expense','resolution'].includes(el.name)){active.i[el.name]=el.value;editItem(active.d,active.i);}if(el.name==='newExpense'){active.i.expense=el.checked?'new':'none';$('#editor').querySelector('[data-confirm-item]').textContent=el.checked?'Conferma oggetto e spesa':'Conferma articolo e documento';}}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='reset'){close();docs=seed(key);stage='carica';toast='';filter='pending';history.replaceState(null,'','?caso='+key+'#/carica');render();return;}if(b.hasAttribute('data-upload')){stage='review';history.replaceState(null,'','?caso='+key+'#/proposte');render();return;}if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.edit){const [did,iid]=b.dataset.edit.split(':');const d=docs.find(d=>d.id===did);editItem(d,d.items.find(i=>i.id===iid));return;}if(b.dataset.doc){editDoc(docs.find(d=>d.id===b.dataset.doc));return;}if(b.hasAttribute('data-original')){active={kind:'original'};modal('Documento originale',docs.map(originalMarkup).join(''),'<button data-close>Chiudi originale</button>');return;}if(b.hasAttribute('data-close')){captureFields();close();render();return;}if(b.hasAttribute('data-later')){if(active.kind==='item'){captureFields();active.i.status='later';active.i.selected=false;}else {active.d.status='later';active.d.selected=false;}announce('Rimandato: lo ritrovi in Da completare.');close();render();return;}if(b.hasAttribute('data-confirm-copy')){const d=active.d;if(!d.copyAction)return fail('Scegli se mantenere o aggiornare il documento.');if(d.copyAction==='update'){if(!$('#editor').querySelector('[name="replaceDoc"]').checked)return fail('Conferma la sostituzione dei dati attuali.');const title=$('#editor').querySelector('[name="title"]').value.trim();if(!title)return fail('Inserisci un titolo.');d.title=title;d.kind=$('#editor').querySelector('[name="kind"]').value;}d.status='confirmed';announce('Un solo originale in archivio. '+(d.copyAction==='keep'?'Mantenuto invariato.':'Titolo o tipo aggiornati.'));close();render();return;}if(b.hasAttribute('data-confirm-doc')){const d=active.d,title=$('#editor').querySelector('[name="title"]').value.trim(),kind=$('#editor').querySelector('[name="kind"]').value;if(!title)return fail('Inserisci un titolo.');if(d.unreadable&&kind==='altro')return fail('Indica il tipo del documento prima di organizzarlo.');if(d.status==='confirmed'&&!$('#editor').querySelector('[name="replaceDoc"]').checked)return fail('Conferma la modifica dei dati già archiviati.');d.title=title;d.kind=kind;d.status='confirmed';d.unreadable=false;d.selected=false;announce('Documento organizzato in '+collection(d)+'.');close();render();return;}if(b.hasAttribute('data-confirm-item')){captureFields();const {d,i}=active;if(allocationError(i))return fail(allocationError(i));if(needsReview(i))return fail(!i.action?'Scegli se creare, collegare o escludere l’articolo.':i.duplicate&&!i.expense?'Scegli come gestire la spesa già presente.':'Controlla nome, importo, data e l’eventuale consenso alla sostituzione.');if(i.totalOnly&&i.expense==='new'&&(!(Number(i.manualAmount)>0)||Number(i.manualAmount)>d.total))return fail('Indica un importo del singolo articolo maggiore di zero e non superiore al totale ordine.');if(!completeItem(d,i))return fail('La somma dei costi attribuiti supera il totale ordine. Controlla gli importi.');announce(i.action==='exclude'?'Articolo escluso: nessun oggetto e nessuna spesa aggiunti.':i.expense==='new'?'Oggetto e spesa confermati insieme.':i.expense==='existing'?'Oggetto collegato: mantenuta la spesa esistente, senza doppioni.':'Articolo confermato. Nessun nuovo costo registrato.');close();render();return;}if(b.hasAttribute('data-bulk')){for(const d of docs){const sum=d.items.filter(i=>i.expense==='new'&&i.totalOnly&&i.action!=='exclude'&&(i.status==='confirmed'||i.selected)).reduce((n,i)=>n+Math.round(Number(i.manualAmount||0)*100),0);if(d.total&&sum>Math.round(d.total*100)){announce('Gli importi selezionati superano il totale ordine. Nessuna proposta è stata confermata.',true);render();return;}}let n=0;for(const d of docs){if(d.selected&&!d.unreadable&&!d.copy){d.status='confirmed';d.selected=false;n++;}for(const i of d.items)if(i.selected&&completeItem(d,i))n++;}announce(n+(n===1?' proposta confermata.':' proposte confermate.')+' Le altre restano da completare.');render();}});
$('#editor').addEventListener('cancel',()=>{captureFields();active=null;render();});render();
})();
</script></body></html>
