<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dimora V5 · Prototipo navigabile</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;color:#18242a;background:#f7f8f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #996416;outline-offset:2px}.shell{max-width:1200px;margin:0 auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 4px 24px;flex-wrap:wrap}.logo{font-size:28px;font-weight:800;letter-spacing:-1.5px}.dot{color:#11665e}.eyebrow{font-size:11px;color:#66737a;text-transform:uppercase;letter-spacing:.11em}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #dfe6e3;background:#fff;border-radius:12px;padding:11px 15px;color:#42545a}.tab.on{background:#11665e;color:#fff;border-color:#11665e}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}.side{background:#fff;border:1px solid #e3e9e6;border-radius:20px;padding:14px;align-self:start;display:grid;gap:7px}.nav{border:0;background:transparent;color:#455b60;padding:12px 11px;text-align:left;border-radius:10px;width:100%}.nav.on{background:#dcece6;color:#11665e;font-weight:700}.main{min-width:0}.panel{background:white;border:1px solid #e1e8e5;border-radius:20px;padding:23px;margin-bottom:16px;box-shadow:0 4px 18px #132c2707}.panel h1{font-size:26px;letter-spacing:-.8px;margin:4px 0 7px}.panel h2{font-size:17px;margin:0 0 10px}.muted{color:#66737a}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{padding:17px;border:1px solid #e1e8e5;border-radius:15px;background:#fafcfa}.tile strong{display:block;font-size:22px;margin:6px 0}.list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;border:1px solid #e1e8e5;border-radius:13px}.item>div{min-width:0}.btn{padding:11px 15px;border-radius:11px;border:1px solid #11665e;background:#11665e;color:#fff;font-weight:650}.btn.secondary{background:#fff;color:#11665e}.btn.ghost{border-color:#e1e8e5;background:#f8faf9;color:#243c40}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag{display:inline-block;font-size:11px;border:1px solid #cdded7;color:#36695d;padding:5px 9px;border-radius:999px;background:#edf6f1}.tag.warn{color:#865c1e;background:#fff8e7;border-color:#eddfbb}.tag.neutral{color:#556b72;background:#f2f5f5;border-color:#dce5e5}.notice{border-radius:12px;padding:13px;background:#edf6f1;border:1px solid #d6e9df}.warning{background:#fff8e9;border-color:#efddae}label{display:block;margin:10px 0 5px;font-size:13px;font-weight:650}input,select{width:100%;padding:11px;border:1px solid #cbd9d5;border-radius:10px;background:white}.switch{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.phone{max-width:420px;margin:0 auto;background:#fff;border:8px solid #1e3439;border-radius:32px;min-height:510px;overflow:hidden}.phone .panel{border:0;border-radius:0;box-shadow:none;margin:0;padding:18px}.phone-nav{position:sticky;bottom:0;display:flex;justify-content:space-around;padding:12px 4px;background:#f9fcfa;border-top:1px solid #e1e8e5}.phone-nav button{border:0;background:none;font-size:12px;color:#49605d}.phone-nav button.active{font-weight:800;color:#11665e}.flow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}.flow span{padding:6px 9px;background:#e9f0ed;border-radius:9px;font-size:12px}.disclaimer{font-size:12px;color:#66737a;line-height:1.5;padding:12px 4px}@media(max-width:750px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;white-space:nowrap}.side .nav{width:auto}.grid{grid-template-columns:1fr}.panel{padding:16px}.header{gap:11px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style></head><body><div id="app"></div><script>
const S={area:"home",page:"Casa",houseDocs:2,proposal:true,preview:false,invite:false,published:false,issue:false,source:false,view:"",last:""};
const menus={home:["Casa","Attività","Documenti","Spese","Condominio"],agenzie:["Panoramica","Fascicoli","Checklist","Dossier","Home Gift"],amministratori:["Panoramica","Edifici","Memoria tecnica","Pubblicazioni","Segnalazioni"]};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const btn=(t,fn,kind="")=>'<button class="btn '+kind+'" onclick="'+fn+'">'+t+'</button>';
const tag=(t,k="neutral")=>'<span class="tag '+k+'">'+t+'</span>';
const tile=(t,n,s)=>'<div class="tile"><div class="small muted">'+t+'</div><strong>'+n+'</strong><div class="small muted">'+s+'</div></div>';
const item=(t,d,act)=>'<div class="item"><div><strong>'+t+'</strong><div class="small muted">'+d+'</div></div>'+act+'</div>';
function go(a,p){S.area=a;S.page=p||menus[a][0];S.last="";render()}function nav(p){S.page=p;S.last="";render()}function mark(k,msg){S[k]=!S[k];S.last=msg;render()}
function home(){let p=S.page,body='';
if(p==="Casa")body='<div class="eyebrow">La mia casa</div><h1>Casa · Via Roma 12</h1><p class="muted">La memoria della tua abitazione, in un unico posto.</p><div class="grid">'+tile("Documenti",S.houseDocs,"Conservati nella tua Home")+tile("Da rivedere",S.proposal?"1":"0","Proposte da confermare")+tile("Condominio","Collegato","Documenti comuni distinti")+'</div><h2 style="margin-top:22px">I tuoi impianti</h2><div class="list">'+item("Caldaia · da confermare","Dati tecnici da verificare",btn("Apri","nav(\'Attività\')","secondary"))+item("Condominio Via Roma 12","Memoria comune condivisa",btn("Apri","nav(\'Condominio\')","secondary"))+'</div>';
if(p==="Documenti")body='<h1>Documenti</h1><p class="muted">I documenti caricati e quelli pubblicati dall’amministratore restano distinguibili.</p><div class="list">'+item("Manuale caldaia","Archivio personale · versione originale",tag("Personale"))+item("Rapporto ascensore","Amministratore · v3 · pubblicato",tag("Condiviso"))+'</div><div class="actions">'+btn("+ Simula importazione","mark(\'source\',\'Documento dimostrativo aggiunto\')")+'</div>'+(S.source?'<div class="notice">Importazione simulata: originale conservato, analisi e proposte richiedono revisione.</div>':'');
if(p==="Attività")body='<h1>Attività</h1><p class="muted">Scadenze, promemoria e proposte AI.</p>'+ (S.proposal?'<div class="notice warning"><strong>Da rivedere · caldaia</strong><p>Due documenti riportano valori di potenza differenti. Non è possibile determinare automaticamente quale parametro sia corretto.</p>'+btn("Segna come esaminato","mark(\'proposal\',\'Proposta esaminata senza certificare il dato\')","secondary")+'</div>':'<div class="notice">Nessuna proposta aperta in questa demo.</div>')+'<p class="small muted">Nessuna scadenza normativa viene generata da dati tecnici non verificati.</p>';
if(p==="Spese")body='<h1>Spese</h1><p class="muted">Costi documentati e inseriti da te. Nessuna cifra stimata viene presentata come reale.</p>'+item("Intervento manutenzione","Nessun importo registrato",tag("Da integrare"))+item("Spese condominiali","In attesa di dati autorizzati",tag("Non disponibili"));
if(p==="Condominio")body='<h1>Il mio condominio</h1><p class="muted">Via Roma 12 · Scala A · Interno 12</p><div class="grid">'+tile("Documenti comuni","3","Versioni pubblicate")+tile("Comunicazioni","1","Guasto ascensore scala A")+tile("Provenienza","Studio","Amministratore collegato")+'</div><h2 style="margin-top:20px">Aggiornamento pubblico</h2><div class="notice"><strong>Ascensore Scala A</strong><p>Guasto comunicato dall’amministratore. Stato: intervento programmato secondo l’ultima comunicazione pubblicata.</p><div class="small muted">Fonte: amministratore · simulazione</div></div><div class="actions">'+btn("Segnala un problema","mark(\'issue\',\'Puoi comunque segnalare il problema\')")+btn("Consulta documenti","nav(\'Documenti\')","secondary")+'</div>'+(S.issue?'<div class="notice warning" style="margin-top:12px"><strong>Hai trovato un problema simile già comunicato</strong><p>Puoi leggere l’aggiornamento o procedere comunque. La demo non invia messaggi.</p>'+btn("Prepara segnalazione","mark(\'source\',\'Testo pronto da copiare: nessun messaggio inviato\')","secondary")+'</div>':'');
return '<div class="phone"><div class="panel">'+body+'</div><div class="phone-nav">'+["Casa","Attività","Documenti","Spese"].map(t=>'<button class="'+(t===p?'active':'')+'" onclick="nav(\''+t+'\')">'+t+'</button>').join('')+'</div></div>';
}
function agency(){let p=S.page,b='';
if(p==="Panoramica")b='<h1>Benvenuto, Agenzia</h1><p class="muted">Fascicoli documentali e operazioni in corso, senza duplicare il CRM.</p><div class="grid">'+tile("Fascicoli aperti","6","Dati dimostrativi")+tile("Da rivedere","2","Controlli documentali")+tile("Home Gift","1","Pronta da predisporre")+'</div><div class="actions">'+btn("Apri fascicolo","nav(\'Fascicoli\')")+'</div>';
if(p==="Fascicoli")b='<h1>Fascicoli</h1><p class="muted">Incarico · Via Roma 12, int. 12</p>'+item("Fascicolo vendita","Raccolta documentale attiva · 8 file ricevuti",tag("Ricevuto ≠ verificato","warn"))+'<div class="actions">'+btn("Vai alla checklist","nav(\'Checklist\')")+btn("Apri dossier","nav(\'Dossier\')","secondary")+'</div>';
if(p==="Checklist")b='<h1>Checklist collaborativa C+</h1><p class="muted">Richieste contestuali, ruoli assegnati e suggerimenti approvati dall’agente.</p><div class="list">'+item("APE","Ricevuto dal proprietario · controllo non completato",tag("Da verificare","warn"))+item("Documenti impianto","Richiesta inviata al proprietario",tag("Richiesto"))+item("Planimetria","Ricevuta · la verifica resta al professionista",tag("Ricevuto"))+'</div><div class="actions">'+btn("Vai al dossier","nav(\'Dossier\')")+'</div>';
if(p==="Dossier")b='<h1>Dossier acquirente</h1><p class="muted">Tre livelli di accesso, diversi per contenuti e permessi.</p><div class="grid">'+tile("Anteprima","1","Solo informazioni divulgabili")+tile("Dossier riservato","2","Accessi per documento")+tile("Home Gift","3","Consegna separata")+'</div><div class="actions">'+btn("Prepara Home Gift","nav(\'Home Gift\')")+'</div>';
if(p==="Home Gift")b='<h1>Prepara Home Gift</h1><p class="muted">La nuova Home non viene creata automaticamente.</p><div class="notice">✓ Documenti selezionati<br>✓ Schede asset autorizzate<br>✓ Provenienza e versioni<br>✓ Esclusioni e permessi da confermare</div><label>Email destinatario (solo demo)</label><input id="giftmail" type="email" placeholder="nuovo.proprietario@esempio.it"><div class="actions">'+btn("Simula invito","mark(\'invite\',\'Invito simulato: non è stata inviata alcuna email\')")+'</div>'+(S.invite?'<div class="notice">Invito predisposto nella demo. Il destinatario dovrà verificare email e autorizzazione.</div>':'');
return b;
}
function admin(){let p=S.page,b='';
if(p==="Panoramica")b='<h1>Portfolio condominiale</h1><p class="muted">Memoria tecnica e attenzioni trasversali.</p><div class="grid">'+tile("Edifici","12","Esempio dimostrativo")+tile("Da rivedere","4","Documenti/impianti")+tile("Comunicazioni","1","Aggiornamento ascensore")+'</div><div class="actions">'+btn("Apri edificio","nav(\'Edifici\')")+'</div>';
if(p==="Edifici")b='<h1>Edifici</h1>'+item("Condominio Via Roma 12","Scala A · impianti e documenti comuni",btn("Apri","nav(\'Memoria tecnica\')","secondary"))+'<div class="actions">'+btn("Memoria tecnica","nav(\'Memoria tecnica\')")+'</div>';
if(p==="Memoria tecnica")b='<h1>Memoria tecnica</h1><p class="muted">Navigazione per impianti e documenti, senza duplicare il gestionale.</p><div class="list">'+item("Ascensore Scala A","Rapporto v3 · documento comune",tag("Pubblicabile"))+item("Centrale termica","Libretto presente · dati da verificare",tag("Da rivedere","warn"))+'</div><div class="actions">'+btn("Pubblica alle Home","nav(\'Pubblicazioni\')")+'</div>';
if(p==="Pubblicazioni")b='<h1>Pubblicazione selettiva</h1><p class="muted">Scegli contenuti e destinatari. Niente pubblicazione automatica su importazione.</p><label>Contenuto</label><select><option>Rapporto ascensore v3</option><option>Aggiornamento guasto ascensore</option></select><label>Destinatari</label><select><option>Scala A · Unità autorizzate</option><option>Intero edificio · Documenti comuni</option></select><p class="small muted">Una pubblicazione informativa aggiorna la vista condivisa; modifiche alle schede private restano proposte da rivedere.</p><div class="actions">'+btn("Simula pubblicazione","mark(\'published\',\'Pubblicazione dimostrativa: nessun dato reale distribuito\')")+'</div>'+(S.published?'<div class="notice">Pubblicazione simulata. Nessun documento è stato inviato ad account reali.</div>':'');
if(p==="Segnalazioni")b='<h1>Segnalazioni intelligenti</h1><p class="muted">Informazioni pubblicate e richieste dei condòmini: non un secondo sistema di ticketing.</p>'+item("Ascensore Scala A","Comunicazione di guasto pubblicata · fonte amministratore",tag("Informazione pubblicata"))+'<div class="notice warning"><strong>Riduzione delle richieste ripetitive: ipotesi da misurare</strong><p>La consultazione di un aggiornamento non dimostra che una richiesta sia stata evitata.</p></div><div class="actions">'+btn("Vedi esperienza proprietario","go(\'home\',\'Condominio\')")+'</div>';
return b;
}
function render(){let app=document.getElementById("app"),menu=menus[S.area];app.innerHTML='<div class="shell"><div class="header"><div><div class="logo">dimora<span class="dot">.</span></div><div class="eyebrow">V5 · prototipo navigabile</div></div><div class="tabs">'+[['home','Home'],['agenzie','Partner Agenzie'],['amministratori','Partner Amministratori']].map(([k,t])=>'<button class="tab '+(S.area===k?'on':'')+'" onclick="go(\''+k+'\')">'+t+'</button>').join('')+'</div></div><div class="layout"><aside class="side">'+menu.map(m=>'<button class="nav '+(S.page===m?'on':'')+'" onclick="nav(\''+m+'\')">'+m+'</button>').join('')+'</aside><main class="main">'+(S.area==="home"?home():'<div class="panel">'+(S.area==="agenzie"?agency():admin())+'</div>')+(S.last?'<div class="notice" role="status">'+esc(S.last)+'</div>':'')+'<div class="disclaimer">Prototipo UX con dati fittizi. Nessun invio, trattamento AI, controllo normativo, permesso o pubblicazione reale; le interazioni illustrano comportamenti di prodotto ancora da implementare e testare.</div></main></div></div>'}render();
</script></body></html>
